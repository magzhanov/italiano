n the window, please?"},{"id":21,"content_id":"B1-I21","it":"figurati","en":"no problem / don't mention it","example_it":"Grazie per l'aiuto. Figurati!","example_en":"Thanks for the help. Don't mention it!"},{"id":22,"content_id":"B1-I22","it":"di niente","en":"you're welcome","example_it":"Grazie mille! Di niente.","example_en":"Thanks a lot! You're welcome."},{"id":23,"content_id":"B1-I23","it":"scusa il disturbo","en":"sorry to bother you","example_it":"Scusa il disturbo, hai un minuto?","example_en":"Sorry to bother you, do you have a minute?"},{"id":24,"content_id":"B1-I24","it":"non c'è problema","en":"no problem","example_it":"Arrivo un po' tardi. Non c'è problema.","example_en":"I'll arrive a little late. No problem."},{"id":25,"content_id":"B1-I25","it":"fa niente","en":"never mind","example_it":"Ho dimenticato il libro. Fa niente.","example_en":"I forgot the book. Never mind."},{"id":26,"content_id":"B1-I26","it":"non lo so","en":"I don't know","example_it":"Dov'è Luca? Non lo so.","example_en":"Where is Luca? I don't know."},{"id":27,"content_id":"B1-I27","it":"non ho capito","en":"I didn't understand","example_it":"Puoi ripetere? Non ho capito.","example_en":"Can you repeat? I didn't understand."},{"id":28,"content_id":"B1-I28","it":"un momento","en":"one moment","example_it":"Un momento, sto cercando le chiavi.","example_en":"One moment, I'm looking for the keys."},{"id":29,"content_id":"B1-I29","it":"aspetta un attimo","en":"wait a second","example_it":"Aspetta un attimo, arrivo subito.","example_en":"Wait a second, I'll be right there."},{"id":30,"content_id":"B1-I30","it":"subito dopo","en":"immediately afterward","example_it":"Finiamo il pranzo e subito dopo usciamo.","example_en":"We finish lunch and go out immediately afterward."},{"id":31,"content_id":"B1-I31","it":"fra poco","en":"in a little while","example_it":"Il film comincia fra poco.","example_en":"The film starts in a little while."},{"id":32,"content_id":"B1-I32","it":"a volte","en":"sometimes","example_it":"A volte studio in biblioteca.","example_en":"Sometimes I study in the library."},{"id":33,"content_id":"B1-I33","it":"quasi mai","en":"hardly ever","example_it":"Quasi mai prendo il taxi.","example_en":"I hardly ever take a taxi."},{"id":34,"content_id":"B1-I34","it":"ogni tanto","en":"every now and then","example_it":"Ogni tanto andiamo al mercato.","example_en":"Every now and then we go to the market."},{"id":35,"content_id":"B1-I35","it":"in genere","en":"generally","example_it":"In genere lavoro fino alle cinque.","example_en":"I generally work until five."},{"id":36,"content_id":"B1-I36","it":"per esempio","en":"for example","example_it":"Prendiamo una bevanda, per esempio un tè.","example_en":"Let's have a drink, for example some tea."},{"id":37,"content_id":"B1-I37","it":"più o meno","en":"more or less","example_it":"Ho capito più o meno la domanda.","example_en":"I understood the question more or less."},{"id":38,"content_id":"B1-I38","it":"va tutto bene","en":"everything is going well","example_it":"Non ti preoccupare, va tutto bene.","example_en":"Don't worry, everything is going well."},{"id":39,"content_id":"B1-I39","it":"ho bisogno di","en":"I need","example_it":"Ho bisogno di un bicchiere d'acqua.","example_en":"I need a glass of water."},{"id":40,"content_id":"B1-I40","it":"ho voglia di","en":"I feel like / I fancy","example_it":"Ho voglia di una pizza stasera.","example_en":"I feel like having pizza tonight."},{"id":41,"content_id":"B1-I41","it":"mi piace molto","en":"I really like","example_it":"Mi piace molto questa città.","example_en":"I really like this city."},{"id":42,"content_id":"B1-I42","it":"non mi piace","en":"I don't like","example_it":"Non mi piace il caffè freddo.","example_en":"I don't like cold coffee."},{"id":43,"content_id":"B1-I43","it":"che bello!","en":"how lovely!","example_it":"Hai trovato lavoro? Che bello!","example_en":"You found a job? How lovely!"},{"id":44,"content_id":"B1-I44","it":"che peccato!","en":"what a shame!","example_it":"Il museo è chiuso? Che peccato!","example_en":"The museum is closed? What a shame!"},{"id":45,"content_id":"B1-I45","it":"che sorpresa!","en":"what a surprise!","example_it":"Sei qui anche tu? Che sorpresa!","example_en":"You're here too? What a surprise!"},{"id":46,"content_id":"B1-I46","it":"che ore sono?","en":"what time is it?","example_it":"Scusa, che ore sono?","example_en":"Excuse me, what time is it?"},{"id":47,"content_id":"B1-I47","it":"quanto costa?","en":"how much does it cost?","example_it":"Quanto costa questo biglietto?","example_en":"How much does this ticket cost?"},{"id":48,"content_id":"B1-I48","it":"dov'è il bagno?","en":"where is the bathroom?","example_it":"Mi scusi, dov'è il bagno?","example_en":"Excuse me, where is the bathroom?"},{"id":49,"content_id":"B1-I49","it":"mi chiamo","en":"my name is","example_it":"Mi chiamo Giulia e abito a Roma.","example_en":"My name is Giulia and I live in Rome."},{"id":50,"content_id":"B1-I50","it":"piacere di conoscerti","en":"nice to meet you","example_it":"Sono Marco, piacere di conoscerti.","example_en":"I'm Marco, nice to meet you."}],"grammar":[{"id":1,"content_id":"B1-G01","category":"Articles","prompt":"___ fratello è a casa.","answer":"Mio","explanation":"Use the possessive mio before singular fratello in this sentence.","english":"My brother is at home."},{"id":2,"content_id":"B1-G02","category":"Articles","prompt":"___ sorella studia italiano.","answer":"Mia","explanation":"Use mia with the feminine singular noun sorella.","english":"My sister studies Italian."},{"id":3,"content_id":"B1-G03","category":"Articles","prompt":"___ zio arriva domani.","answer":"Lo","explanation":"Lo is the definite article before z + consonant.","english":"The uncle arrives tomorrow."},{"id":4,"content_id":"B1-G04","category":"Articles","prompt":"___ amica è italiana.","answer":"L’","explanation":"Elision of la before a vowel.","english":"My female friend is Italian."},{"id":5,"content_id":"B1-G05","category":"Articles","prompt":"___ studenti sono pronti.","answer":"Gli","explanation":"Gli is used before s + consonant and vowels in masculine plural.","english":"The students are ready."},{"id":6,"content_id":"B1-G06","category":"Prepositions","prompt":"Abito ___ Milano.","answer":"a","explanation":"Use a with city names.","english":"I live in Milan."},{"id":7,"content_id":"B1-G07","category":"Prepositions","prompt":"Vengo ___ Roma.","answer":"da","explanation":"Use da to express origin from a city.","english":"I come from Rome."},{"id":8,"content_id":"B1-G08","category":"Prepositions","prompt":"Il libro è ___ tavolo.","answer":"sul","explanation":"Su + il contracts to sul.","english":"The book is on the table."},{"id":9,"content_id":"B1-G09","category":"Prepositions","prompt":"Vado ___ scuola.","answer":"a","explanation":"A scuola is a fixed everyday destination.","english":"I go to school."},{"id":10,"content_id":"B1-G10","category":"Prepositions","prompt":"Il treno parte ___ otto.","answer":"alle","explanation":"A + le gives alle before a clock time.","english":"The train leaves at eight."},{"id":11,"content_id":"B1-G11","category":"Question words","prompt":"___ ti chiami?","answer":"Come","explanation":"Come asks how or what someone is called.","english":"What's your name?"},{"id":12,"content_id":"B1-G12","category":"Question words","prompt":"___ abiti?","answer":"Dove","explanation":"Dove asks about place.","english":"Where do you live?"},{"id":13,"content_id":"B1-G13","category":"Question words","prompt":"___ costa questo libro?","answer":"Quanto","explanation":"Quanto asks about an amount or price.","english":"How much does this book cost?"},{"id":14,"content_id":"B1-G14","category":"Question words","prompt":"___ arrivi domani?","answer":"Quando","explanation":"Quando asks about time.","english":"When are you arriving tomorrow?"},{"id":15,"content_id":"B1-G15","category":"Question words","prompt":"___ non vieni?","answer":"Perché","explanation":"Perché asks for a reason.","english":"Why aren't you coming?"},{"id":16,"content_id":"B1-G16","category":"Pronouns","prompt":"___ sono uno studente.","answer":"Io","explanation":"Io is the first-person subject pronoun.","english":"I am a student."},{"id":17,"content_id":"B1-G17","category":"Pronouns","prompt":"___ sei pronta?","answer":"Tu","explanation":"Tu is the second-person singular subject.","english":"Are you ready? (singular informal)"},{"id":18,"content_id":"B1-G18","category":"Pronouns","prompt":"___ siamo amici.","answer":"Noi","explanation":"Noi means we.","english":"We are friends."},{"id":19,"content_id":"B1-G19","category":"Pronouns","prompt":"___ siete in ritardo.","answer":"Voi","explanation":"Voi is plural you.","english":"Are you late? (plural)"},{"id":20,"content_id":"B1-G20","category":"Pronouns","prompt":"___ sono a casa.","answer":"Loro","explanation":"Loro means they.","english":"They are at home."},{"id":21,"content_id":"B1-G21","category":"Conjunctions","prompt":"Studio ___ lavoro.","answer":"e","explanation":"E joins two coordinated actions.","english":"I study and work."},{"id":22,"content_id":"B1-G22","category":"Conjunctions","prompt":"Vorrei uscire, ___ piove.","answer":"ma","explanation":"Ma contrasts two statements.","english":"I'd like to go out, but it's raining."},{"id":23,"content_id":"B1-G23","category":"Conjunctions","prompt":"Resto a casa ___ sono stanco.","answer":"perché","explanation":"Perché introduces a reason.","english":"I'm staying home because I'm tired."},{"id":24,"content_id":"B1-G24","category":"Conjunctions","prompt":"Vuoi tè ___ caffè?","answer":"o","explanation":"O introduces an alternative.","english":"Would you like tea or coffee?"},{"id":25,"content_id":"B1-G25","category":"Conjunctions","prompt":"Vado in centro ___ comprare il pane.","answer":"per","explanation":"Per + infinitive expresses purpose.","english":"I'm going downtown to buy bread."},{"id":26,"content_id":"B1-G26","category":"Negation and particles","prompt":"Oggi ___ lavoro.","answer":"non","explanation":"Non appears before a finite verb.","english":"I'm not working today."},{"id":27,"content_id":"B1-G27","category":"Negation and particles","prompt":"Non esco ___, sono stanco.","answer":"mai","explanation":"Non ... mai means never.","english":"I never go out; I'm tired."},{"id":28,"content_id":"B1-G28","category":"Negation and particles","prompt":"Ci sei ___ tu?","answer":"anche","explanation":"Anche means also or too.","english":"Are you there too?"},{"id":29,"content_id":"B1-G29","category":"Negation and particles","prompt":"È ___ tardi per partire.","answer":"troppo","explanation":"Troppo means too, excessively.","english":"It's too late to leave."},{"id":30,"content_id":"B1-G30","category":"Negation and particles","prompt":"Sono ___ arrivato.","answer":"già","explanation":"Già means already.","english":"I've already arrived."},{"id":31,"content_id":"B1-G31","category":"Agreement","prompt":"La casa è ___.","answer":"grande","explanation":"Grande agrees with a singular feminine noun without changing its ending.","english":"The house is big."},{"id":32,"content_id":"B1-G32","category":"Agreement","prompt":"Le case sono ___.","answer":"grandi","explanation":"Plural of grande is grandi.","english":"The houses are big."},{"id":33,"content_id":"B1-G33","category":"Agreement","prompt":"I ragazzi sono ___.","answer":"stanchi","explanation":"Masculine plural of stanco is stanchi.","english":"The boys are tired."},{"id":34,"content_id":"B1-G34","category":"Agreement","prompt":"La sorella è ___.","answer":"contenta","explanation":"Feminine singular adjective ends in -a.","english":"The sister is happy."},{"id":35,"content_id":"B1-G35","category":"Agreement","prompt":"Due libri ___.","answer":"nuovi","explanation":"Masculine plural of nuovo ends in -i.","english":"Two new books."},{"id":36,"content_id":"B1-G36","category":"Clitics and common forms","prompt":"___ piace il caffè.","answer":"Mi","explanation":"Mi marks the person who likes something.","english":"I like coffee."},{"id":37,"content_id":"B1-G37","category":"Clitics and common forms","prompt":"___ chiamo Anna.","answer":"Mi","explanation":"Mi is used in the reflexive expression mi chiamo.","english":"My name is Anna."},{"id":38,"content_id":"B1-G38","category":"Clitics and common forms","prompt":"Non ___ capisco.","answer":"ti","explanation":"Ti refers to you as a direct object here.","english":"I don't understand you."},{"id":39,"content_id":"B1-G39","category":"Clitics and common forms","prompt":"___ vediamo domani.","answer":"Ci","explanation":"Ci vediamo means see you.","english":"See you tomorrow."},{"id":40,"content_id":"B1-G40","category":"Clitics and common forms","prompt":"___ è un problema.","answer":"Non","explanation":"Non negates a statement.","english":"It's not a problem."},{"id":41,"content_id":"B1-G41","category":"Articles","prompt":"___ sorella studia italiano.","answer":"La","explanation":"Feminine singular definite article.","english":"The sister studies Italian."},{"id":42,"content_id":"B1-G42","category":"Articles","prompt":"Ho ___ libro nuovo.","answer":"un","explanation":"Masculine singular indefinite article.","english":"I have a new book."},{"id":43,"content_id":"B1-G43","category":"Articles","prompt":"Vedo ___ amici al parco.","answer":"gli","explanation":"Gli before masculine plural amici.","english":"I see the friends at the park."},{"id":44,"content_id":"B1-G44","category":"Articles","prompt":"___ zio vive a Roma.","answer":"Lo","explanation":"Lo before masculine singular zio.","english":"The uncle lives in Rome."},{"id":45,"content_id":"B1-G45","category":"Articles","prompt":"Vorrei ___ arancia.","answer":"un’","explanation":"Un’ before a feminine noun starting with a vowel.","english":"I'd like an orange."},{"id":46,"content_id":"B1-G46","category":"Prepositions","prompt":"Parto ___ Roma domani.","answer":"per","explanation":"Partire per introduces a destination.","english":"I'm leaving for Rome tomorrow."},{"id":47,"content_id":"B1-G47","category":"Prepositions","prompt":"Sono ___ ufficio.","answer":"in","explanation":"In ufficio is the standard expression.","english":"I'm at the office."},{"id":48,"content_id":"B1-G48","category":"Prepositions","prompt":"Torno ___ casa alle otto.","answer":"a","explanation":"A casa is the normal expression.","english":"I'm returning home at eight."},{"id":49,"content_id":"B1-G49","category":"Prepositions","prompt":"Il libro è ___ tavolo.","answer":"sul","explanation":"Su + il contracts to sul.","english":"The book is on the table."},{"id":50,"content_id":"B1-G50","category":"Prepositions","prompt":"Esco ___ amici stasera.","answer":"con gli","explanation":"Con gli introduces masculine plural friends.","english":"I'm going out with friends tonight."},{"id":51,"content_id":"B1-G51","category":"Question words","prompt":"___ anni hai?","answer":"Quanti","explanation":"Quanti modifies masculine plural anni.","english":"How old are you?"},{"id":52,"content_id":"B1-G52","category":"Question words","prompt":"___ è il tuo compleanno?","answer":"Quando","explanation":"Quando asks when.","english":"When is your birthday?"},{"id":53,"content_id":"B1-G53","category":"Question words","prompt":"___ abiti?","answer":"Dove","explanation":"Dove asks where.","english":"Where do you live?"},{"id":54,"content_id":"B1-G54","category":"Question words","prompt":"___ costa il biglietto?","answer":"Quanto","explanation":"Quanto asks how much.","english":"How much does the ticket cost?"},{"id":55,"content_id":"B1-G55","category":"Question words","prompt":"___ studi italiano?","answer":"Perché","explanation":"Perché asks why.","english":"Why do you study Italian?"},{"id":56,"content_id":"B1-G56","category":"Pronouns","prompt":"___ siamo italiani.","answer":"Noi","explanation":"Noi is first-person plural.","english":"We are Italian."},{"id":57,"content_id":"B1-G57","category":"Pronouns","prompt":"Vedo Marco e ___ saluto.","answer":"lo","explanation":"Lo refers to Marco.","english":"I see Marco and greet him."},{"id":58,"content_id":"B1-G58","category":"Pronouns","prompt":"Chiami Anna? Sì, ___ chiamo.","answer":"la","explanation":"La is a feminine singular direct-object pronoun.","english":"Are you calling Anna? Yes, I'm calling her."},{"id":59,"content_id":"B1-G59","category":"Pronouns","prompt":"Ho due libri; ___ leggo stasera.","answer":"li","explanation":"Li refers to masculine plural libri.","english":"I have two books; I'll read them tonight."},{"id":60,"content_id":"B1-G60","category":"Pronouns","prompt":"___ siete pronti?","answer":"Voi","explanation":"Voi is second-person plural.","english":"Are you ready? (plural)"},{"id":61,"content_id":"B1-G61","category":"Conjunctions","prompt":"Non esco ___ piove.","answer":"perché","explanation":"Perché introduces a reason.","english":"I'm not going out because it's raining."},{"id":62,"content_id":"B1-G62","category":"Conjunctions","prompt":"Io cucino ___ tu apparecchi.","answer":"mentre","explanation":"Mentre means while.","english":"I cook while you set the table."},{"id":63,"content_id":"B1-G63","category":"Conjunctions","prompt":"Vuoi acqua ___ succo?","answer":"o","explanation":"O expresses an alternative.","english":"Do you want water or juice?"},{"id":64,"content_id":"B1-G64","category":"Conjunctions","prompt":"Esco ___ torno presto.","answer":"ma","explanation":"Ma expresses contrast.","english":"I'm going out, but I'll return soon."},{"id":65,"content_id":"B1-G65","category":"Conjunctions","prompt":"Ti telefono ___ arrivo.","answer":"quando","explanation":"Quando introduces the time.","english":"I'll call you when I arrive."},{"id":66,"content_id":"B1-G66","category":"Negation and particles","prompt":"Non voglio ___.","answer":"niente","explanation":"Niente means anything/nothing with non.","english":"I don't want anything."},{"id":67,"content_id":"B1-G67","category":"Negation and particles","prompt":"Non ci vado ___.","answer":"mai","explanation":"Non ... mai means never.","english":"I never go there."},{"id":68,"content_id":"B1-G68","category":"Negation and particles","prompt":"Sono ___ stanco.","answer":"molto","explanation":"Molto intensifies the adjective.","english":"I'm very tired."},{"id":69,"content_id":"B1-G69","category":"Negation and particles","prompt":"Ho ___ fame.","answer":"ancora","explanation":"Ancora means still.","english":"I'm still hungry."},{"id":70,"content_id":"B1-G70","category":"Negation and particles","prompt":"Non ho ___ soldi.","answer":"abbastanza","explanation":"Abbastanza means enough.","english":"I don't have enough money."},{"id":71,"content_id":"B1-G71","category":"Agreement","prompt":"Un ragazzo ___.","answer":"simpatico","explanation":"Masculine singular adjective.","english":"A friendly boy."},{"id":72,"content_id":"B1-G72","category":"Agreement","prompt":"Due ragazze ___.","answer":"simpatiche","explanation":"Feminine plural ending -e.","english":"Two friendly girls."},{"id":73,"content_id":"B1-G73","category":"Agreement","prompt":"Una macchina ___.","answer":"nuova","explanation":"Feminine singular ending -a.","english":"A new car."},{"id":74,"content_id":"B1-G74","category":"Agreement","prompt":"Due libri ___.","answer":"interessanti","explanation":"Plural adjective ending -i.","english":"Two interesting books."},{"id":75,"content_id":"B1-G75","category":"Agreement","prompt":"La pizza è ___.","answer":"buona","explanation":"Feminine singular agreement.","english":"The pizza is good."},{"id":76,"content_id":"B1-G76","category":"Clitics and common forms","prompt":"___ chiamo Luca.","answer":"Mi","explanation":"Mi chiamo means my name is.","english":"My name is Luca."},{"id":77,"content_id":"B1-G77","category":"Clitics and common forms","prompt":"A Maria ___ piace leggere.","answer":"le","explanation":"Le is the indirect-object clitic for her.","english":"Maria likes reading."},{"id":78,"content_id":"B1-G78","category":"Clitics and common forms","prompt":"___ vediamo domani.","answer":"Ci","explanation":"Ci vediamo means see you.","english":"See you tomorrow."},{"id":79,"content_id":"B1-G79","category":"Clitics and common forms","prompt":"Mi dai il libro? Sì, ___ do.","answer":"te lo","explanation":"Te lo combines to you + it.","english":"Can you give me the book? Yes, I'll give it to you."},{"id":80,"content_id":"B1-G80","category":"Clitics and common forms","prompt":"Puoi aiutarmi? Sì, ___ aiuto.","answer":"ti","explanation":"Ti is an object pronoun for you.","english":"Can you help me? Yes, I'll help you."}],"course_version":"2026-11"},{"block_id":"ITALIAN-BLOCK-02","version":"2.1.0","language":"it","curriculum":"Four-track Italian course, block 2 of 4: vocabulary, verbs, idioms, grammar/function words; reading and listening.","edition":"2026-11-04","vocabulary":[{"id":1,"content_id":"B2-W001","batch_id":1,"category":"Rooms and spaces","it":"la cucina","en":"kitchen","example_it":"La cucina dà sul cortile.","example_en":"The kitchen looks onto the courtyard.","part_of_speech":"noun","gender":"feminine","plural_only":false},{"id":2,"content_id":"B2-W002","batch_id":1,"category":"Rooms and spaces","it":"il salotto","en":"living room","example_it":"Ci incontriamo in salotto alle otto.","example_en":"We'll meet in the living room at eight.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":3,"content_id":"B2-W003","batch_id":1,"category":"Rooms and spaces","it":"il corridoio","en":"corridor / hallway","example_it":"In fondo al corridoio c'è una porta blu.","example_en":"At the end of the hallway there is a blue door.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":4,"content_id":"B2-W004","batch_id":1,"category":"Rooms and spaces","it":"il balcone","en":"balcony","example_it":"Sul balcone crescono tre piante.","example_en":"Three plants grow on the balcony.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":5,"content_id":"B2-W005","batch_id":1,"category":"Rooms and spaces","it":"il soffitto","en":"ceiling","example_it":"Il soffitto di questa stanza è molto alto.","example_en":"The ceiling in this room is very high.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":6,"content_id":"B2-W006","batch_id":1,"category":"Rooms and spaces","it":"il pavimento","en":"floor","example_it":"Il pavimento è bagnato: fai attenzione.","example_en":"The floor is wet: be careful.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":7,"content_id":"B2-W007","batch_id":1,"category":"Rooms and spaces","it":"il muro","en":"wall","example_it":"Abbiamo appeso una fotografia al muro.","example_en":"We hung a photograph on the wall.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":8,"content_id":"B2-W008","batch_id":1,"category":"Rooms and spaces","it":"lo specchio","en":"mirror","example_it":"C'è uno specchio accanto alla finestra.","example_en":"There is a mirror next to the window.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":9,"content_id":"B2-W009","batch_id":1,"category":"Rooms and spaces","it":"l'armadio","en":"wardrobe / closet","example_it":"Il cappotto è nell'armadio.","example_en":"The coat is in the wardrobe.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":10,"content_id":"B2-W010","batch_id":1,"category":"Rooms and spaces","it":"il divano","en":"sofa","example_it":"Dopo il lavoro mi siedo sul divano.","example_en":"After work I sit on the sofa.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":11,"content_id":"B2-W011","batch_id":1,"category":"Household objects","it":"il frigorifero","en":"refrigerator","example_it":"Metti il latte nel frigorifero.","example_en":"Put the milk in the refrigerator.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":12,"content_id":"B2-W012","batch_id":1,"category":"Household objects","it":"il forno","en":"oven","example_it":"Il pane è già nel forno.","example_en":"The bread is already in the oven.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":13,"content_id":"B2-W013","batch_id":1,"category":"Household objects","it":"il fornello","en":"stove burner","example_it":"Spegni il fornello prima di uscire.","example_en":"Turn off the burner before going out.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":14,"content_id":"B2-W014","batch_id":1,"category":"Household objects","it":"il lavandino","en":"sink","example_it":"C'è una tazza nel lavandino.","example_en":"There is a cup in the sink.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":15,"content_id":"B2-W015","batch_id":1,"category":"Household objects","it":"la lavatrice","en":"washing machine","example_it":"La lavatrice finisce tra dieci minuti.","example_en":"The washing machine finishes in ten minutes.","part_of_speech":"noun","gender":"feminine","plural_only":false},{"id":16,"content_id":"B2-W016","batch_id":1,"category":"Household objects","it":"la doccia","en":"shower","example_it":"La doccia funziona finalmente bene.","example_en":"The shower finally works properly.","part_of_speech":"noun","gender":"feminine","plural_only":false},{"id":17,"content_id":"B2-W017","batch_id":1,"category":"Household objects","it":"l'asciugamano","en":"towel","example_it":"Prendi un asciugamano pulito.","example_en":"Take a clean towel.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":18,"content_id":"B2-W018","batch_id":1,"category":"Household objects","it":"il sapone","en":"soap","example_it":"Il sapone è vicino al lavandino.","example_en":"The soap is near the sink.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":19,"content_id":"B2-W019","batch_id":1,"category":"Household objects","it":"la lampada","en":"lamp","example_it":"Accendo la lampada quando leggo.","example_en":"I turn on the lamp when I read.","part_of_speech":"noun","gender":"feminine","plural_only":false},{"id":20,"content_id":"B2-W020","batch_id":1,"category":"Household objects","it":"la presa","en":"electrical socket","example_it":"La presa è dietro la scrivania.","example_en":"The socket is behind the desk.","part_of_speech":"noun","gender":"feminine","plural_only":false},{"id":21,"content_id":"B2-W021","batch_id":1,"category":"Moving around town","it":"la bicicletta","en":"bicycle","example_it":"Vado in biblioteca in bicicletta.","example_en":"I go to the library by bicycle.","part_of_speech":"noun","gender":"feminine","plural_only":false},{"id":22,"content_id":"B2-W022","batch_id":1,"category":"Moving around town","it":"il tram","en":"tram","example_it":"Il tram passa ogni sette minuti.","example_en":"The tram comes every seven minutes.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":23,"content_id":"B2-W023","batch_id":1,"category":"Moving around town","it":"il binario","en":"platform / track","example_it":"Il treno per Torino parte dal binario cinque.","example_en":"The train to Turin leaves from platform five.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":24,"content_id":"B2-W024","batch_id":1,"category":"Moving around town","it":"la coincidenza","en":"connection / transfer","example_it":"Abbiamo solo sei minuti per la coincidenza.","example_en":"We have only six minutes for the connection.","part_of_speech":"noun","gender":"feminine","plural_only":false},{"id":25,"content_id":"B2-W025","batch_id":1,"category":"Moving around town","it":"il ritardo","en":"delay","example_it":"Il volo ha un ritardo di mezz'ora.","example_en":"The flight has a half-hour delay.","part_of_speech":"noun","gender":"masculine","plural_only":false},{"id":26,"content_id":"B2-W026","batch_id":1,"category":"Moving around town","it":"l'orario","en":"schedule / timetable","example_it":"Controlla l'orario prima di partire.","example_en":"Check the timetable before leaving.","part_of_speech":"noun","gender":"masc saporto, anche se per Firenze il passaporto non serviva.\n\nIl viaggio non è cominciato bene. Alla stazione il tabellone indicava un ritardo di venticinque minuti. Alice aveva una coincidenza a Bologna e non sapeva se sarebbe riuscita a prendere il secondo treno. Ha controllato l'orario sul telefono, ma la connessione funzionava male. Un signore seduto accanto a lei ha visto la sua espressione nervosa e le ha chiesto che cosa fosse successo. Alice gli ha spiegato il problema. Il signore ha sorriso e le ha detto: «Viaggio su questa linea ogni settimana. La coincidenza è difficile, ma c'è un altro treno mezz'ora dopo». Alice ha ringraziato. Di solito cercava tutte le risposte sullo schermo; quella mattina aveva trovato una risposta parlando con una persona sconosciuta.\n\nSul treno Alice ha aperto il quaderno. Accanto alla voce «imparare una lingua straniera» aveva scritto una piccola nota: «Bastano dieci parole al giorno». Si è ricordata del suo primo corso di italiano, quando non riusciva neppure a distinguere il passato prossimo dall'imperfetto. Aveva studiato per una settimana, poi aveva interrotto tutto perché voleva risultati immediati. Adesso seguiva un metodo diverso. Ogni mattina ripeteva alcune parole, durante la pausa pranzo ascoltava un dialogo e la sera scriveva tre frasi. Non sempre aveva voglia di studiare, ma la piccola abitudine era diventata parte della sua giornata. Ha sottolineato la vecchia nota e ha aggiunto: «Non contare soltanto le parole che hai visto; conta quelle che sai usare».\n\nQuando è arrivata a Firenze, pioveva leggermente. Alice aveva prenotato una camera in un piccolo albergo vicino al centro, ma all'indirizzo indicato non c'era nessuna insegna. Ha chiamato la receptionist e ha scoperto che l'ingresso si trovava in una strada laterale, attraverso un cortile. La receptionist, una donna gentile con una sciarpa verde, le ha dato la chiave e le ha mostrato la camera. Era piccola, ma luminosa, con una finestra sul tetto di un teatro. Dal balcone comune si vedeva una parte della città. Alice ha lasciato la valigia, si è cambiata e ha deciso di uscire nonostante la pioggia. Aveva soltanto due giorni, e non voleva passarli a controllare le previsioni.\n\nCamminando lungo una strada stretta, Alice ha visto l'annuncio di una mostra fotografica. L'ingresso era gratuito e mancava ancora un'ora all'appuntamento con la sua amica Giulia. È entrata. Le fotografie mostravano luoghi ordinari: un mercato alla mattina, un tram sotto la nebbia, una cucina durante una festa e due persone che discutevano davanti a un bar. Una fotografia rappresentava una donna con una valigia rossa, seduta su una panchina vuota. Alice è rimasta a guardarla più a lungo delle altre. Non sapeva nulla di quella donna, ma immaginava che stesse aspettando qualcuno. Accanto alla foto c'era una frase dell'autrice: «Anche l'attesa è una forma di viaggio». Alice l'ha copiata sul quaderno.\n\nGiulia è arrivata con dieci minuti di ritardo e si è scusata. «Il tram è rimasto fermo a un incrocio», ha spiegato. Alice ha risposto che non aveva fretta. Le due amiche non si vedevano da quasi un anno. All'inizio hanno parlato delle solite cose: il lavoro, la famiglia, il costo degli affitti, i progetti per l'inverno. Poi Giulia ha raccontato di aver rifiutato un'offerta di lavoro molto ben pagata. Alice era sorpresa. «Perché? Pensavo che fosse proprio il tuo obiettivo». Giulia ha spiegato che avrebbe dovuto trasferirsi lontano dalla famiglia e lavorare quasi ogni fine settimana. «Lo stipendio era un vantaggio», ha detto, «ma non era l'unica cosa importante». Alice ha ripensato alla lista scritta sul quaderno.\n\nPer cena hanno scelto un ristorante piccolo, lontano dalle strade più affollate. Il proprietario ha consigliato una zuppa di verdure, un piatto di pasta e un dolce da dividere. Quando è arrivata la pasta, Giulia ha assaggiato la salsa e ha chiesto come fosse preparata. Il proprietario ha spiegato che usava pochi ingredienti freschi e che cambiava la ricetta secondo la stagione. Alice ha riso: «Anche in cucina bisogna accettare i cambiamenti». Giulia ha risposto: «Sì, ma certe abitudini sono preziose. Per esempio, noi due dobbiamo continuare a incontrarci». Hanno deciso di organizzare un altro viaggio in primavera, senza fissare subito tutti i dettagli. Sul quaderno Alice ha scritto: «Coltivare le amicizie è un obiettivo che non scade».\n\nIl mattino seguente Alice si è svegliata presto. Il cielo era ancora nuvoloso, ma non pioveva. Ha preso un caffè e ha camminato fino a una collina da cui si vedeva il panorama della città. Il sentiero era facile all'inizio, poi diventava più ripido. A metà strada ha incontrato una famiglia con due bambini. Uno dei bambini era stanco e voleva tornare indietro. La madre gli ha proposto una pausa all'ombra di un albero. Alice ha sorriso e ha continuato lentamente. Arrivata in cima, non ha cercato subito il telefono per fare fotografie. Si è seduta su una roccia e ha guardato i tetti, il fiume e le montagne lontane. Per qualche minuto non ha pensato a nessuna scadenza.\n\nTornando verso il centro, Alice ha ricevuto una chiamata dall'ufficio. Un collega non riusciva ad aprire un allegato che lei aveva inviato il venerdì precedente. La versione corretta del documento era nella cartella del computer di casa. Per un momento Alice si è innervosita: temeva di dover interrompere la vacanza. Poi ha chiesto al collega di controllare la cartella condivisa. Il file era già lì, con un nome diverso. Il problema si è risolto in pochi minuti. Il collega l'ha ringraziata e le ha detto di godersi il resto del viaggio. Alice ha spento le notifiche per qualche ora. Non aveva ignorato il lavoro, ma aveva trovato una soluzione senza rinunciare alla giornata.\n\nLa domenica sera, sul treno del ritorno, Alice ha riaperto il quaderno. Sulla vecchia lista alcune cose erano completate, altre erano ancora lontane, e altre non le interessavano più. Non ha cancellato nulla. Accanto a ogni obiettivo ha scritto una breve domanda: «Perché lo voglio? Che cosa sono disposto a cambiare?». Poi ha aperto una pagina nuova e ha cominciato una lista diversa. La prima voce era semplice: «Continuare a imparare italiano, anche quando sbaglio». La seconda: «Vedere gli amici più spesso». La terza: «Lasciare spazio alle sorprese». Il treno è arrivato con un piccolo ritardo. Alice non era nervosa. Ha chiuso il quaderno, ha preso lo zaino e ha pensato che alcune coincidenze importanti non si trovano sugli orari.","english":"When Alice found an old notebook at the back of her wardrobe, she was packing her suitcase for a trip to Florence. On the notebook it said: “Things to do before thirty.” The first page contained a very ambitious list: learn a foreign language, visit ten cities, read fifty novels and cook dinner for twelve guests. Alice smiled. She had written that list many years earlier, when she thought every goal needed a precise deadline. Now she worked, studied Italian and tried to save for an apartment. She had less free time, but she understood many things she hadn't known at twenty. She put the notebook in her backpack, next to her passport, even though she didn't need a passport for Florence.\n\nThe trip didn't start well. At the station the departures board showed a twenty-five-minute delay. Alice had a connection in Bologna and didn't know whether she would manage to catch the second train. She checked the timetable on her phone, but the connection was poor. A man sitting next to her saw her nervous expression and asked what had happened. Alice explained the problem. The man smiled and said, “I travel on this line every week. The connection is difficult, but there's another train half an hour later.” Alice thanked him. Usually she looked for every answer on a screen; that morning she had found an answer by talking to a stranger.\n\nOn the train Alice opened the notebook. Next to “learn a foreign language” she had written a small note: “Ten words a day are enough.” She remembered her first Italian course, when she couldn't even distinguish the passato prossimo from the imperfetto. She had studied for a week, then stopped everything because she wanted immediate results. Now she followed a different method. Every morning she reviewed a few words, during her lunch break she listened to a dialogue, and in the evening she wrote three sentences. She didn't always feel like studying, but the small habit had become part of her day. She underlined the old note and added: “Don't count only the words you've seen; count the ones you know how to use.”\n\nWhen she arrived in Florence, it was raining lightly. Alice had booked a room in a small hotel near the centre, but there was no sign at the listed address. She called the receptionist and discovered that the entrance was on a side street, through a courtyard. The receptionist, a kind woman in a green scarf, gave her the key and showed her the room. It was small but bright, with a window overlooking the roof of a theatre. From the shared balcony one could see part of the city. Alice left her suitcase, changed clothes and decided to go out despite the rain. She had only two days and didn't want to spend them checking the forecast.\n\nWalking along a narrow street, Alice saw an announcement for a photography exhibition. Admission was free and there was still an hour before her appointment with her friend Giulia. She went in. The photographs showed ordinary places: a morning market, a tram in the fog, a kitchen during a party and two people arguing outside a café. One photo showed a woman with a red suitcase sitting on an empty bench. Alice looked at it longer than the others. She knew nothing about that woman but imagined she was waiting for someone. Next to the photograph was a sentence by the artist: “Even waiting is a kind of journey.” Alice copied it into her notebook.\n\nGiulia arrived ten minutes late and apologized. “The tram got stuck at an intersection,” she explained. Alice replied that she wasn't in a hurry. The two friends hadn't seen each other for almost a year. At first they talked about the usual things: work, family, the cost of rent and plans for winter. Then Giulia said she had turned down a very well-paid job offer. Alice was surprised. “Why? I thought that was exactly your goal.” Giulia explained that she would have had to move far from her family and work almost every weekend. “The salary was an advantage,” she said, “but it wasn't the only important thing.” Alice thought again about the list in her notebook.\n\nFor dinner they chose a small restaurant away from the busiest streets. The owner recommended vegetable soup, a pasta dish and a dessert to share. When the pasta arrived, Giulia tasted the sauce and asked how it was made. The owner explained that he used a few fresh ingredients and changed the recipe according to the season. Alice laughed: “Even in the kitchen you have to accept change.” Giulia replied, “Yes, but some habits are precious. For example, the two of us must keep meeting.” They decided to organize another trip in spring, without immediately fixing every detail. In the notebook Alice wrote: “Maintaining friendships is a goal that doesn't expire.”\n\nThe following morning Alice woke up early. The sky was still cloudy, but it wasn't raining. She had a coffee and walked towards a hill overlooking the city. The trail was easy at first, then became steeper. Halfway up she met a family with two children. One child was tired and wanted to turn back. His mother suggested a break in the shade of a tree. Alice smiled and kept walking slowly. When she reached the top, she didn't immediately reach for her phone to take photographs. She sat on a rock and looked at the roofs, the river and the distant mountains. For a few minutes she thought about no deadlines at all.\n\nOn the way back to the centre, Alice received a call from the office. A colleague couldn't open an attachment she had sent the previous Friday. The correct version of the document was in a folder on her home computer. For a moment Alice became nervous: she feared having to interrupt her holiday. Then she asked the colleague to check the shared folder. The file was already there under a different name. The problem was resolved in a few minutes. The colleague thanked her and told her to enjoy the rest of the trip. Alice turned off notifications for a few hours. She hadn't ignored work but had found a solution without sacrificing the day.\n\nOn Sunday evening, on the train home, Alice opened the notebook again. Some items on the old list were complete, others were still distant, and some no longer interested her. She didn't cross anything out. Next to each goal she wrote a short question: “Why do I want this? What am I willing to change?” Then she opened a new page and started a different list. The first item was simple: “Keep learning Italian, even when I make mistakes.” The second: “See friends more often.” The third: “Leave room for surprises.” The train arrived a little late. Alice wasn't nervous. She closed the notebook, picked up her backpack and thought that some important connections cannot be found on timetables.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B2-R01","title":"La finestra sul cortile","italian":"Quando Silvia ha visitato il nuovo appartamento, non ha guardato subito la cucina o il bagno. È andata direttamente sul balcone. Da lì si vedeva un piccolo cortile con un albero e una panchina. Il salotto era luminoso, ma il corridoio sembrava troppo stretto. In camera mancava un armadio, e il pavimento vicino alla finestra era rovinato. La proprietaria ha spiegato che avrebbe sistemato tutto prima dell'inizio del contratto. Silvia ha chiesto anche se il riscaldamento funzionava bene. La proprietaria ha risposto di sì e ha mostrato l'ultima fattura. Alla fine Silvia non ha firmato immediatamente: ha deciso di tornare il giorno dopo con un'amica. Voleva confrontare con calma i vantaggi e gli svantaggi.","english":"When Silvia visited the new apartment, she didn't immediately look at the kitchen or bathroom. She went straight onto the balcony. From there she could see a small courtyard with a tree and a bench. The living room was bright, but the hallway seemed too narrow. The bedroom lacked a wardrobe, and the floor near the window was damaged. The landlady explained that she would fix everything before the contract started. Silvia also asked whether the heating worked properly. The landlady said yes and showed the most recent bill. In the end Silvia didn't sign immediately: she decided to return the next day with a friend. She wanted to compare the advantages and disadvantages calmly.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R02","title":"Una mattina senza internet","italian":"Luca lavora da casa e usa il computer per quasi tutte le sue attività. Una mattina la connessione ha smesso di funzionare proprio durante un colloquio importante. Sullo schermo è comparso un messaggio di errore. Luca ha controllato il cavo, ha riavviato il computer e ha provato a usare il telefono, ma senza risultato. Ha quindi chiamato il collega e ha spiegato il problema. Per fortuna il collega era paziente: gli ha proposto di continuare la conversazione per telefono. Dopo mezz'ora Luca ha scoperto che anche i vicini erano senza internet. Non era un problema della sua password, ma un guasto nel quartiere. Nel pomeriggio la connessione è tornata e Luca ha salvato una copia dei documenti per il futuro.","english":"Luca works from home and uses his computer for almost everything. One morning the connection stopped working during an important interview. An error message appeared on the screen. Luca checked the cable, restarted the computer and tried using his phone, but without success. He therefore called his colleague and explained the problem. Fortunately, his colleague was patient: he suggested continuing the conversation by phone. After half an hour Luca discovered that the neighbours also had no internet. It wasn't a problem with his password but a fault in the neighbourhood. In the afternoon the connection returned, and Luca saved a copy of the documents for the future.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R03","title":"Il pacco che ha viaggiato troppo","italian":"Elena ha ordinato una lampada per la sua scrivania. La spedizione doveva durare tre giorni, ma dopo una settimana il pacco non era ancora arrivato. Sul sito del negozio comparivano informazioni diverse: prima «in consegna», poi «indirizzo sconosciuto». Elena ha scritto al servizio clienti e ha allegato la conferma dell'ordine. Un dipendente le ha risposto con gentilezza e ha scoperto che mancava il numero dell'appartamento. Elena ha fornito l'indirizzo completo. Il corriere è arrivato finalmente il mattino successivo. La lampada funzionava, ma la confezione era rovinata. Elena ha deciso di conservarla perché il prodotto era intatto. Questa volta, però, ha imparato a controllare ogni dettaglio della prenotazione e della spedizione.","english":"Elena ordered a lamp for her desk. Shipping was supposed to take three days, but after a week the parcel still hadn't arrived. The shop's website showed conflicting information: first “out for delivery,” then “unknown address.” Elena wrote to customer service and attached the order confirmation. An employee replied politely and discovered that the apartment number was missing. Elena supplied the complete address. The courier finally arrived the following morning. The lamp worked, but the packaging was damaged. Elena decided to keep it because the product was intact. This time, however, she learned to check every detail of an order and its shipping.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R04","title":"Un pranzo fatto in casa","italian":"Il sabato Paolo preferisce cucinare invece di andare al ristorante. Prima controlla il frigorifero, poi scrive una lista degli ingredienti mancanti. Questa settimana ha deciso di preparare una zuppa di verdure e una torta semplice. Al supermercato ha comprato patate, cipolle, pomodori, uova e farina. Tornato a casa, ha lavato le verdure e ha iniziato a tagliarle. La ricetta diceva di aggiungere poco sale, ma Paolo ne ha messo troppo. Ha assaggiato la zuppa e ha aggiunto un po' d'acqua per correggere il sapore. Quando sono arrivati gli ospiti, il salotto profumava di pane appena cotto. La torta non era perfetta, ma tutti hanno chiesto una seconda porzione.","english":"On Saturdays Paolo prefers cooking instead of going to a restaurant. First he checks the fridge, then writes a list of missing ingredients. This week he decided to prepare vegetable soup and a simple cake. At the supermarket he bought potatoes, onions, tomatoes, eggs and flour. Back home, he washed the vegetables and started cutting them. The recipe said to add a little salt, but Paolo added too much. He tasted the soup and added some water to correct the flavour. When the guests arrived, the living room smelled of freshly baked bread. The cake wasn't perfect, but everyone asked for a second helping.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R05","title":"La coincidenza di sei minuti","italian":"Marta doveva andare a Bologna per un corso. Aveva comprato due biglietti: uno per Milano e uno per il treno successivo. Sulla carta la coincidenza durava soltanto sei minuti. All'inizio tutto sembrava normale, ma il primo treno ha accumulato un ritardo di dodici minuti. Marta ha controllato il binario del secondo treno e ha capito che non sarebbe arrivata in tempo. Invece di correre inutilmente, ha chiesto informazioni al personale della stazione. Un dipendente le ha spiegato quali alternative erano disponibili e l'ha aiutata a cambiare il biglietto. Marta è arrivata un'ora dopo il previsto, ma ha seguito comunque quasi tutta la lezione. Ora evita le coincidenze troppo brevi quando deve arrivare a un appuntamento importante.","english":"Marta had to go to Bologna for a course. She had bought two tickets: one to Milan and one for the next train. On paper the connection was just six minutes. Everything seemed normal at first, but the first train accumulated a twelve-minute delay. Marta checked the platform for the second train and realized she wouldn't make it in time. Instead of running pointlessly, she asked station staff for information. An employee explained what alternatives were available and helped her change the ticket. Marta arrived an hour later than expected, but she still attended almost all of the lesson. Now she avoids very short connections when she needs to arrive at an important appointment.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R06","title":"Il colloquio del venerdì","italian":"Prima del colloquio, Gianni ha letto con attenzione l'annuncio di lavoro. L'azienda cercava una persona capace di organizzare progetti e spiegare risultati complessi in modo semplice. Gianni aveva esperienza, ma era nervoso. Ha preparato tre esempi concreti e ha deciso di parlare lentamente. Durante il colloquio il capo gli ha chiesto come aveva risolto un problema difficile. Gianni ha raccontato un errore commesso durante una ricerca e ha spiegato come l'aveva corretto. Il capo ha apprezzato la risposta onesta. Alla fine hanno discusso lo stipendio, la durata del contratto e le possibilità di imparare. Gianni è uscito senza sapere se avrebbe ricevuto un'offerta, ma era soddisfatto: aveva presentato il proprio lavoro con chiarezza.","english":"Before the interview Gianni carefully read the job advertisement. The company was looking for someone able to organize projects and explain complex results simply. Gianni had experience, but he was nervous. He prepared three concrete examples and decided to speak slowly. During the interview the manager asked how he had solved a difficult problem. Gianni described a mistake made during research and explained how he had corrected it. The manager appreciated the honest answer. In the end they discussed salary, contract length and learning opportunities. Gianni left without knowing whether he would receive an offer, but he was satisfied: he had presented his work clearly.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R07","title":"La festa senza plastica","italian":"Per il suo compleanno, Chiara voleva organizzare una festa senza produrre troppi rifiuti. Ha invitato dodici amici e ha chiesto a ciascuno di portare un piatto da condividere. Ha usato bicchieri e piatti normali invece di quelli di plastica. Alcuni ospiti hanno preparato antipasti, altri dolci, e un'amica ha portato una grande zuppa. Chiara ha sistemato le sedie in salotto e ha acceso una piccola lampada sul balcone. Quando è arrivata l'ultima ospite, tutti hanno fatto una sorpresa a Chiara con un album di fotografie. La serata è finita tardi, ma la mattina successiva c'erano pochi rifiuti. Chiara ha pensato che organizzare una festa più semplice fosse anche più piacevole.","english":"For her birthday Chiara wanted to organize a party without producing too much waste. She invited twelve friends and asked each person to bring a dish to share. She used regular glasses and plates instead of plastic ones. Some guests prepared starters, others desserts, and one friend brought a large pot of soup. Chiara arranged the chairs in the living room and turned on a small lamp on the balcony. When the last guest arrived, everyone surprised Chiara with a photo album. The evening ended late, but there was little rubbish the next morning. Chiara thought that organizing a simpler party was also more enjoyable.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R08","title":"La mostra nell'ex fabbrica","italian":"Una vecchia fabbrica vicino alla stazione è diventata uno spazio per mostre. Domenica due amici hanno deciso di visitarla. Il primo quadro rappresentava una valle in inverno; il secondo mostrava il traffico di una grande città. Una fotografia molto semplice ha attirato la loro attenzione: un uomo aspettava il tram sotto la pioggia. Accanto all'immagine c'era una spiegazione dell'artista, ma i due amici hanno provato a interpretarla prima di leggerla. Avevano opinioni diverse. Per uno, la scena parlava di solitudine; per l'altro, di pazienza. Dopo aver letto il testo hanno scoperto che l'artista voleva raccontare il cambiamento delle città. La discussione è continuata anche durante il pranzo.","english":"An old factory near the station has become an exhibition space. On Sunday two friends decided to visit it. The first painting depicted a valley in winter; the second showed traffic in a large city. A very simple photograph caught their attention: a man waited for the tram in the rain. There was an explanation by the artist next to the image, but the two friends tried to interpret it before reading it. They had different opinions. For one, the scene was about loneliness; for the other, patience. After reading the text they discovered that the artist wanted to tell a story about changing cities. Their discussion continued over lunch.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R09","title":"Una scelta di bilancio","italian":"Davide voleva comprare una macchina fotografica nuova, ma aveva anche bisogno di risparmiare per un viaggio. Ha aperto un foglio sul computer e ha scritto tutte le spese del mese: affitto, trasporti, cibo e qualche uscita con gli amici. Il budget era più piccolo di quanto pensasse. Invece di chiedere un prestito, ha deciso di aspettare tre mesi. Ha iniziato a portare il pranzo da casa e a usare la bicicletta quando il tempo lo permetteva. Alla fine del primo mese aveva risparmiato una somma modesta. Non era abbastanza per la macchina fotografica, ma era un buon inizio. Davide ha scoperto che controllare le proprie abitudini era più utile che rinunciare a ogni piacere.","english":"Davide wanted to buy a new camera, but he also needed to save for a trip. He opened a spreadsheet on his computer and wrote down all the month's expenses: rent, transport, food and a few outings with friends. His budget was smaller than he had thought. Instead of asking for a loan, he decided to wait three months. He started bringing lunch from home and using his bicycle when the weather allowed it. By the end of the first month he had saved a modest amount. It wasn't enough for the camera, but it was a good start. Davide discovered that keeping track of his habits was more useful than giving up every pleasure.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R10","title":"La giornata del volontario","italian":"Ogni mercoledì Sara aiuta in un'associazione del quartiere. La mattina prepara pacchi di cibo per persone che hanno bisogno di sostegno. Controlla le confezioni, legge le scadenze e divide gli ingredienti in gruppi. Un nuovo volontario non conosceva l'organizzazione, così Sara gli ha spiegato ogni passaggio con pazienza. Nel pomeriggio è arrivato un signore anziano che aveva difficoltà a portare le borse. I volontari lo hanno accompagnato fino alla fermata del tram. Sara è tornata a casa stanca ma contenta. Quel giorno non aveva risolto tutti i problemi della città; aveva però reso più facile la giornata di alcune persone. Per lei questo era un risultato importante.","english":"Every Wednesday Sara helps at a neighbourhood organization. In the morning she prepares food parcels for people who need support. She checks packages, reads expiry dates and separates ingredients into groups. A new volunteer didn't know how the organization worked, so Sara patiently explained every step. In the afternoon an elderly gentleman arrived who had trouble carrying his bags. The volunteers accompanied him to the tram stop. Sara came home tired but happy. That day she hadn't solved every problem in the city; she had, however, made a few people's day easier. For her this was an important result.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R11","title":"La febbre prima del viaggio","italian":"Pietro aveva prenotato una vacanza da molti mesi. Due giorni prima della partenza si è svegliato con la febbre e la tosse. All'inizio voleva comunque partire, perché aveva già pagato l'albergo. Sua sorella gli ha consigliato di riposare e parlare con un medico. Pietro ha prenotato una visita e ha spiegato i sintomi. Dopo aver ricevuto le indicazioni del medico, ha controllato le condizioni della prenotazione. Per fortuna poteva cambiare la data senza perdere tutto il denaro. Ha inviato una richiesta all'albergo, che ha confermato il cambiamento. Pietro era deluso, ma anche sollevato. Ha capito che la salute vale più di una scadenza sul calendario e ha organizzato il viaggio per il mese successivo.","english":"Pietro had booked a holiday many months earlier. Two days before departure he woke up with a fever and a cough. At first he wanted to leave anyway because he had already paid for the hotel. His sister advised him to rest and speak to a doctor. Pietro booked a medical appointment and described his symptoms. After receiving the doctor's guidance, he checked the conditions of the booking. Fortunately he could change the date without losing all his money. He sent a request to the hotel, which confirmed the change. Pietro was disappointed but also relieved. He realized that health is worth more than a deadline on a calendar, and he arranged the trip for the following month.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R12","title":"Una passeggiata nella nebbia","italian":"Il sabato mattina il lago era coperto da una nebbia leggera. Francesca aveva deciso di fare una passeggiata lungo un sentiero breve, ma la visibilità era scarsa. Ha incontrato una coppia di turisti che cercava il panorama indicato sulla mappa. Ha spiegato che dalla collina non si sarebbe visto molto e ha suggerito un percorso più basso, vicino al prato. I turisti hanno accettato il consiglio e si sono uniti a lei per un tratto. Camminando hanno sentito un tuono lontano. Francesca ha controllato le previsioni e ha proposto di tornare al paese. Poco dopo è arrivato un temporale. Tutti e tre sono entrati in un piccolo bar proprio prima della pioggia più forte.","english":"On Saturday morning the lake was covered by light fog. Francesca had decided to walk along a short trail, but visibility was poor. She met a couple of tourists looking for the viewpoint shown on the map. She explained that there would not be much to see from the hill and suggested a lower route near the meadow. The tourists accepted the advice and joined her for part of the walk. As they walked, they heard distant thunder. Francesca checked the forecast and suggested returning to the village. Soon a storm arrived. All three entered a small café just before the heaviest rain.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R13","title":"Il romanzo sul tram","italian":"Ogni mattina, andando al lavoro, Omar legge alcune pagine di un romanzo. Non usa il telefono, perché sa che i messaggi lo distraggono. Un giorno ha dimenticato il libro sul sedile del tram. Se n'è accorto soltanto all'uscita della stazione. Pensava di averlo perso per sempre, ma ha deciso di chiamare l'ufficio oggetti smarriti. Un dipendente gli ha chiesto di descrivere la copertina e il titolo. Qualcuno aveva trovato il romanzo e lo aveva consegnato. Omar è andato a riprenderlo nel pomeriggio. Dentro ha trovato anche un piccolo biglietto: «Spero che la fine sia bella». Non ha mai saputo chi lo avesse scritto, ma ha sorriso per tutto il viaggio di ritorno.","english":"Every morning, on the way to work, Omar reads a few pages of a novel. He doesn't use his phone because he knows messages distract him. One day he forgot the book on a tram seat. He only noticed when leaving the station. He thought he'd lost it forever, but he decided to call lost property. An employee asked him to describe the cover and the title. Someone had found the novel and handed it in. Omar went to collect it in the afternoon. Inside he also found a small note: “I hope the ending is good.” He never found out who had written it, but he smiled all the way home.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R14","title":"Una cucina per due","italian":"Quando si sono trasferiti insieme, Andrea e Michele hanno scoperto di avere abitudini molto diverse. Andrea voleva una cucina sempre pulita, mentre Michele preferiva lavare tutto alla fine della giornata. All'inizio hanno discusso per piatti, pentole e stoviglie lasciati nel lavandino. Poi hanno deciso di organizzare i compiti con un calendario. Un giorno Andrea cucinava e Michele puliva; il giorno dopo cambiavano ruolo. Hanno anche stabilito una piccola regola: nessuno doveva criticare l'altro mentre cucinava. Dopo qualche settimana il sistema funzionava meglio. Non erano diventati identici, ma avevano trovato una soluzione ragionevole. A volte vivere insieme richiede meno grandi promesse e più piccoli accordi quotidiani.","english":"When they moved in together, Andrea and Michele discovered that they had very different habits. Andrea wanted an always-clean kitchen, while Michele preferred to wash everything at the end of the day. At first they argued about plates, pots and dishes left in the sink. Then they decided to organize the chores with a calendar. One day Andrea cooked and Michele cleaned; the next day they swapped roles. They also established a small rule: neither should criticize the other while cooking. After a few weeks the system worked better. They hadn't become identical, but they had found a reasonable solution. Sometimes living together requires fewer big promises and more small everyday agreements.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R15","title":"Il voto che non bastava","italian":"Nina aveva studiato molto per l'esame e sperava in un voto alto. Quando ha visto il risultato, era delusa. Aveva superato la prova, ma aveva commesso errori nella parte orale. Invece di lamentarsi subito, ha chiesto al professore una spiegazione. Durante il colloquio ha scoperto che conosceva bene i concetti, ma parlava troppo velocemente e non dava esempi concreti. Il professore le ha consigliato di preparare riassunti brevi e ripetere gli argomenti ad alta voce. Nina ha seguito il consiglio per un mese. Alla prova successiva ha parlato con più calma e ha ottenuto un risultato migliore. Ha imparato a distinguere tra conoscere un argomento e saperlo spiegare.","english":"Nina had studied hard for the exam and hoped for a high grade. When she saw the result, she was disappointed. She had passed, but she had made mistakes in the oral part. Instead of complaining immediately, she asked the professor for an explanation. During the meeting she discovered that she knew the concepts well, but spoke too quickly and didn't give concrete examples. The professor advised her to prepare short summaries and repeat the topics aloud. Nina followed the advice for a month. At the next exam she spoke more calmly and obtained a better result. She learned to distinguish knowing a subject from being able to explain it.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R16","title":"Un invito inaspettato","italian":"Durante una pausa pranzo, Alessia ha incontrato una vecchia compagna di scuola. Non si vedevano da otto anni e all'inizio non sapevano cosa raccontarsi. Poi hanno cominciato a parlare dei viaggi, del lavoro e delle loro città. La compagna le ha detto che stava organizzando una festa per il suo compleanno e l'ha invitata. Alessia era sorpresa: avevano perso i contatti da molto tempo. Ha accettato l'invito, ma ha promesso di confermare l'orario più tardi. Quella sera ha guardato alcune fotografie di scuola. Ha ricordato episodi divertenti che aveva quasi dimenticato. Ha pensato che certe amicizie non scompaiono completamente, anche quando passano molti anni.","english":"During a lunch break, Alessia met an old schoolmate. They hadn't seen each other for eight years and at first didn't know what to talk about. Then they started discussing travel, work and their cities. Her schoolmate said she was organizing a birthday party and invited her. Alessia was surprised: they'd lost touch long ago. She accepted the invitation but promised to confirm the time later. That evening she looked at some school photographs. She remembered funny episodes she had almost forgotten. She thought that some friendships never entirely disappear, even after many years.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R17","title":"La garanzia dimenticata","italian":"Marco aveva comprato una lavatrice nuova da pochi mesi quando ha notato un problema. Il programma finiva, ma i vestiti restavano completamente bagnati. Ha cercato la fattura e la garanzia, ma non riusciva a trovarle. Dopo un'ora ha ricordato di aver salvato tutto in una cartella sul computer. Ha chiamato il negozio, ha descritto il difetto e ha inviato il documento richiesto. Il negozio ha organizzato la visita di un tecnico. Il tecnico ha trovato un piccolo oggetto che bloccava lo scarico dell'acqua. Non era necessario cambiare la lavatrice. Marco era sollevato: aveva risolto il problema senza comprare un altro prodotto e aveva imparato a conservare meglio i documenti.","english":"Marco had bought a new washing machine only a few months earlier when he noticed a problem. The cycle finished, but the clothes remained completely wet. He searched for the invoice and warranty, but couldn't find them. After an hour he remembered saving everything in a folder on his computer. He called the shop, described the fault and sent the requested document. The shop organized a technician's visit. The technician found a small object blocking the water outlet. It wasn't necessary to replace the washing machine. Marco was relieved: he'd solved the problem without buying another product and learned to keep documents better organized.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R18","title":"Il teatro che unisce","italian":"In un piccolo paese, il teatro rischiava di chiudere perché c'erano pochi spettatori. Un gruppo di giovani ha deciso di organizzare una serata diversa. Invece di invitare attori famosi, ha chiesto ai residenti di raccontare storie vere del quartiere. Un'infermiera ha parlato del suo primo giorno di lavoro; un turista ha raccontato come aveva perso la valigia; un pensionato ha ricordato la sua prima bicicletta. Alcune storie erano divertenti, altre commoventi. Alla fine lo spettacolo era tutto esaurito. Il proprietario del teatro ha proposto di ripetere l'iniziativa ogni mese. I giovani hanno capito che il vantaggio di un teatro non è soltanto mostrare grandi opere, ma anche far incontrare persone diverse.","english":"In a small town, the theatre was at risk of closing because there were few spectators. A group of young people decided to organize a different kind of evening. Instead of inviting famous actors, they asked residents to tell true stories from the neighbourhood. A nurse spoke about her first day at work; a tourist described losing his suitcase; a retiree remembered his first bicycle. Some stories were funny, others moving. In the end the show sold out. The theatre owner proposed repeating the initiative every month. The young people realized that a theatre's advantage isn't just showing great works but also bringing different people together.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R19","title":"Un sabato senza programma","italian":"Di solito Federica organizza tutto in anticipo. Scrive gli appuntamenti sul calendario, controlla gli orari e decide persino dove fare colazione. Un sabato, però, ha dimenticato di caricare il telefono. Senza mappa e senza messaggi, ha iniziato a camminare per il centro della città. Ha scoperto una libreria che non conosceva e ha parlato con il proprietario di un romanzo italiano. Poi ha visto un annuncio per una mostra gratuita e ha deciso di entrare. Nel pomeriggio si è seduta all'ombra di un albero e ha osservato le persone passare. È tornata a casa contenta e un po' sorpresa. Non aveva seguito nessun programma, ma aveva trascorso una giornata interessante.","english":"Federica usually plans everything in advance. She writes appointments on her calendar, checks schedules and even decides where to have breakfast. One Saturday, however, she forgot to charge her phone. Without a map or messages, she started walking around the city centre. She discovered a bookshop she didn't know and spoke with the owner about an Italian novel. Then she saw an advertisement for a free exhibition and decided to go in. In the afternoon she sat in the shade of a tree and watched people pass. She returned home happy and a little surprised. She hadn't followed any plan, but she had spent an interesting day.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-R20","title":"La promessa di cinque minuti","italian":"Tommaso voleva migliorare il suo italiano, ma ogni settimana prometteva di studiare due ore al giorno e poi non trovava il tempo. Un'amica gli ha suggerito una soluzione più piccola: cinque minuti di ripasso dopo la colazione. Tommaso all'inizio era scettico. Cinque minuti gli sembravano inutili. Ha comunque provato. Ogni giorno ha ripetuto dieci parole, ha scritto due frasi e ha controllato gli errori del giorno prima. Dopo due settimane ricordava molte parole più facilmente. Ha aggiunto un breve dialogo durante la pausa pranzo e una lettura la sera. Non studiava sempre allo stesso ritmo, ma aveva costruito un'abitudine stabile. Ha capito che per migliorare conta più la continuità che una promessa troppo grande.","english":"Tommaso wanted to improve his Italian, but every week he promised to study two hours a day and then couldn't find the time. A friend suggested a smaller solution: five minutes of review after breakfast. At first Tommaso was sceptical. Five minutes seemed useless to him. He tried anyway. Every day he repeated ten words, wrote two sentences and checked the previous day's errors. After two weeks he recalled many words more easily. He added a short dialogue during lunch break and a reading in the evening. He didn't always study at the same pace, but he had built a stable habit. He realized that consistency matters more for improvement than an oversized promise.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false},{"id":"B2-L02","title":"La casa da sistemare","italian":"Dopo aver firmato il contratto, Chiara è entrata nel suo nuovo appartamento con grande entusiasmo. Il salotto aveva una finestra luminosa, la cucina era abbastanza grande e dal balcone si vedeva un cortile tranquillo. Ma già il primo giorno ha scoperto alcuni problemi: un rubinetto perdeva acqua, una lampada non funzionava e la porta del bagno si chiudeva male. Per un momento ha pensato di aver fatto una scelta sbagliata.\n\nInvece di arrabbiarsi, Chiara ha scritto una lista e ha telefonato al proprietario. Lui si è mostrato disponibile e le ha promesso che avrebbe chiamato un tecnico. Nel frattempo Chiara ha chiesto aiuto al suo coinquilino per montare una piccola libreria. Hanno lavorato tutto il pomeriggio e hanno dovuto ricominciare due volte perché avevano messo alcuni pezzi nel verso sbagliato. Alla fine la libreria era un po' storta, ma stabile.\n\nIl tecnico è arrivato il martedì successivo. Ha riparato il rubinetto in pochi minuti, mentre per la lampada ha dovuto cercare un componente nuovo. Il proprietario ha mandato un messaggio per confermare che avrebbe pagato la riparazione. Chiara ha conservato tutti i documenti in una cartella, insieme al contratto e alle ricevute. Si è resa conto che vivere da sola richiedeva più organizzazione di quanto immaginasse.\n\nQuando finalmente ha invitato alcuni amici a cena, l'appartamento non era ancora perfetto. C'erano scatole vicino alla porta e un quadro appoggiato sul pavimento. Gli amici però hanno portato qualcosa da mangiare e l'hanno aiutata a sistemare il tavolo. Seduta tra loro, Chiara ha capito che una casa non diventa accogliente soltanto grazie ai mobili nuovi: lo diventa quando comincia a riempirsi di vita.","english":"After signing the lease, Chiara entered her new apartment full of enthusiasm. The living room had a bright window, the kitchen was fairly large, and the balcony looked onto a quiet courtyard. But on the very first day she discovered several problems: a tap was leaking, a lamp did not work, and the bathroom door would not close properly. For a moment she thought she had made the wrong choice.\n\nInstead of getting angry, Chiara made a list and called the landlord. He was helpful and promised to call a technician. Meanwhile, Chiara asked her roommate to help assemble a small bookcase. They worked all afternoon and had to start over twice because they had put some pieces in the wrong way. In the end the bookcase was a little crooked, but stable.\n\nThe technician arrived the following Tuesday. He fixed the tap in a few minutes, but had to find a new component for the lamp. The landlord sent a message confirming that he would pay for the repair. Chiara kept all the documents in a folder with her contract and receipts. She realized that living on her own required more organization than she had imagined.\n\nWhen she finally invited some friends over for dinner, the apartment was still not perfect. There were boxes by the door and a picture leaning against the floor. But her friends brought food and helped her set the table. Sitting among them, Chiara realized that a home does not become welcoming simply because it has new furniture: it becomes welcoming when it begins to fill with life.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B2-L03","title":"Un colloquio inaspettato","italian":"Davide cercava un lavoro part-time mentre studiava all'università. Aveva preparato un curriculum, scritto alcune email e inviato molte candidature, ma nessuno gli aveva ancora risposto. Una mattina ha ricevuto un messaggio da una piccola casa editrice. Gli chiedevano di presentarsi per un colloquio nel pomeriggio. Davide non aveva molto tempo per prepararsi e, soprattutto, non sapeva quali domande avrebbero fatto.\n\nHa chiamato una collega che lavorava già in quell'ambiente. Lei gli ha consigliato di leggere il sito dell'azienda e preparare esempi concreti delle sue esperienze. Davide ha scritto su un quaderno due progetti universitari ai quali aveva partecipato. In uno aveva organizzato un gruppo di studio; nell'altro aveva corretto un testo per la rivista degli studenti. Ha capito che poteva parlare di cose semplici senza inventare competenze che non aveva.\n\nDurante il colloquio il responsabile gli ha chiesto come reagisse quando un progetto cambiava all'ultimo momento. Davide ha raccontato di un esame per il quale aveva preparato una presentazione, ma il professore aveva chiesto un formato diverso. «All'inizio ero nervoso», ha ammesso, «poi ho diviso il lavoro in parti più piccole e ho chiesto aiuto ai compagni». Il responsabile ha sorriso e gli ha fatto altre due domande sul lavoro di squadra.\n\nDavide non ha ricevuto subito una risposta. È uscito dall'ufficio e ha fatto una passeggiata per rilassarsi. La settimana dopo la casa editrice gli ha proposto un piccolo contratto. Anche se fosse arrivato un rifiuto, Davide avrebbe considerato utile quell'esperienza: aveva imparato a descrivere meglio quello che sapeva fare e a rispondere alle domande senza cercare frasi perfette.","english":"Davide was looking for a part-time job while studying at university. He had prepared a CV, written some emails, and sent many applications, but nobody had replied yet. One morning he received a message from a small publishing house. They asked him to come for an interview that afternoon. Davide did not have much time to prepare and, above all, did not know what questions they would ask.\n\nHe called a colleague who already worked in that field. She advised him to read the company's website and prepare concrete examples of his experience. Davide wrote down two university projects he had taken part in. For one, he had organized a study group; for the other, he had edited a text for the student magazine. He understood that he could talk about simple things without inventing skills he did not have.\n\nDuring the interview the manager asked how he reacted when a project changed at the last minute. Davide described an exam for which he had prepared a presentation, only for the professor to request a different format. “At first I was nervous,” he admitted, “then I divided the work into smaller parts and asked my classmates for help.” The manager smiled and asked him two more questions about teamwork.\n\nDavide did not get an immediate answer. He left the office and went for a walk to relax. The following week the publishing house offered him a short contract. Even if he had been rejected, Davide would have considered the experience worthwhile: he had learned to describe what he could do more clearly and answer questions without searching for perfect phrases.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B2-L04","title":"Una passeggiata con la pioggia","italian":"Quando Martina ha proposto una gita sulle colline, le previsioni indicavano un cielo sereno. I suoi amici hanno preparato zaini, scarpe comode, acqua e qual
