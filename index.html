astery_granularity":"lemma + tense + person","past_auxiliary_note":"Subject agreement is required."},{"id":48,"infinitive":"tornare","en":"to return","present":["torno","torni","torna","torniamo","tornate","tornano"],"imperfect":["tornavo","tornavi","tornava","tornavamo","tornavate","tornavano"],"future":["tornerò","tornerai","tornerà","torneremo","tornerete","torneranno"],"participle":"tornato","aux":"essere","gerund":"tornando","example_it":"Torno a casa alle sette.","example_en":"I get home at seven.","content_id":"B1-V048","batch_id":5,"past_compound_forms":["sono tornato/a","sei tornato/a","è tornato/a","siamo tornati/e","siete tornati/e","sono tornati/e"],"conjugation_order":["io","tu","lui_lei","noi","voi","loro"],"mastery_granularity":"lemma + tense + person","past_auxiliary_note":"Subject agreement is required."},{"id":49,"infinitive":"finire","en":"to finish / end","present":["finisco","finisci","finisce","finiamo","finite","finiscono"],"imperfect":["finivo","finivi","finiva","finivamo","finivate","finivano"],"future":["finirò","finirai","finirà","finiremo","finirete","finiranno"],"participle":"finito","aux":"avere","gerund":"finendo","example_it":"Finisco il lavoro alle sei.","example_en":"I finish work at six.","content_id":"B1-V049","batch_id":5,"past_compound_forms":["ho finito","hai finito","ha finito","abbiamo finito","avete finito","hanno finito"],"conjugation_order":["io","tu","lui_lei","noi","voi","loro"],"mastery_granularity":"lemma + tense + person","past_auxiliary_note":"Usually no subject agreement in these active forms.","usage_note":"May use essere for intransitive completed events: il film è finito."},{"id":50,"infinitive":"scegliere","en":"to choose","present":["scelgo","scegli","sceglie","scegliamo","scegliete","scelgono"],"imperfect":["sceglievo","sceglievi","sceglieva","sceglievamo","sceglievate","sceglievano"],"future":["sceglierò","sceglierai","sceglierà","sceglieremo","sceglierete","sceglieranno"],"participle":"scelto","aux":"avere","gerund":"scegliendo","example_it":"Scelgo questo piatto.","example_en":"I choose this dish.","content_id":"B1-V050","batch_id":5,"past_compound_forms":["ho scelto","hai scelto","ha scelto","abbiamo scelto","avete scelto","hanno scelto"],"conjugation_order":["io","tu","lui_lei","noi","voi","loro"],"mastery_granularity":"lemma + tense + person","past_auxiliary_note":"Usually no subject agreement in these active forms."}],"readings":[{"id":"B1-R00","title":"Un viaggio inaspettato","italian":"Sabato mattina Marco si è svegliato presto perché voleva fare un viaggio al mare con due amici. Quando è arrivato alla stazione, ha capito di aver dimenticato il biglietto a casa e non aveva abbastanza soldi per comprarne un altro. Ha chiamato un amico, ma il telefono non funzionava, quindi ha deciso di tornare a casa. Mentre camminava vicino alla piazza, ha incontrato una vecchia collega che non vedeva da molti anni. La collega gli ha detto che abitava in un piccolo paese vicino a un lago e che proprio quel giorno stava tornando a casa. Marco non aveva più voglia di prendere il treno per il mare e ha deciso di andare al lago con lei. Durante il viaggio hanno parlato del lavoro, dell’università e dei vecchi amici che conoscevano. Quando sono arrivati, il sole era già alto, il lago era bellissimo e un piccolo ristorante vicino all’acqua era ancora aperto. Hanno mangiato il pesce, bevuto un caffè e passato tutto il pomeriggio insieme, senza guardare il telefono. La sera Marco è tornato a casa molto felice e ha pensato che qualche volta un problema può diventare una bella possibilità.","english":"On Saturday morning Marco woke up early because he wanted to take a trip to the seaside with two friends. When he reached the station, he realized he had forgotten his ticket at home and did not have enough money to buy another. He called a friend, but his phone was not working, so he decided to return home. While walking near the square, he met a former colleague whom he had not seen for years. She told him she lived in a small town near a lake and was returning home that very day. Marco no longer felt like taking the train to the seaside and decided to go to the lake with her. During the journey they talked about work, university, and old friends they both knew. When they arrived, the sun was already high, the lake was beautiful, and a small restaurant near the water was still open. They ate fish, drank coffee, and spent the whole afternoon together without looking at their phones. In the evening Marco returned home very happy and thought that sometimes a problem can turn into a wonderful opportunity.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B1-R01","title":"Il treno sbagliato","italian":"Ieri ho preso il treno per Milano. Dopo un’ora ho guardato il biglietto e ho capito che il treno andava a Torino. Alla fine ho deciso di passare il pomeriggio a Torino e tornare a casa la sera.","english":"Yesterday I took the train to Milan. After an hour, I looked at the ticket and realized that the train was going to Turin. In the end, I decided to spend the afternoon in Turin and go home in the evening.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R02","title":"Una cena speciale","italian":"Marco voleva fare una bella cena per sua moglie. La mattina è andato al mercato e ha comprato il pesce, la verdura e il formaggio. Quando è tornato a casa, ha messo tutto sul tavolo e ha iniziato a preparare la cena. Dopo un’ora la cucina era sporca, il pesce era ancora freddo e Marco era molto stanco. Ha chiamato un amico per chiedere aiuto. L’amico è arrivato e ha guardato il tavolo. Insieme hanno deciso di comprare due piatti al ristorante vicino a casa. Quando la moglie è tornata, Marco era finalmente pronto per la cena.","english":"Marco wanted to prepare a nice dinner for his wife. In the morning he went to the market and bought fish, vegetables, and cheese. When he returned home, he put everything on the table and started preparing dinner. After an hour the kitchen was dirty, the fish was still cold, and Marco was very tired. He called a friend to ask for help. The friend arrived and looked at the table. Together they decided to buy two dishes from the restaurant near home. When his wife returned, Marco was finally ready for dinner.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R03","title":"Una mattina senza problemi","italian":"Oggi mi sono svegliato presto e ho aperto la finestra. Il cielo era blu, c’era il sole e non avevo nessuna riunione. Ho fatto colazione, ho bevuto due caffè e ho letto un libro. Per una volta, non volevo andare da nessuna parte.","english":"Today I woke up early and opened the window. The sky was blue, the sun was shining, and I had no meetings. I had breakfast, drank two coffees, and read a book. For once I did not want to go anywhere.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R04","title":"Il progetto impossibile","italian":"All’università tre studenti lavoravano insieme a un progetto difficile. Ogni giorno andavano in biblioteca, leggevano documenti e scrivevano nuove idee. Dopo due settimane il progetto non era ancora pronto. Uno studente voleva cambiare tutto, un altro voleva continuare e il terzo voleva soltanto dormire. Alla fine hanno chiesto un consiglio al professore. Il professore ha letto il documento e ha trovato un piccolo errore nella prima pagina. Dopo aver corretto l’errore, tutto il progetto era molto più facile.","english":"At the university, three students were working together on a difficult project. Every day they went to the library, read documents, and wrote new ideas. After two weeks the project still was not ready. One student wanted to change everything, another wanted to continue, and the third just wanted to sleep. Finally they asked the professor for advice. The professor read the document and found a small mistake on the first page. After correcting the mistake, the whole project was much easier.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R05","title":"La giacca misteriosa","italian":"Ieri ho trovato una giacca nuova sulla mia sedia in ufficio. Era della mia taglia, ma non conoscevo il proprietario. Oggi la giacca è ancora qui e adesso anche un collega vuole comprarla.","english":"Yesterday I found a new jacket on my chair at the office. It was my size, but I did not know who owned it. Today the jacket is still here, and now a colleague even wants to buy it.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R06","title":"Un viaggio senza programma","italian":"Due amici volevano andare al mare per tre giorni. Avevano comprato i biglietti del treno, ma non avevano scelto un albergo. Quando sono arrivati, tutti gli alberghi vicino alla spiaggia erano pieni. Hanno camminato per un’ora con le borse e hanno trovato soltanto un piccolo albergo lontano dal mare. Il primo giorno sono andati alla spiaggia e hanno dormito sotto il sole. Il secondo giorno hanno preso un autobus per un paese vicino. Lì hanno trovato un lago bellissimo, un ristorante economico e un piccolo museo. Il terzo giorno non volevano più tornare al mare.","english":"Two friends wanted to go to the seaside for three days. They had bought train tickets but had not chosen a hotel. When they arrived, all the hotels near the beach were full. They walked for an hour with their bags and found only a small hotel far from the sea. On the first day they went to the beach and slept in the sun. On the second day they took a bus to a nearby town. There they found a beautiful lake, an inexpensive restaurant, and a small museum. On the third day they no longer wanted to return to the seaside.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R07","title":"Il telefono in frigorifero","italian":"Anna cercava il telefono da quasi un’ora. Aveva guardato in tutte le borse, sotto il letto e sopra il tavolo. Alla fine è andata in cucina per prendere il latte. Quando ha aperto il frigorifero, ha trovato il telefono vicino al formaggio. Non ricordava perché lo aveva messo lì.","english":"Anna had been looking for her phone for almost an hour. She had checked all the bags, under the bed, and on the table. Finally she went to the kitchen to get milk. When she opened the fridge, she found the phone beside the cheese. She did not remember why she had put it there.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R08","title":"Una città nuova","italian":"Quando Luca era bambino, viveva in un piccolo paese vicino alla montagna. Conosceva tutte le strade e quasi tutte le persone. Dopo l’università ha trovato lavoro in una grande città. All’inizio non conosceva nessuno e non sapeva dove andare dopo il lavoro. Ogni sera tornava a casa e guardava il telefono. Un giorno ha deciso di visitare un museo vicino all’ufficio. Al museo ha conosciuto una persona che lavorava nella stessa università. Dopo qualche mese Luca aveva già molti amici e la città non sembrava più così grande.","english":"When Luca was a child he lived in a small town near the mountains. He knew all the streets and almost everyone. After university he found a job in a big city. At first he knew nobody and did not know where to go after work. Every evening he came home and looked at his phone. One day he decided to visit a museum near the office. At the museum he met someone who worked at the same university. After a few months Luca already had many friends and the city no longer seemed so big.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R09","title":"Il regalo senza nome","italian":"Una mattina Giulia ha trovato una borsa davanti alla porta di casa. Dentro c’erano un libro, una fotografia e un piccolo regalo. Non c’era nessun nome e Giulia non sapeva chi aveva portato la borsa. Ha chiamato sua madre, suo padre e due amici, ma nessuno sapeva niente. La sera ha trovato un messaggio del collega sul telefono. Il regalo era del collega, ma lui aveva scelto la porta sbagliata.","english":"One morning Giulia found a bag outside her front door. Inside were a book, a photograph, and a small gift. There was no name and Giulia did not know who had brought the bag. She called her mother, father, and two friends, but nobody knew anything. That evening she found a message from her colleague on her phone. The gift was from her colleague, but he had chosen the wrong door.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R10","title":"Una domenica senza lavoro","italian":"Paolo lavorava molto e pensava al lavoro anche durante il fine settimana. Ogni domenica apriva il computer dopo colazione e leggeva i messaggi dei colleghi. Una mattina il computer non funzionava e il telefono era senza batteria. Paolo non poteva lavorare, quindi è uscito di casa. È andato al parco, ha preso un caffè e ha incontrato un vecchio amico. Insieme hanno camminato fino al centro e hanno mangiato in un piccolo ristorante. Quando Paolo è tornato a casa era già sera. Il computer funzionava di nuovo, ma Paolo non lo ha aperto.","english":"Paolo worked a lot and thought about work even during the weekend. Every Sunday he opened his computer after breakfast and read messages from colleagues. One morning his computer was not working and his phone had no battery. Paolo could not work, so he left home. He went to the park, had coffee, and met an old friend. Together they walked downtown and ate in a small restaurant. When Paolo came home it was already evening. The computer was working again, but Paolo did not open it.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R11","title":"Il supermercato alle otto","italian":"Marco è arrivato al supermercato cinque minuti prima della chiusura. Ha comprato soltanto il pane, ma quando è arrivato a casa ha capito che aveva dimenticato il latte, la frutta e la cena. Domani tornerà al supermercato, questa volta con una lista.","english":"Marco arrived at the supermarket five minutes before closing. He bought only bread, but when he got home he realized that he had forgotten milk, fruit, and dinner. Tomorrow he will return to the supermarket, this time with a list.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R12","title":"Il mare o la montagna?","italian":"Due amici avevano una settimana libera e volevano fare un viaggio insieme. Il primo voleva andare al mare perché gli piacevano il sole e la spiaggia. Il secondo preferiva la montagna perché non gli piaceva il caldo. Per tre giorni hanno cercato alberghi, guardato mappe e confrontato i prezzi. Alla fine hanno scelto un piccolo paese vicino a un lago. La mattina camminavano in montagna e nel pomeriggio andavano al lago. La sera mangiavano insieme al ristorante e parlavano del giorno dopo. Il viaggio è stato così bello che hanno deciso di tornare l’anno successivo.","english":"Two friends had a free week and wanted to go on a trip together. The first wanted the seaside because he liked the sun and the beach. The second preferred the mountains because he did not like the heat. For three days they searched for hotels, looked at maps, and compared prices. Finally they chose a small town near a lake. In the mornings they walked in the mountains and in the afternoons they went to the lake. In the evenings they ate together at a restaurant and talked about the next day. The trip was so good that they decided to return the following year.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R13","title":"Un libro per tutti","italian":"Una studentessa ha trovato un libro molto interessante in biblioteca. Dopo averlo letto lo ha dato a un amico, che lo ha dato a un altro studente. Dopo un mese quasi tutti gli studenti del corso conoscevano il libro. Anche il professore voleva leggerlo, ma nessuno sapeva dove fosse. Alla fine il libro era di nuovo in biblioteca, sullo stesso tavolo di prima.","english":"A student found a very interesting book in the library. After reading it she gave it to a friend who gave it to another student. After a month nearly all students on the course knew the book. Even the professor wanted to read it but nobody knew where it was. In the end the book was back in the library, on the same table as before.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R14","title":"Una riunione molto importante","italian":"In un ufficio tutti aspettavano una riunione importante. Il direttore aveva mandato un messaggio con la data, ma non aveva scritto l’ora. Alcuni colleghi sono arrivati alle nove, altri alle dieci e due persone sono arrivate nel pomeriggio. Nessuno sapeva quando sarebbe iniziata la riunione. Dopo un’ora una collega ha chiamato il direttore. Il direttore era a casa e pensava che la riunione fosse il giorno dopo. Alla fine tutti sono tornati al lavoro. Il giorno successivo il direttore ha mandato un’email con l’ora esatta, ma senza la data.","english":"Everyone in an office was waiting for an important meeting. The director had sent a message with the date but had not written the time. Some colleagues arrived at nine, others at ten, and two people arrived in the afternoon. Nobody knew when the meeting would start. After an hour a colleague called the director. The director was at home and thought the meeting was the following day. Finally everyone went back to work. The next day the director sent an email with the exact time, but without the date.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R15","title":"Una giornata di pioggia","italian":"Questa mattina pioveva e faceva freddo, quindi sono rimasto a casa. Ho preparato un caffè caldo, ho aperto un libro e ho passato tutto il pomeriggio vicino alla finestra. Quando ha smesso di piovere, era già notte.","english":"This morning it was raining and cold so I stayed home. I made a hot coffee, opened a book, and spent the whole afternoon by the window. When the rain stopped it was already night.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R16","title":"La fotografia del passato","italian":"Giulia è andata al museo con sua madre. Dopo qualche minuto ha trovato una fotografia di un piccolo paese vicino a un fiume. Sua madre ha riconosciuto subito il posto. Era il paese dove viveva da bambina, prima di andare in città. Nella fotografia c’erano una piazza, un ponte e un vecchio negozio. Sua madre conosceva ancora tutte quelle strade e ricordava molte persone del paese. Giulia ha guardato di nuovo la fotografia e ha iniziato a fare molte domande. Alla fine sono rimaste al museo per quasi tre ore.","english":"Giulia went to the museum with her mother. After a few minutes she found a photograph of a small town near a river. Her mother recognized the place immediately. It was the town where she had lived as a child before moving to the city. In the photograph there were a square, a bridge, and an old shop. Her mother still knew all the streets and remembered many people from the town. Giulia looked at the photograph again and started asking many questions. In the end they stayed at the museum for nearly three hours.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R17","title":"La carta non funziona","italian":"Ieri Luca è andato al ristorante con due colleghi. Dopo la cena voleva pagare con la carta, ma la carta non funzionava. Non aveva contanti e anche il telefono era senza batteria. Uno dei colleghi ha pagato il conto per tutti. Luca ha deciso che la prossima volta porterà sempre qualche euro in contanti.","english":"Yesterday Luca went to a restaurant with two colleagues. After dinner he wanted to pay by card but the card was not working. He had no cash and his phone had no battery either. One of his colleagues paid the bill for everyone. Luca decided that next time he would always bring some cash.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R18","title":"Una settimana diversa","italian":"Per molto tempo Anna aveva sempre la stessa giornata. Si svegliava presto, prendeva la metropolitana, lavorava in ufficio e tornava a casa stanca. La sera guardava il telefono e non aveva voglia di uscire. Un giorno ha deciso di cambiare la sua settimana. Il lunedì ha iniziato a leggere un libro nuovo, il martedì è andata al parco e il mercoledì ha incontrato un’amica. Giovedì ha visitato un piccolo museo vicino a casa. Venerdì è andata al cinema e sabato ha fatto un viaggio al lago. Domenica era stanca, ma questa volta era anche molto felice.","english":"For a long time Anna always had the same daily routine. She woke early, took the metro, worked at the office, and returned home tired. In the evenings she looked at her phone and did not feel like going out. One day she decided to change her week. On Monday she started reading a new book, on Tuesday she went to the park, and on Wednesday she met a friend. On Thursday she visited a small museum near home. On Friday she went to the cinema and on Saturday took a trip to the lake. On Sunday she was tired but this time also very happy.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R19","title":"La porta aperta","italian":"Marco è tornato a casa e ha trovato la porta aperta. Ha guardato dentro, ma non c’era nessuno. Sul tavolo ha trovato un regalo e una piccola carta con il suo nome. Soltanto allora ha ricordato che oggi era il suo compleanno.","english":"Marco returned home and found the door open. He looked inside but no one was there. On the table he found a gift and a small card with his name. Only then did he remember that today was his birthday.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-R20","title":"Il viaggio dell’ultimo minuto","italian":"Un venerdì sera Davide era ancora in ufficio. Aveva lavorato tutta la settimana e non voleva passare un altro fine settimana davanti al computer. Ha aperto una mappa dell’Italia e ha iniziato a cercare un posto nuovo. Dopo dieci minuti ha trovato un piccolo paese vicino al mare. Ha comprato un biglietto del treno e ha prenotato una camera in albergo. La mattina dopo è partito senza un programma preciso. Quando è arrivato ha lasciato la borsa in camera ed è uscito. Ha camminato per le strade del paese, ha visitato il mercato e ha mangiato in un piccolo ristorante. Nel pomeriggio è andato alla spiaggia e ha guardato il mare per quasi due ore. Domenica è tornato a Milano con molte nuove idee.","english":"On a Friday evening Davide was still at the office. He had worked all week and did not want to spend another weekend in front of his computer. He opened a map of Italy and started looking for somewhere new. After ten minutes he found a small town near the sea. He bought a train ticket and booked a hotel room. The following morning he left without a precise plan. When he arrived he left his bag in the room and went out. He walked through the town streets, visited the market, and ate in a small restaurant. In the afternoon he went to the beach and looked at the sea for almost two hours. On Sunday he returned to Milan with many new ideas.","task_type":"italian_to_english","hide_english_until_submitted":true},{"id":"B1-L02","title":"Un sabato senza telefono","italian":"Quando Giulia è uscita di casa, il suo telefono aveva soltanto il cinque per cento di batteria. Doveva incontrare sua sorella davanti al museo alle dieci, ma non ricordava il numero dell'autobus. Di solito controllava sempre la mappa sullo schermo. Quella mattina, invece, il telefono si è spento mentre attraversava la piazza. Si è fermata vicino a una fontana e ha guardato la città: c'erano persone che correvano al lavoro, un uomo che vendeva giornali e una donna con un cane piccolo.\n\nGiulia ha chiesto a un passante dove fosse il museo. L'uomo le ha risposto con calma, ma ha parlato molto in fretta. Lei ha capito soltanto due parole: «a destra» e «ponte». Allora è entrata in un bar, ha ordinato un caffè e ha chiesto alla cameriera di indicarle la strada su un pezzo di carta. La cameriera ha disegnato tre linee e una freccia. «Non è lontano», ha detto. «Vai sempre dritto fino al semaforo, poi gira a sinistra».\n\nDopo venti minuti Giulia ha trovato il museo. Sua sorella era già lì, seduta su una panchina. «Pensavo che avessi cambiato idea», ha scherzato. Giulia ha spiegato il problema e ha mostrato il piccolo disegno. Le due sorelle sono entrate nel museo, hanno visto una mostra di fotografie e poi sono andate a pranzo. Durante il pranzo, Giulia ha raccontato quante persone l'avevano aiutata. «Forse», ha detto, «senza telefono parlo di più con la gente». Sua sorella ha sorriso: «E forse la prossima volta porterai anche un caricabatterie».\n\nLa sera Giulia ha caricato il telefono, ma non ha cancellato il disegno della cameriera. L'ha messo nel suo libro, come ricordo di una giornata semplice e diversa. Ha capito che chiedere aiuto non significa essere incapaci: a volte è il modo più veloce per scoprire una città e incontrare qualcuno.","english":"When Giulia left home, her phone had only five percent battery left. She was supposed to meet her sister in front of the museum at ten, but she could not remember the bus number. Normally she always checked the map on her screen. That morning, however, her phone died while she was crossing the square. She stopped near a fountain and looked at the city: people were hurrying to work, a man was selling newspapers, and a woman was walking a small dog.\n\nGiulia asked a passerby where the museum was. The man answered calmly, but spoke very quickly. She understood only two words: “right” and “bridge.” So she went into a café, ordered a coffee, and asked the waitress to show her the way on a piece of paper. The waitress drew three lines and an arrow. “It's not far,” she said. “Go straight on as far as the traffic light, then turn left.”\n\nTwenty minutes later Giulia found the museum. Her sister was already there, sitting on a bench. “I thought you'd changed your mind,” she joked. Giulia explained the problem and showed her the little drawing. The two sisters went into the museum, saw a photography exhibition, and then went out for lunch. Over lunch, Giulia described how many people had helped her. “Maybe,” she said, “without my phone I talk to people more.” Her sister smiled: “And maybe next time you'll bring a charger too.”\n\nThat evening Giulia charged her phone, but she did not throw away the waitress's drawing. She put it inside her book as a reminder of a simple, different kind of day. She realized that asking for help does not mean being incapable: sometimes it is the quickest way to discover a city and meet someone.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B1-L03","title":"La cena dei vicini","italian":"Nel palazzo di Andrea abitano molte famiglie, ma quasi nessuno conosce i nomi degli altri. La maggior parte delle persone entra, sale le scale e chiude la porta. Quando Andrea ha incontrato la nuova vicina, Sofia, davanti all'ascensore, lei aveva due borse pesanti e non riusciva a trovare la chiave. Lui l'ha aiutata a portare la spesa e ha scoperto che si era trasferita da poco in città. «Non conosco nessuno qui», ha spiegato Sofia.\n\nQualche giorno dopo Andrea ha pensato di organizzare una cena con i vicini. Non aveva una casa grande e nemmeno abbastanza sedie, perciò ha chiesto agli altri di portare qualcosa. Una famiglia ha preparato la pasta, un'altra ha portato pane e formaggio. Sofia è arrivata con una torta che aveva fatto sua nonna. Per un momento tutti erano un po' timidi. Nessuno sapeva bene di che cosa parlare e i bambini correvano da una stanza all'altra.\n\nPoi qualcuno ha raccontato una storia divertente sul quartiere e tutti hanno cominciato a ridere. Una signora anziana ha spiegato com'era la strada quarant'anni prima, quando al posto del supermercato c'era un piccolo cinema. Il padre di un bambino ha detto che lavorava in biblioteca e poteva consigliare libri in italiano. Sofia ha parlato del suo lavoro e delle difficoltà di vivere lontano dalla famiglia. Gli altri l'hanno ascoltata con attenzione.\n\nAlla fine della serata Andrea ha guardato il tavolo pieno di piatti vuoti e bicchieri. «Adesso dobbiamo pulire», ha detto. Ma nessuno è andato via subito: tutti hanno dato una mano. Il giorno dopo, sulle scale, le persone si salutavano per nome. Andrea non aveva risolto tutti i problemi del palazzo, ma aveva creato qualcosa di importante con una sola cena.","english":"Many families live in Andrea's apartment building, but almost nobody knows the other residents' names. Most people come in, go upstairs, and close their doors. When Andrea met the new neighbor, Sofia, by the elevator, she was carrying two heavy shopping bags and could not find her key. He helped her carry her groceries and learned that she had recently moved to the city. “I don't know anyone here,” Sofia explained.\n\nA few days later Andrea thought of organizing a dinner with the neighbors. His apartment was not large, and he did not have enough chairs, so he asked everyone to bring something. One family made pasta; another brought bread and cheese. Sofia arrived with a cake her grandmother had made. For a while everyone was a little shy. Nobody quite knew what to talk about, and children ran from one room to another.\n\nThen someone told a funny story about the neighborhood, and everyone began to laugh. An elderly woman described what the street had been like forty years earlier, when a small cinema stood where the supermarket is now. One child's father said he worked at a library and could recommend books in Italian. Sofia talked about her job and the difficulties of living far from her family. The others listened carefully.\n\nAt the end of the evening, Andrea looked at the table covered with empty plates and glasses. “Now we have to clean up,” he said. But nobody left right away: everyone helped. The next day, on the stairs, people greeted one another by name. Andrea had not solved every problem in the building, but with one dinner he had created something important.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B1-L04","title":"Il libro ritrovato","italian":"Quando Matteo era bambino, suo nonno gli leggeva ogni sera un libro di racconti. Le pagine erano vecchie e alcune figure avevano perso colore, ma Matteo conosceva quasi tutte le storie. Dopo molti anni il nonno è morto e il libro è rimasto in una scatola insieme alle fotografie di famiglia. Matteo studiava all'università, lavorava qualche ora alla settimana e pensava di non avere tempo per quelle cose.\n\nUn giorno sua madre gli ha chiesto di aiutarla a sistemare la vecchia camera. Matteo ha aperto la scatola e ha trovato il libro. Tra le pagine c'era una piccola carta con una frase scritta a mano: «Le cose belle diventano più belle quando le condividiamo». All'inizio non ricordava chi l'avesse scritta. Poi ha riconosciuto la scrittura del nonno, un po' lenta e irregolare. Si è seduto sul letto e ha cominciato a leggere il primo racconto.\n\nQuella sera Matteo ha chiamato sua sorella, che abitava in un'altra città. Le ha raccontato della scoperta e le ha letto al telefono la prima pagina. Sua sorella ha riso: «Ti ricordi quando il nonno cambiava la voce di tutti i personaggi?». Hanno parlato per quasi un'ora. Il giorno dopo Matteo ha portato il libro in una piccola libreria per sapere se si poteva riparare la copertina. Il proprietario gli ha dato alcuni consigli e ha spiegato che un libro usato conserva anche la storia delle persone che lo leggono.\n\nMatteo non ha cercato di rendere il libro nuovo. Ha fatto sistemare soltanto le pagine più rovinate e lo ha messo vicino al letto. Quando ha avuto un nipotino, molti anni dopo, ha cominciato a leggergli quelle stesse storie. Il bambino voleva sentire sempre la stessa, e Matteo finalmente ha capito perché suo nonno non si stancava mai di raccontarla.","english":"When Matteo was a child, his grandfather read him a book of stories every evening. The pages were old and some illustrations had faded, but Matteo knew almost every story. Many years later his grandfather died, and the book stayed in a box with the family photographs. Matteo was studying at university, working a few hours a week, and thought he had no time for such things.\n\nOne day his mother asked him to help tidy up the old room. Matteo opened the box and found the book. Between its pages was a little card bearing a handwritten sentence: “Beautiful things become more beautiful when we share them.” At first he could not remember who had written it. Then he recognized his grandfather's slow, slightly uneven handwriting. He sat down on the bed and began reading the first story.\n\nThat evening Matteo called his sister, who lived in another city. He told her what he had found and read her the first page over the phone. His sister laughed: “Do you remember how Granddad changed his voice for every character?” They talked for almost an hour. The next day Matteo took the book to a small bookshop to find out whether the cover could be repaired. The owner gave him some advice and explained that a used book also preserves the history of the people who read it.\n\nMatteo did not try to make the book look new. He had only the most damaged pages repaired and put it beside his bed. When he had a little nephew many years later, he began reading him those same stories. The child always wanted to hear the same one, and Matteo finally understood why his grandfather had never grown tired of telling it.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B1-L05","title":"Il viaggio più economico","italian":"Quattro amici volevano passare un fine settimana al mare. Avevano poco denaro e idee molto diverse. Elena preferiva il treno perché poteva leggere durante il viaggio. Paolo voleva andare in macchina per fermarsi nei piccoli paesi. Sara aveva trovato un autobus economico, mentre Luca proponeva di restare a casa e cucinare insieme. Dopo una lunga discussione hanno deciso di confrontare prezzi e orari prima di scegliere.\n\nIl treno era veloce, ma i biglietti del venerdì sera costavano molto. L'autobus partiva presto il sabato e arrivava in una città lontana dalla spiaggia. La macchina sembrava comoda, però bisognava pagare il carburante e il parcheggio. Elena ha preso carta e penna e ha scritto una tabella. «Non basta guardare il prezzo del biglietto», ha spiegato. «Dobbiamo considerare anche quanto tempo perdiamo e che cosa possiamo fare una volta arrivati».\n\nAlla fine hanno scelto il treno del sabato mattina, meno caro di quello del venerdì. Sono partiti con uno zaino ciascuno e hanno comprato pane, formaggio e frutta in un mercato vicino alla stazione. Il tempo era bello e la spiaggia era quasi vuota. Nel pomeriggio hanno fatto una passeggiata lungo il mare. Paolo ha detto che la sua idea della macchina non era cattiva, ma che il treno era stato più rilassante.\n\nLa domenica, mentre tornavano in città, Sara ha chiesto se avessero davvero risparmiato. Elena ha controllato la tabella. I soldi spesi erano pochi, ma tutti ricordavano soprattutto la conversazione, il sole e il pranzo sulla spiaggia. Luca ha sorriso: «Avevo proposto di restare a casa. Per fortuna non mi avete ascoltato». Gli altri hanno riso e hanno cominciato a pensare al prossimo viaggio.","english":"Four friends wanted to spend a weekend at the seaside. They had little money and very different ideas. Elena preferred the train because she could read during the journey. Paolo wanted to go by car so they could stop in small towns. Sara had found an inexpensive bus, while Luca suggested staying home and cooking together. After a long discussion, they decided to compare prices and timetables before choosing.\n\nThe train was fast, but tickets on Friday evening were expensive. The bus left early on Saturday and arrived in a town far from the beach. The car seemed convenient, but they would have to pay for fuel and parking. Elena took out a piece of paper and a pen and made a table. “Looking at the ticket price isn't enough,” she explained. “We also need to consider how much time we'll lose and what we'll be able to do once we arrive.”\n\nIn the end they chose the Saturday morning train, which cost less than Friday's. They left with one backpack each and bought bread, cheese, and fruit at a market near the station. The weather was beautiful and the beach was almost empty. In the afternoon they went for a walk along the sea. Paolo said that his idea of driving hadn't been bad, but the train had been more relaxing.\n\nOn Sunday, as they were heading back to the city, Sara asked whether they had really saved money. Elena checked the table. They had spent little, but what everyone remembered most was the conversation, the sunshine, and lunch on the beach. Luca smiled: “I suggested staying home. Luckily, you didn't listen to me.” The others laughed and began thinking about their next trip.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]}],"translation_exercises":[{"id":"B1-T01","title":"The last train","prompt_english":"Yesterday the train was late. I waited at the station for an hour. In the end I went home.","model_italian":"Ieri il treno era in ritardo. Ho aspettato alla stazione per un’ora. Alla fine sono tornato a casa.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T02","title":"The small mystery","prompt_english":"I could not find my keys. I looked in the bag and under the bed. The keys were on the table.","model_italian":"Non trovavo le chiavi. Ho guardato nella borsa e sotto il letto. Le chiavi erano sul tavolo.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T03","title":"A good idea","prompt_english":"We have a free afternoon tomorrow. Let us go to the lake and eat in a small restaurant. I will bring the map.","model_italian":"Domani abbiamo un pomeriggio libero. Andiamo al lago e mangiamo in un piccolo ristorante. Porterò la mappa.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T04","title":"The exam","prompt_english":"The student was tired because he studied all night. In the morning he did not know the answer. The professor helped him.","model_italian":"Lo studente era stanco perché ha studiato tutta la notte. La mattina non sapeva la risposta. Il professore lo ha aiutato.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T05","title":"A surprise gift","prompt_english":"My mother gave me an old book. Inside I found a photograph of our family. I was very happy.","model_italian":"Mia madre mi ha dato un libro vecchio. Dentro ho trovato una fotografia della nostra famiglia. Ero molto felice.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T06","title":"At the pharmacy","prompt_english":"Today I do not feel well and my head hurts. The pharmacy is still open. I will go there now.","model_italian":"Oggi sto male e mi fa male la testa. La farmacia è ancora aperta. Ci andrò adesso.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T07","title":"An important email","prompt_english":"I wrote to my colleague yesterday. He has not answered yet. Tomorrow we have an important meeting.","model_italian":"Ho scritto al mio collega ieri. Non ha ancora risposto. Domani abbiamo una riunione importante.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T08","title":"Too expensive","prompt_english":"I like this coat but it is too expensive. Yesterday there was a discount. Perhaps I will buy it next week.","model_italian":"Mi piace questo cappotto, ma è troppo caro. Ieri c’era uno sconto. Forse lo comprerò la settimana prossima.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T09","title":"A quiet Sunday","prompt_english":"On Sunday I usually read books and drink coffee. Last Sunday I went to the park with a friend. Next Sunday I will go to a museum.","model_italian":"La domenica di solito leggo libri e bevo caffè. Domenica scorsa sono andato al parco con un amico. Domenica prossima andrò a un museo.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T10","title":"A missed call","prompt_english":"I was reading when my friend called. I did not hear the phone. I will call him this evening.","model_italian":"Leggevo quando un amico mi ha chiamato. Non ho sentito il telefono. Lo chiamerò questa sera.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T11","title":"The hotel","prompt_english":"We arrived at the hotel in the evening. Our room was small but clean. The next morning we went to the beach.","model_italian":"Siamo arrivati all’albergo la sera. La nostra camera era piccola ma pulita. La mattina dopo siamo andati alla spiaggia.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T12","title":"A different plan","prompt_english":"I wanted to go to the cinema, but my friend wanted to eat. We chose a restaurant near the station. The food was very good.","model_italian":"Volevo andare al cinema, ma il mio amico voleva mangiare. Abbiamo scelto un ristorante vicino alla stazione. Il cibo era molto buono.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T13","title":"The office","prompt_english":"There are three colleagues in the office. Two are working on a project. The third is looking for his phone.","model_italian":"Ci sono tre colleghi in ufficio. Due stanno lavorando a un progetto. Il terzo sta cercando il suo telefono.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T14","title":"A new city","prompt_english":"I lived in a small town when I was a child. Now I live in a big city. Next year I may move near the sea.","model_italian":"Abitavo in un piccolo paese quando ero bambino. Adesso vivo in una grande città. L’anno prossimo forse andrò a vivere vicino al mare.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T15","title":"The dinner","prompt_english":"We ate fish and vegetables for dinner. The bill was expensive but the service was good. I paid by card.","model_italian":"Abbiamo mangiato pesce e verdura per cena. Il conto era caro, ma il servizio era buono. Ho pagato con la carta.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T16","title":"A bad morning","prompt_english":"This morning it was raining and I missed the bus. I arrived at work late. Now I am drinking coffee and thinking about tomorrow.","model_italian":"Questa mattina pioveva e ho perso l’autobus. Sono arrivato tardi al lavoro. Adesso sto bevendo un caffè e penso a domani.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T17","title":"The professor","prompt_english":"Our professor asked a difficult question. Nobody knew the answer. Then he gave us a useful example.","model_italian":"Il nostro professore ha fatto una domanda difficile. Nessuno sapeva la risposta. Poi ci ha dato un esempio utile.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T18","title":"Shopping","prompt_english":"I want to buy new shoes. The black shoes are too small and the blue ones are too expensive. I will come back tomorrow.","model_italian":"Voglio comprare scarpe nuove. Le scarpe nere sono troppo piccole e quelle blu sono troppo care. Tornerò domani.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T19","title":"The photo","prompt_english":"My father found a photograph of our old home. We looked at it together for a long time. I still remember that house.","model_italian":"Mio padre ha trovato una fotografia della nostra vecchia casa. L’abbiamo guardata insieme per molto tempo. Ricordo ancora quella casa.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B1-T20","title":"The unexpected day","prompt_english":"We planned a trip to the mountains. The weather was bad, so we went to the museum instead. It was one of our best days.","model_italian":"Avevamo programmato un viaggio in montagna. Il tempo era brutto, quindi siamo andati al museo invece. È stato uno dei nostri giorni più belli.","task_type":"english_to_italian","hide_italian_until_submitted":true}],"dialogues":[{"id":1,"title":"La borsa e la chiave","lines":[{"speaker":"A","italian":"Non trovo la mia borsa. Prima era sotto il tavolo.","english":"I cannot find my bag. Earlier it was under the table."},{"speaker":"B","italian":"Quella vicino alla porta non è tua?","english":"Is that one by the door not yours?"},{"speaker":"A","italian":"No, è la tua. La mia è più grande.","english":"No, it is yours. Mine is bigger."},{"speaker":"B","italian":"Allora guarda dentro la macchina.","english":"Then look inside the car."},{"speaker":"A","italian":"Ma perché la mia borsa è nella macchina?","english":"But why is my bag in the car?"},{"speaker":"B","italian":"Ieri eri molto stanco. Ho messo io la borsa lì.","english":"You were very tired yesterday. I put the bag there."},{"speaker":"A","italian":"Va bene. E dov’è la chiave della macchina?","english":"All right. And where is the car key?"},{"speaker":"B","italian":"Dentro la tua borsa.","english":"Inside your bag."},{"speaker":"A","italian":"Ma la macchina è chiusa!","english":"But the car is locked!"},{"speaker":"B","italian":"Ah... allora abbiamo un problema.","english":"Oh... then we have a problem."}],"content_id":"B1-D01","audio_path":"Audio/Dialogues/dialogue_01.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":2,"title":"L’esame tra dieci minuti","lines":[{"speaker":"A","italian":"Sei pronto per l’esame?","english":"Are you ready for the exam?"},{"speaker":"B","italian":"Non proprio. Ieri avevo una riunione e dopo ero molto stanco.","english":"Not really. Yesterday I had a meeting and afterwards was very tired."},{"speaker":"A","italian":"Ma hai letto il libro?","english":"But did you read the book?"},{"speaker":"B","italian":"Questa mattina, sul treno.","english":"This morning, on the train."},{"speaker":"A","italian":"Tutto il libro?","english":"The whole book?"},{"speaker":"B","italian":"No, soltanto una parte.","english":"No, only part of it."},{"speaker":"A","italian":"L’esame inizia tra dieci minuti!","english":"The exam starts in ten minutes!"},{"speaker":"B","italian":"Lo so. Forse oggi le domande saranno facili.","english":"I know. Maybe the questions will be easy today."},{"speaker":"A","italian":"Tu credi?","english":"Do you think so?"},{"speaker":"B","italian":"No. Ma voglio crederci!","english":"No. But I want to believe it!"}],"content_id":"B1-D02","audio_path":"Audio/Dialogues/dialogue_02.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":3,"title":"Una cena molto cara","lines":[{"speaker":"A","italian":"Questo ristorante è bellissimo! Come lo hai trovato?","english":"This restaurant is beautiful! How did you find it?"},{"speaker":"B","italian":"Un collega mi ha dato il nome.","english":"A colleague gave me the name."},{"speaker":"A","italian":"Il menù è interessante. Io prenderò il pesce.","english":"The menu is interesting. I will have the fish."},{"speaker":"B","italian":"Io invece prenderò la carne.","english":"I will have the meat instead."},{"speaker":"A","italian":"Hai visto il prezzo?","english":"Have you seen the price?"},{"speaker":"B","italian":"Sì... forse il mio collega ha molti soldi.","english":"Yes... maybe my colleague has a lot of money."},{"speaker":"A","italian":"Possiamo ancora andare in un altro ristorante.","english":"We can still go to another restaurant."},{"speaker":"B","italian":"No, ormai siamo qui. Prendiamo soltanto un piatto.","english":"No, we are already here. Let us order just one dish."},{"speaker":"A","italian":"Va bene. Ma chi paga?","english":"All right. But who is paying?"},{"speaker":"B","italian":"Ho soltanto venti euro.","english":"I only have twenty euros."},{"speaker":"A","italian":"Allora prendiamo un bicchiere d’acqua e andiamo a casa!","english":"Then let us have a glass of water and go home!"}],"content_id":"B1-D03","audio_path":"Audio/Dialogues/dialogue_03.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":4,"title":"Sale nel caffè","lines":[{"speaker":"A","italian":"Ho fatto colazione per tutti. Il caffè è pronto!","english":"I have made breakfast for everyone. The coffee is ready!"},{"speaker":"B","italian":"Grazie! Ma... cosa hai messo nel caffè?","english":"Thanks! But... what did you put in the coffee?"},{"speaker":"A","italian":"Latte e zucchero, come sempre.","english":"Milk and sugar, as always."},{"speaker":"B","italian":"Sei sicura?","english":"Are you sure?"},{"speaker":"A","italian":"Certo. Perché?","english":"Of course. Why?"},{"speaker":"B","italian":"Guarda il tavolo. Lo zucchero è qui, ma il sale è aperto.","english":"Look at the table. The sugar is here, but the salt is open."},{"speaker":"A","italian":"Oh, no! Ho messo il sale nel caffè!","english":"Oh no! I put salt in the coffee!"},{"speaker":"B","italian":"Adesso capisco perché il caffè è così diverso.","english":"Now I understand why the coffee tastes so different."},{"speaker":"A","italian":"Vuoi un altro caffè?","english":"Do you want another coffee?"},{"speaker":"B","italian":"Sì, ma questa volta senza sale, per favore.","english":"Yes, but this time without salt, please."}],"content_id":"B1-D04","audio_path":"Audio/Dialogues/dialogue_04.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":5,"title":"Il collega sulla spiaggia","lines":[{"speaker":"A","italian":"Luca? Sei proprio tu?","english":"Luca? Is that really you?"},{"speaker":"B","italian":"Paolo! Cosa fai qui?","english":"Paolo! What are you doing here?"},{"speaker":"A","italian":"Sono arrivato ieri. Pensavo che tu fossi in ufficio.","english":"I arrived yesterday. I thought you were at the office."},{"speaker":"B","italian":"E io pensavo la stessa cosa di te!","english":"And I thought the same about you!"},{"speaker":"A","italian":"Ma domani abbiamo una riunione importante.","english":"But we have an important meeting tomorrow."},{"speaker":"B","italian":"Lo so. Ho già letto il documento.","english":"I know. I have already read the document."},{"speaker":"A","italian":"Io invece non ho ancora finito il progetto.","english":"I still have not finished the project."},{"speaker":"B","italian":"Allora perché sei sulla spiaggia?","english":"Then why are you on the beach?"},{"speaker":"A","italian":"Perché speravo di non trovare nessun collega qui.","english":"Because I was hoping not to meet any colleagues here."},{"speaker":"B","italian":"Bene. Allora non ci siamo visti!","english":"Good. Then we did not see each other!"}],"content_id":"B1-D05","audio_path":"Audio/Dialogues/dialogue_05.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":6,"title":"La giacca e lo sconto","lines":[{"speaker":"A","italian":"Buongiorno. Quanto costa questa giacca?","english":"Good morning. How much is this jacket?"},{"speaker":"B","italian":"Cento euro, ma oggi c’è uno sconto.","english":"One hundred euros, but today there is a discount."},{"speaker":"A","italian":"Bene! Quanto costa con lo sconto?","english":"Great! How much is it with the discount?"},{"speaker":"B","italian":"Novanta euro.","english":"Ninety euros."},{"speaker":"A","italian":"Soltanto dieci euro di sconto?","english":"Only ten euros off?"},{"speaker":"B","italian":"Sì, ma la qualità è molto buona.","english":"Yes, but the quality is very good."},{"speaker":"A","italian":"Ieri ho visto una giacca simile a cinquanta euro.","english":"Yesterday I saw a similar jacket for fifty euros."},{"speaker":"B","italian":"Allora perché non ha comprato quella?","english":"Then why did you not buy that one?"},{"speaker":"A","italian":"Perché era troppo piccola.","english":"Because it was too small."},{"speaker":"B","italian":"Forse oggi non è il giorno giusto per comprare una giacca.","english":"Maybe today is not the right day to buy a jacket."}],"content_id":"B1-D06","audio_path":"Audio/Dialogues/dialogue_06.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":7,"title":"Il regalo per la moglie","lines":[{"speaker":"A","italian":"Voglio comprare un regalo per mia moglie.","english":"I want to buy a gift for my wife."},{"speaker":"B","italian":"Cosa le piace?","english":"What does she like?"},{"speaker":"A","italian":"Le piacciono i libri.","english":"She likes books."},{"speaker":"B","italian":"Allora compra un libro!","english":"Then buy a book!"},{"speaker":"A","italian":"Il problema è che ha già molti libri.","english":"The problem is that she already has many books."},{"speaker":"B","italian":"E una borsa nuova?","english":"How about a new bag?"},{"speaker":"A","italian":"Ne ha già tre.","english":"She already has three."},{"speaker":"B","italian":"Un viaggio al mare?","english":"A trip to the seaside?"},{"speaker":"A","italian":"Interessante! Ma non ho molti soldi.","english":"Interesting! But I do not have much money."},{"speaker":"B","italian":"Allora fai una bella cena a casa.","english":"Then make a nice dinner at home."},{"speaker":"A","italian":"Buona idea. Ma non so cucinare.","english":"Good idea. But I cannot cook."},{"speaker":"B","italian":"Posso aiutarti. Però il pesce lo compri tu!","english":"I can help. But you are buying the fish!"}],"content_id":"B1-D07","audio_path":"Audio/Dialogues/dialogue_07.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":8,"title":"Dove siamo?","lines":[{"speaker":"A","italian":"Siamo vicini al museo?","english":"Are we near the museum?"},{"speaker":"B","italian":"Credo di sì. La mappa dice che è dietro la piazza.","english":"I think so. The map says it is behind the square."},{"speaker":"A","italian":"Ma questa non è una piazza. È un parcheggio.","english":"But this is not a square. It is a parking lot."},{"speaker":"B","italian":"Allora forse siamo nella strada sbagliata.","english":"Then maybe we are on the wrong street."},{"speaker":"A","italian":"Guarda, c’è una persona vicino al semaforo. Chiediamo!","english":"Look, there is someone near the traffic light. Let us ask!"},{"speaker":"B","italian":"Scusi, dov’è il museo?","english":"Excuse me, where is the museum?"},{"speaker":"A","italian":"È dall’altra parte della città.","english":"It is on the other side of the city."},{"speaker":"B","italian":"Ma abbiamo camminato per un’ora!","english":"But we have walked for an hour!"},{"speaker":"A","italian":"Almeno abbiamo visto un quartiere nuovo.","english":"At least we have seen a new neighborhood."},{"speaker":"B","italian":"La prossima volta prendo un taxi.","english":"Next time I am taking a taxi."}],"content_id":"B1-D08","audio_path":"Audio/Dialogues/dialogue_08.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":9,"title":"La camera dell’albergo","lines":[{"speaker":"A","italian":"Buonasera. Ho una camera qui.","english":"Good evening. I have a room here."},{"speaker":"B","italian":"Certo. La camera è pronta.","english":"Of course. The room is ready."},{"speaker":"A","italian":"Ma perché c’è soltanto un letto piccolo?","english":"But why is there only one small bed?"},{"speaker":"B","italian":"È una camera per una persona.","english":"It is a room for one person."},{"speaker":"A","italian":"Ma siamo in due!","english":"But there are two of us!"},{"speaker":"B","italian":"Ah. Allora avete bisogno di una camera più grande.","english":"Oh. Then you need a larger room."},{"speaker":"A","italian":"Ne avete una?","english":"Do you have one?"},{"speaker":"B","italian":"Una camera grande c’è, ma costa di più.","english":"We have a large room, but it costs more."},{"speaker":"A","italian":"Quanto di più?","english":"How much more?"},{"speaker":"B","italian":"Il doppio.","english":"Twice as much."},{"speaker":"A","italian":"Allora forse questo letto non è così piccolo...","english":"Then perhaps this bed is not so small..."}],"content_id":"B1-D09","audio_path":"Audio/Dialogues/dialogue_09.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":10,"title":"Un libro molto interessante","lines":[{"speaker":"A","italian":"Hai finito il libro che ti ho dato?","english":"Have you finished the book I gave you?"},{"speaker":"B","italian":"Sì, ieri sera.","english":"Yes, last night."},{"speaker":"A","italian":"Ti è piaciuto?","english":"Did you like it?"},{"speaker":"B","italian":"Non molto.","english":"Not very much."},{"speaker":"A","italian":"Come? È il mio libro preferito!","english":"What? It is my favorite book!"},{"speaker":"B","italian":"La prima parte era interessante, ma dopo non capivo più niente.","english":"The first part was interesting, but later I did not understand anything."},{"speaker":"A","italian":"Forse hai letto troppo velocemente.","english":"Maybe you read too quickly."},{"speaker":"B","italian":"No, ho letto tutto due volte.","english":"No, I read everything twice."},{"speaker":"A","italian":"Due volte? Ma hai detto che non ti piaceva!","english":"Twice? But you said you did not like it!"},{"speaker":"B","italian":"La prima volta non capivo. La seconda volevo capire perché non capivo.","english":"The first time I did not understand. The second time I wanted to understand why I did not understand."}],"content_id":"B1-D10","audio_path":"Audio/Dialogues/dialogue_10.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":11,"title":"Il biglietto per domani","lines":[{"speaker":"A","italian":"È questo il treno per Torino?","english":"Is this the train to Turin?"},{"speaker":"B","italian":"Sì. Hai già il biglietto?","english":"Yes. Do you have the ticket?"},{"speaker":"A","italian":"Certo. L’ho comprato ieri.","english":"Of course. I bought it yesterday."},{"speaker":"B","italian":"Aspetta... qui c’è scritto domani.","english":"Wait... it says tomorrow here."},{"speaker":"A","italian":"Domani? Ma io devo partire oggi!","english":"Tomorrow? But I have to leave today!"},{"speaker":"B","italian":"Allora devi comprare un altro biglietto.","english":"Then you must buy another ticket."},{"speaker":"A","italian":"E questo biglietto?","english":"And this ticket?"},{"speaker":"B","italian":"Puoi usarlo domani.","english":"You can use it tomorrow."},{"speaker":"A","italian":"Ma domani sarò già a Torino!","english":"But tomorrow I will already be in Turin!"},{"speaker":"B","italian":"Bene, allora domani potrai prendere un altro treno!","english":"Good, then tomorrow you can take another train!"}],"content_id":"B1-D11","audio_path":"Audio/Dialogues/dialogue_11.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":12,"title":"Il padre e il figlio","lines":[{"speaker":"A","italian":"Domani andiamo al parco?","english":"Shall we go to the park tomorrow?"},{"speaker":"B","italian":"Domani devo lavorare.","english":"I must work tomorrow."},{"speaker":"A","italian":"Ma lavori sempre!","english":"But you always work!"},{"speaker":"B","italian":"Lo so. Ho un progetto importante.","english":"I know. I have an important project."},{"speaker":"A","italian":"Più importante di me?","english":"More important than me?"},{"speaker":"B","italian":"No, certo che no.","english":"No, of course not."},{"speaker":"A","italian":"Allora vieni al parco con me.","english":"Then come to the park with me."},{"speaker":"B","italian":"E il progetto?","english":"And the project?"},{"speaker":"A","italian":"Puoi lavorare dopo.","english":"You can work afterwards."},{"speaker":"B","italian":"Hai già pensato a tutto!","english":"You have already thought of everything!"},{"speaker":"A","italian":"Sì. Dopo il parco possiamo andare al cinema?","english":"Yes. After the park can we go to the cinema?"}],"content_id":"B1-D12","audio_path":"Audio/Dialogues/dialogue_12.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":13,"title":"In farmacia","lines":[{"speaker":"A","italian":"Buongiorno. Mi fa male la testa.","english":"Good morning. My head hurts."},{"speaker":"B","italian":"Da quando?","english":"Since when?"},{"speaker":"A","italian":"Da ieri sera. Ieri ho lavorato molto e ho dormito poco.","english":"Since last night. Yesterday I worked a lot and slept little."},{"speaker":"B","italian":"Ha parlato con un dottore?","english":"Have you spoken with a doctor?"},{"speaker":"A","italian":"No. Oggi sto ancora male.","english":"No. I still feel unwell today."},{"speaker":"B","italian":"Allora deve andare dal dottore.","english":"Then you should go to the doctor."},{"speaker":"A","italian":"Ma oggi ho una riunione importante!","english":"But I have an important meeting today!"},{"speaker":"B","italian":"La salute è più importante della riunione.","english":"Health is more important than the meeting."},{"speaker":"A","italian":"Anche mia moglie mi ha detto questo.","english":"My wife told me that too."},{"speaker":"B","italian":"Allora oggi ascolti sua moglie.","english":"Then listen to your wife today."},{"speaker":"A","italian":"Credo che abbia ragione.","english":"I think you are right."}],"content_id":"B1-D13","audio_path":"Audio/Dialogues/dialogue_13.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":14,"title":"Al mercato","lines":[{"speaker":"A","italian":"Buongiorno! Quanto costa questo formaggio?","english":"Good morning! How much is this cheese?"},{"speaker":"B","italian":"Dieci euro.","english":"Ten euros."},{"speaker":"A","italian":"Dieci? Ieri il prezzo era otto!","english":"Ten? Yesterday the price was eight!"},{"speaker":"B","italian":"Ieri c’era uno sconto.","english":"Yesterday there was a discount."},{"speaker":"A","italian":"E oggi?","english":"And today?"},{"speaker":"B","italian":"Oggi no.","english":"Not today."},{"speaker":"A","italian":"Allora prendo soltanto il pane.","english":"Then I will only take the bread."},{"speaker":"B","italian":"Anche il pane oggi è diverso.","english":"The bread is different today too."},{"speaker":"A","italian":"È più caro?","english":"Is it more expensive?"},{"speaker":"B","italian":"No, è più piccolo.","english":"No, it is smaller."},{"speaker":"A","italian":"Allora oggi compro soltanto la frutta.","english":"Then today I will only buy fruit."},{"speaker":"B","italian":"Anche la frutta è diversa oggi...","english":"The fruit is different today too..."},{"speaker":"A","italian":"No! Non voglio sapere!","english":"No! I do not want to know!"}],"content_id":"B1-D14","audio_path":"Audio/Dialogues/dialogue_14.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":15,"title":"In biblioteca","lines":[{"speaker":"A","italian":"Perché sei qui? Di solito leggi a casa.","english":"Why are you here? You usually read at home."},{"speaker":"B","italian":"Oggi a casa non posso leggere.","english":"Today I cannot read at home."},{"speaker":"A","italian":"Perché?","english":"Why?"},{"speaker":"B","italian":"Mio figlio ascolta la musica e mia moglie guarda un film.","english":"My son listens to music and my wife watches a movie."},{"speaker":"A","italian":"E tu cosa volevi fare?","english":"And what did you want to do?"},{"speaker":"B","italian":"Leggere questo libro per l’esame.","english":"Read this book for the exam."},{"speaker":"A","italian":"Qui puoi leggere senza problemi.","english":"You can read here without problems."},{"speaker":"B","italian":"Sì. Ma adesso sto parlando con te.","english":"Yes. But now I am talking with you."},{"speaker":"A","italian":"Allora forse il problema non era a casa!","english":"Then perhaps the problem was not at home!"},{"speaker":"B","italian":"Hai ragione. Adesso leggo.","english":"You are right. I will read now."}],"content_id":"B1-D15","audio_path":"Audio/Dialogues/dialogue_15.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":16,"title":"Il progetto non è pronto","lines":[{"speaker":"A","italian":"Hai scritto al professore?","english":"Did you write to the professor?"},{"speaker":"B","italian":"Sì, ieri sera.","english":"Yes, last night."},{"speaker":"A","italian":"E cosa gli hai detto?","english":"And what did you tell him?"},{"speaker":"B","italian":"Che il progetto è pronto.","english":"That the project is ready."},{"speaker":"A","italian":"Ma il progetto non è pronto!","english":"But the project is not ready!"},{"speaker":"B","italian":"Lo so. Domani sarà pronto.","english":"I know. It will be ready tomorrow."},{"speaker":"A","italian":"Ma perché hai scritto ieri?","english":"But why did you write yesterday?"},{"speaker":"B","italian":"Pensavo che il professore avrebbe letto il messaggio domani.","english":"I thought the professor would read the message tomorrow."},{"speaker":"A","italian":"E invece?","english":"And instead?"},{"speaker":"B","italian":"Ha già risposto. Vuole il documento adesso.","english":"He has already replied. He wants the document now."},{"speaker":"A","italian":"Allora abbiamo un problema molto grande.","english":"Then we have a very big problem."}],"content_id":"B1-D16","audio_path":"Audio/Dialogues/dialogue_16.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":17,"title":"Due amici al cinema","lines":[{"speaker":"A","italian":"Finalmente! Dove eri?","english":"Finally! Where were you?"},{"speaker":"B","italian":"Scusa, il treno era in ritardo.","english":"Sorry, the train was late."},{"speaker":"A","italian":"Ti aspettavo da un’ora!","english":"I have been waiting for you for an hour!"},{"speaker":"B","italian":"Un’ora? Ma il film inizia alle nove.","english":"An hour? But the movie starts at nine."},{"speaker":"A","italian":"No, iniziava alle otto.","english":"No, it was starting at eight."},{"speaker":"B","italian":"Allora possiamo ancora vedere una parte del film.","english":"Then we can still watch part of the movie."},{"speaker":"A","italian":"Non voglio vedere soltanto una parte.","english":"I do not want to watch only part of it."},{"speaker":"B","italian":"Va bene. Andiamo a mangiare?","english":"All right. Shall we go eat?"},{"speaker":"A","italian":"Ottima idea. Ma questa volta scegli tu il ristorante.","english":"Great idea. But this time you choose the restaurant."},{"speaker":"B","italian":"Perché?","english":"Why?"},{"speaker":"A","italian":"Perché se è chiuso, sarà un tuo problema!","english":"Because if it is closed, it will be your problem!"}],"content_id":"B1-D17","audio_path":"Audio/Dialogues/dialogue_17.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":18,"title":"Un messaggio per la persona sbagliata","lines":[{"speaker":"A","italian":"Perché mi hai scritto: Ti aspetto al ristorante?","english":"Why did you write to me: I am waiting for you at the restaurant?"},{"speaker":"B","italian":"Non era un messaggio per te!","english":"That message was not for you!"},{"speaker":"A","italian":"Ah, allora per chi era?","english":"Oh, then who was it for?"},{"speaker":"B","italian":"Per mia moglie.","english":"For my wife."},{"speaker":"A","italian":"Ma tu sei in ufficio e tua moglie è a casa!","english":"But you are at the office and your wife is at home!"},{"speaker":"B","italian":"Sì. Questa sera andremo al ristorante.","english":"Yes. This evening we are going to a restaurant."},{"speaker":"A","italian":"E perché hai scritto a me?","english":"And why did you write to me?"},{"speaker":"B","italian":"Ho scelto il numero sbagliato.","english":"I chose the wrong number."},{"speaker":"A","italian":"Bene. Allora non devo venire?","english":"Fine. So I do not have to come?"},{"speaker":"B","italian":"No!","english":"No!"},{"speaker":"A","italian":"Va bene, va bene. Ma il ristorante è buono?","english":"All right, all right. But is the restaurant good?"},{"speaker":"B","italian":"Non lo so. È la prima volta.","english":"I do not know. It is my first time."}],"content_id":"B1-D18","audio_path":"Audio/Dialogues/dialogue_18.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":19,"title":"Una decisione difficile","lines":[{"speaker":"A","italian":"Vuoi vivere vicino al mare o in montagna?","english":"Do you want to live by the sea or in the mountains?"},{"speaker":"B","italian":"Bella domanda. Mi piace il mare, ma mi piace anche la montagna.","english":"Good question. I like the sea but I also like the mountains."},{"speaker":"A","italian":"In montagna fa freddo.","english":"It is cold in the mountains."},{"speaker":"B","italian":"Sì, ma in estate il mare è pieno di persone.","english":"Yes, but in summer the seaside is full of people."},{"speaker":"A","italian":"Allora forse un piccolo paese vicino a un lago?","english":"Then perhaps a small town by a lake?"},{"speaker":"B","italian":"Un lago? Interessante.","english":"A lake? Interesting."},{"speaker":"A","italian":"Potremmo vivere lì e lavorare da casa.","english":"We could live there and work from home."},{"speaker":"B","italian":"E l’università?","english":"And the university?"},{"speaker":"A","italian":"Potrai prendere il treno.","english":"You can take the train."},{"speaker":"B","italian":"Ogni giorno?","english":"Every day?"},{"speaker":"A","italian":"Sì.","english":"Yes."},{"speaker":"B","italian":"Allora forse preferisco vivere vicino alla stazione!","english":"Then perhaps I prefer living near the station!"}],"content_id":"B1-D19","audio_path":"Audio/Dialogues/dialogue_19.mp3","audio_language":"it","speakers":"A/B synthetic Italian voices"},{"id":20,"title":"La vita dopo l’università","lines":[{"speaker":"A","italian":"Cosa farai dopo l’università?","english":"What will you do after university?"},{"speaker":"B","italian":"Non lo so ancora. Forse lavorerò in una banca.","english":"I still do not know. Maybe I will work in a bank."},{"speaker":"A","italian":"E dove vorresti vivere?","english":"And where would you like to live?"},{"speaker":"B","italian":"Forse in una grande città.","english":"Maybe in a big city."},{"speaker":"A","italian":"Ma prima dicevi che volevi vivere vicino al mare.","english":"But earlier you said you wanted to live by the sea."},{"speaker":"B","italian":"È vero. Quando ero bambino andavo spesso al mare con la famiglia.","english":"It is true. As a child I often went to the seaside with my family."},{"speaker":"A","italian":"Allora perché vuoi vivere in città?","english":"Then why do you want to live in the city?"},{"speaker":"B","italian":"Perché lì ci sono più possibilità di lavoro.","english":"Because there are more job opportunities there."},{"speaker":"A","italian":"E se trovi un buon lavoro vicino al mare?","english":"And if you find a good job by the sea?"},{"speaker":"B","italian":"Allora non avrò più un problema!","english":"Then I will not have a problem anymore!"},{"speaker":"A","italian":"Bene. Ma adesso hai un esa
