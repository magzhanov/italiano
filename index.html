,"ha saltato","abbiamo saltato","avete saltato","hanno saltato"],"example_it":"Salto la pausa quando sono in ritardo.","example_en":"I skip the break when I am late.","conjugation_order":["io","tu","lui/lei","noi","voi","loro"],"mastery_granularity":"tense x person","reflexive":false},{"id":48,"content_id":"B3-V048","batch_id":5,"infinitive":"ballare","en":"to dance","present":["ballo","balli","balla","balliamo","ballate","ballano"],"imperfect":["ballavo","ballavi","ballava","ballavamo","ballavate","ballavano"],"future":["ballerò","ballerai","ballerà","balleremo","ballerete","balleranno"],"participle":"ballato","aux":"avere","gerund":"ballando","past_compound_forms":["ho ballato","hai ballato","ha ballato","abbiamo ballato","avete ballato","hanno ballato"],"example_it":"Balliamo insieme alla festa.","example_en":"We dance together at the party.","conjugation_order":["io","tu","lui/lei","noi","voi","loro"],"mastery_granularity":"tense x person","reflexive":false},{"id":49,"content_id":"B3-V049","batch_id":5,"infinitive":"suonare","en":"to play an instrument / ring","present":["suono","suoni","suona","suoniamo","suonate","suonano"],"imperfect":["suonavo","suonavi","suonava","suonavamo","suonavate","suonavano"],"future":["suonerò","suonerai","suonerà","suoneremo","suonerete","suoneranno"],"participle":"suonato","aux":"avere","gerund":"suonando","past_compound_forms":["ho suonato","hai suonato","ha suonato","abbiamo suonato","avete suonato","hanno suonato"],"example_it":"Suono il pianoforte ogni sera.","example_en":"I play piano every evening.","conjugation_order":["io","tu","lui/lei","noi","voi","loro"],"mastery_granularity":"tense x person","reflexive":false},{"id":50,"content_id":"B3-V050","batch_id":5,"infinitive":"cantare","en":"to sing","present":["canto","canti","canta","cantiamo","cantate","cantano"],"imperfect":["cantavo","cantavi","cantava","cantavamo","cantavate","cantavano"],"future":["canterò","canterai","canterà","canteremo","canterete","canteranno"],"participle":"cantato","aux":"avere","gerund":"cantando","past_compound_forms":["ho cantato","hai cantato","ha cantato","abbiamo cantato","avete cantato","hanno cantato"],"example_it":"Cantano durante il viaggio.","example_en":"They sing during the trip.","conjugation_order":["io","tu","lui/lei","noi","voi","loro"],"mastery_granularity":"tense x person","reflexive":false}],"readings":[{"id":"B3-L01","title":"Il quartiere che voleva un giardino","italian":"In una strada piena di palazzi c'era un cortile che nessuno usava. Per anni era rimasto chiuso dietro un cancello arrugginito, con qualche vecchia panchina e molte erbacce. Un giorno, durante una riunione dell'associazione di quartiere, una volontaria di nome Laura ha proposto di trasformarlo in un giardino condiviso. Alcuni residenti erano entusiasti; altri temevano il rumore, i costi e il lavoro necessario per la manutenzione.\n\nLaura ha deciso di non chiedere subito una votazione. Ha invitato i vicini a visitare il cortile e a descrivere cosa desideravano. Una madre ha proposto uno spazio per i bambini, un signore anziano voleva coltivare pomodori e una studentessa ha chiesto un tavolo per leggere all'aperto. I volontari hanno raccolto le idee e preparato una proposta con due alternative. Il responsabile del municipio ha spiegato quali permessi erano necessari e quali lavori dovevano essere affidati a professionisti.\n\nLa prima giornata di pulizia è stata faticosa. Un volontario ha portato guanti e sacchetti, un altro ha sistemato le sedie. Il gruppo ha scoperto che sotto le erbacce c'era un piccolo sentiero di pietra. Quando è arrivato il momento di scegliere le piante, i residenti hanno discusso a lungo. Alla fine hanno preferito specie che richiedevano poca acqua e potevano resistere al caldo. Ogni famiglia si è assunta un turno di cura del giardino.\n\nSei mesi dopo il cortile era cambiato. Non era perfetto e qualche problema era rimasto, ma i vicini ora si conoscevano. La parte più importante del progetto non era soltanto il verde: era aver imparato a discutere senza litigare, ad ascoltare le persone con bisogni diversi e a rispettare un accordo comune. Laura ha guardato le piante nuove e ha pensato che anche la fiducia, come un giardino, aveva bisogno di tempo.","english":"On a street full of apartment buildings, there was a courtyard nobody used. For years it had remained locked behind a rusty gate, with a few old benches and plenty of weeds. One day, at a neighborhood association meeting, a volunteer named Laura suggested turning it into a shared garden. Some residents were enthusiastic; others were worried about noise, costs, and the work needed for maintenance.\n\nLaura decided not to call for an immediate vote. She invited the neighbors to visit the courtyard and describe what they wanted. A mother suggested a space for children, an elderly gentleman wanted to grow tomatoes, and a student asked for a table where she could read outside. The volunteers gathered the ideas and prepared a proposal with two alternatives. The local municipal official explained which permits were needed and which work would have to be assigned to professionals.\n\nThe first cleanup day was tiring. One volunteer brought gloves and bags; another arranged the chairs. The group discovered a small stone path beneath the weeds. When the time came to choose the plants, the residents discussed it at length. In the end they preferred varieties that needed little water and could withstand the heat. Each family took responsibility for a turn caring for the garden.\n\nSix months later the courtyard had changed. It was not perfect, and some problems remained, but now the neighbors knew one another. The most important part of the project was not just the greenery: it was learning to discuss things without quarreling, listen to people with different needs, and respect a shared agreement. Laura looked at the new plants and thought that trust, too, needs time, just like a garden.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B3-L02","title":"Un piccolo errore nell'ufficio","italian":"Tommaso aveva iniziato un nuovo lavoro in un ufficio amministrativo. Il suo compito era controllare documenti, compilare moduli e inviare conferme ai clienti. Durante la prima settimana tutto sembrava andare bene. Poi, un venerdì pomeriggio, ha scoperto di aver inserito una data sbagliata in una pratica importante. Il cliente avrebbe ricevuto un appuntamento nel giorno errato, e la scadenza era vicina.\n\nPer alcuni minuti Tommaso ha pensato di correggere il file senza dire niente. Ma non sapeva se il documento fosse già stato inviato. Ha deciso quindi di chiamare la responsabile del reparto e spiegarle il problema. Lei non si è arrabbiata. Gli ha chiesto di verificare la cronologia delle modifiche, controllare il registro e preparare una comunicazione chiara per il cliente. «Gli errori succedono», ha detto, «ma dobbiamo sapere come correggerli e come evitarli».\n\nTommaso ha lavorato insieme a una collega. Hanno controllato la firma, il numero del modulo e la registrazione della pratica. Per fortuna la conferma non era ancora partita. Hanno aggiornato il sistema, salvato una copia corretta e scritto una breve nota interna. Il giorno dopo Tommaso ha preparato una lista di controllo con cinque passaggi da seguire prima di inviare una pratica. Il gruppo l'ha trovata utile e ha deciso di adottarla.\n\nA distanza di qualche settimana Tommaso si sentiva molto più sicuro. Non perché non commettesse più errori, ma perché sapeva come affrontarli. Durante una riunione ha raccontato quell'episodio senza vergogna. Un nuovo collega gli ha chiesto un consiglio. Tommaso ha risposto: «Non perdere tempo a nascondere un problema. Controlla i fatti, chiedi aiuto e lascia una traccia chiara di quello che hai fatto».","english":"Tommaso had started a new job in an administrative office. His tasks were checking documents, filling in forms, and sending confirmations to clients. During the first week everything seemed to be going well. Then, one Friday afternoon, he discovered he had entered the wrong date in an important case file. The client would receive an appointment on the wrong day, and the deadline was approaching.\n\nFor a few minutes Tommaso considered correcting the file without saying anything. But he did not know whether the document had already been sent. So he decided to call the department manager and explain the problem. She did not get angry. She asked him to check the editing history, inspect the register, and prepare a clear message for the client. “Mistakes happen,” she said, “but we need to know how to correct them and prevent them.”\n\nTommaso worked with a colleague. They checked the signature, the form number, and the registration of the case. Luckily the confirmation had not yet been sent. They updated the system, saved a corrected copy, and wrote a brief internal note. The next day Tommaso prepared a five-step checklist to follow before sending a file. The team found it useful and decided to adopt it.\n\nA few weeks later Tommaso felt much more confident. Not because he no longer made mistakes, but because he knew how to deal with them. During a meeting he told the story without embarrassment. A new colleague asked him for advice. Tommaso replied: “Don't waste time hiding a problem. Check the facts, ask for help, and leave a clear record of what you did.”","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B3-L03","title":"La voce alla radio","italian":"Marta studiava italiano da alcuni mesi. Conosceva molte parole, ma quando ascoltava la radio capiva solo alcune frasi. I presentatori parlavano velocemente, cambiavano argomento e usavano espressioni che non comparivano nei suoi esercizi. Un giorno, durante il viaggio in autobus, ha sentito un'intervista a una donna che organizzava spettacoli in un piccolo teatro. Le è piaciuto il tema, ma non è riuscita a seguire la conversazione fino alla fine.\n\nLa sera ha cercato la registrazione sul sito della radio. Ha ascoltato lo stesso minuto quattro volte. Alla prima volta ha scritto soltanto le parole che riconosceva. Alla seconda ha cercato di capire chi parlava. Alla terza ha identificato alcune espressioni nuove, ma ha deciso di non fermarsi a ogni parola. Infine ha ascoltato senza leggere e ha scoperto di capire molto più di quanto pensasse. Ha annotato le frasi utili in un quaderno, con un esempio personale per ciascuna.\n\nIl giorno dopo ha raccontato l'esperimento a un'amica italiana. L'amica le ha suggerito di registrare alcune frasi con la propria voce e confrontarle con l'originale. Marta ha provato, ma si è accorta che pronunciava male alcuni gruppi di consonanti. Ha chiesto all'amica di aiutarla con le parole più difficili. Invece di correggere tutto, hanno scelto tre suoni e li hanno praticati in brevi conversazioni.\n\nDopo due settimane Marta ha riascoltato la prima intervista. Non capiva ogni dettaglio, ma seguiva la storia e riconosceva diverse frasi. Ha capito che imparare una lingua non significa aspettare il giorno in cui ogni parola sarà chiara. Significa costruire un'abitudine, accettare l'incertezza e tornare più volte su un testo finché diventa familiare. Quella mattina ha acceso di nuovo la radio, senza paura della velocità.","english":"Marta had been studying Italian for a few months. She knew many words, but when she listened to the radio she understood only a few sentences. The presenters spoke quickly, changed topics, and used expressions that did not appear in her exercises. One day, on the bus, she heard an interview with a woman who organized performances at a small theater. She liked the subject, but could not follow the conversation to the end.\n\nThat evening she found the recording on the radio station's website. She listened to the same minute four times. The first time she wrote down only the words she recognized. The second time she tried to understand who was speaking. The third time she identified some new expressions, but decided not to stop at every word. Finally, she listened without reading and discovered that she understood much more than she had thought. She noted down useful phrases in a notebook, with a personal example for each one.\n\nThe next day she told an Italian friend about the experiment. Her friend suggested recording some sentences in her own voice and comparing them with the original. Marta tried, but noticed that she pronounced certain groups of consonants badly. She asked her friend to help with the hardest words. Rather than correcting everything, they chose three sounds and practiced them in short conversations.\n\nTwo weeks later Marta listened to the first interview again. She still did not understand every detail, but she could follow the story and recognize several phrases. She realized that learning a language does not mean waiting for the day when every word will be clear. It means building a habit, accepting uncertainty, and returning to a passage several times until it becomes familiar. That morning she turned on the radio again, no longer afraid of its speed.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B3-L04","title":"Una settimana in montagna","italian":"Tre amici hanno prenotato una settimana in un rifugio di montagna. Nessuno di loro era un alpinista esperto, ma tutti amavano camminare. Prima di partire hanno controllato il percorso, acquistato una borraccia capiente e preparato un piccolo kit di primo soccorso. Il proprietario del rifugio aveva raccomandato scarpe adatte e una giacca impermeabile anche in estate. «In montagna il tempo cambia in fretta», aveva scritto nel messaggio.\n\nIl primo giorno è stato tranquillo. Gli amici hanno attraversato un bosco e si sono fermati vicino a una cascata. Il secondo giorno, invece, un sentiero era chiuso per manutenzione. Luca voleva cercare un passaggio alternativo, ma Elena gli ha ricordato che il gruppo non conosceva bene la zona. Hanno consultato la mappa e chiesto informazioni a un volontario che lavorava lungo il percorso. Alla fine hanno scelto una salita meno impegnativa, ma con un panorama meraviglioso.\n\nIl terzo giorno uno degli amici si è sentito male per il caldo. Gli altri si sono fermati, hanno cercato ombra e gli hanno dato acqua. Hanno chiamato il rifugio per descrivere la situazione e hanno seguito il consiglio di tornare lentamente. Quella sera, seduti davanti alla finestra, hanno parlato delle decisioni prese durante la giornata. Tutti hanno riconosciuto che era stato meglio rinunciare alla vetta piuttosto che correre un rischio inutile.\n\nAlla fine della settimana non avevano completato tutti i percorsi previsti. Eppure erano soddisfatti. Avevano imparato a leggere i segnali dell'ambiente, a confrontare informazioni diverse e a rispettare il ritmo degli altri. Nel treno del ritorno, Luca ha scritto una breve lista per il prossimo viaggio. La prima voce non era «arrivare in cima», ma «tornare insieme e stare bene».","english":"Three friends booked a week at a mountain refuge. None was an experienced mountaineer, but they all loved walking. Before leaving, they checked the route, bought a large water bottle, and packed a small first-aid kit. The refuge owner had recommended proper shoes and a waterproof jacket, even in summer. “The weather changes quickly in the mountains,” he had written in his message.\n\nThe first day was peaceful. The friends crossed a forest and stopped near a waterfall. On the second day, however, a path was closed for maintenance. Luca wanted to find an alternative passage, but Elena reminded him that the group did not know the area well. They consulted the map and asked a volunteer working along the route for information. In the end they chose a less demanding climb, but one with a wonderful view.\n\nOn the third day one of the friends felt unwell because of the heat. The others stopped, found shade, and gave him water. They called the refuge to describe the situation and followed the advice to return slowly. That evening, sitting by the window, they talked about the decisions they had made that day. Everyone agreed that giving up the summit had been better than taking an unnecessary risk.\n\nBy the end of the week, they had not completed every planned trail. Yet they were satisfied. They had learned to read signs in the environment, compare different sources of information, and respect other people's pace. On the train home Luca wrote a short list for their next trip. The first item was not “reach the top,” but “come back together and stay well.”","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B3-L05","title":"La mostra che cambiò programma","italian":"Una piccola galleria preparava una mostra sulla storia del quartiere. Il gruppo aveva raccolto fotografie, registrato interviste e scelto diversi oggetti prestati dalle famiglie. La curatrice, Beatrice, pensava che il progetto fosse quasi pronto. Poi una signora anziana ha portato un album con immagini che nessuno aveva mai visto: ritraevano la strada prima della costruzione della metropolitana e mostravano una piazza completamente diversa.\n\nBeatrice ha capito che quelle fotografie cambiavano il significato della mostra. Ha chiamato i collaboratori e proposto di modificare l'ordine delle sale. Alcuni erano contrari, perché mancavano pochi giorni all'apertura. Altri pensavano che fosse un'occasione speciale. Durante la riunione hanno confrontato i vantaggi e gli svantaggi. La responsabile della comunicazione ha spiegato che cambiare il programma avrebbe richiesto nuovi testi e nuove etichette. Il tecnico ha verificato se c'era spazio per altri pannelli.\n\nDopo una breve discussione il gruppo ha deciso di inserire le fotografie in una sala centrale, togliendo due immagini meno importanti. Beatrice ha scritto nuove descrizioni, semplici e comprensibili anche per chi non conosceva la città. Il giorno dell'inaugurazione la signora che aveva portato l'album è arrivata con sua nipote. Ha guardato le fotografie appese e ha raccontato una storia divertente sul vecchio mercato, che una volta occupava tutta la piazza.\n\nI visitatori hanno cominciato a parlare tra loro e a condividere altri ricordi. Alla fine dell'evento Beatrice ha capito che una mostra non è soltanto una raccolta di oggetti ben ordinati. Può diventare una conversazione tra persone di generazioni diverse. Aveva dovuto cambiare il piano originale, ma proprio quel cambiamento aveva reso il progetto più interessante.","english":"A small gallery was preparing an exhibition about the neighborhood's history. The team had collected photographs, recorded interviews, and selected several objects lent by local families. The curator, Beatrice, thought the project was almost ready. Then an elderly woman brought in an album of pictures nobody had ever seen: they showed the street before the subway was built and revealed a completely different square.\n\nBeatrice realized that these photographs changed the meaning of the exhibition. She called her colleagues and suggested changing the order of the rooms. Some opposed the idea because opening day was only a few days away. Others thought it was a special opportunity. At the meeting they compared the advantages and disadvantages. The communications manager explained that changing the plan would require new texts and labels. The technician checked whether there was room for additional panels.\n\nAfter a short discussion the team decided to put the photographs in a central room, removing two less important pictures. Beatrice wrote new descriptions, simple enough even for visitors who did not know the city. On opening day the woman who had brought the album arrived with her granddaughter. She looked at the pictures on the wall and told a funny story about the old market, which had once occupied the entire square.\n\nThe visitors began talking to one another and sharing other memories. At the end of the event Beatrice realized that an exhibition is not simply a collection of neatly arranged objects. It can become a conversation among people from different generations. She had been forced to change her original plan, but that very change had made the project more interesting.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B3-R01","title":"Il permesso da ritirare","italian":"Marta è arrivata allo sportello dieci minuti prima dell'apertura. Aveva portato il passaporto, il modulo compilato e una copia del contratto. L'addetta ha controllato i documenti e le ha spiegato che mancava una firma. Marta è tornata in ufficio, ha firmato il foglio e ha ritirato il permesso nel pomeriggio.","english":"Marta arrived at the service counter ten minutes before opening. She had brought her passport, the completed form, and a copy of the contract. The clerk checked the documents and explained that a signature was missing. Marta went back to the office, signed the paper, and collected her permit that afternoon.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R02","title":"Un problema alla caldaia","italian":"La caldaia dell'appartamento non funzionava e l'acqua della doccia era fredda. Davide ha telefonato al proprietario, che gli ha consigliato di chiamare un tecnico. Il tecnico ha controllato la pressione e ha sostituito un piccolo componente. Dopo un'ora il riscaldamento funzionava di nuovo.","english":"The apartment's boiler was not working, and the shower water was cold. Davide called the landlord, who advised him to call a technician. The technician checked the pressure and replaced a small part. An hour later the heating was working again.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R03","title":"Una presentazione da correggere","italian":"Il gruppo doveva presentare un progetto alle nove. Durante l'ultima verifica, Luca si è accorto che due grafici contenevano dati vecchi. Ha avvisato i colleghi e ha aggiornato le tabelle. La presentazione è iniziata in orario e il responsabile ha apprezzato la chiarezza delle spiegazioni.","english":"The group had to present a project at nine. During the final check, Luca noticed that two charts contained old data. He informed his colleagues and updated the tables. The presentation started on time, and the manager appreciated the clarity of their explanations.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R04","title":"Il pacco senza destinatario","italian":"Un pacco era arrivato alla portineria senza un nome leggibile. Il custode ha controllato l'etichetta, ma l'indirizzo era incompleto. Ha chiamato il mittente e ha chiesto una conferma. Il giorno successivo la spedizione è stata consegnata alla persona giusta.","english":"A package had arrived at the building's reception without a readable name. The caretaker checked the label, but the address was incomplete. He called the sender and asked for confirmation. The following day the shipment was delivered to the right person.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R05","title":"La piscina chiusa","italian":"Sofia voleva andare in piscina dopo il lavoro. Quando è arrivata, ha trovato un avviso: la piscina era chiusa per manutenzione. Ha telefonato a un'amica e insieme hanno deciso di fare una passeggiata nel parco. Alla fine sono rimaste fuori più a lungo del previsto.","english":"Sofia wanted to go swimming after work. When she arrived, she found a notice: the pool was closed for maintenance. She called a friend, and together they decided to go for a walk in the park. In the end they stayed outside longer than expected.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R06","title":"Un incontro in biblioteca","italian":"Un'associazione organizzava un incontro sulle lingue straniere. Paolo ha raccontato come praticava la pronuncia ascoltando brevi registrazioni. Una partecipante ha suggerito di alternare ascolto e conversazione. Alla fine tutti hanno scritto un piccolo piano per studiare durante la settimana.","english":"An association organized a meeting about foreign languages. Paolo described how he practiced pronunciation by listening to short recordings. One participant suggested alternating listening with conversation. At the end everyone wrote a short study plan for the week.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R07","title":"Il giardino condominiale","italian":"Nel cortile del palazzo alcune piante erano secche. I residenti hanno organizzato un turno di manutenzione e hanno comprato una nuova borraccia per annaffiare i fiori. Una famiglia si è occupata del sentiero e un'altra delle panchine. Dopo un mese il giardino era molto più piacevole.","english":"Some plants in the apartment building's courtyard had dried out. The residents organized a maintenance schedule and bought a new watering can for the flowers. One family looked after the path and another the benches. After a month the garden was much more pleasant.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R08","title":"Il laboratorio dei dati","italian":"In laboratorio un computer non riusciva a leggere un file. La ricercatrice ha verificato il formato e ha scoperto che mancava un aggiornamento. Dopo aver installato il programma corretto, ha potuto aprire il database. Ha salvato una copia dei dati prima di continuare l'analisi.","english":"In the laboratory, a computer could not read a file. The researcher checked the format and discovered that an update was missing. After installing the correct software, she was able to open the database. She saved a copy of the data before continuing the analysis.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R09","title":"Una visita al museo","italian":"La classe ha visitato una mostra dedicata alla storia del quartiere. Una guida ha mostrato fotografie dell'antico mercato e ha raccontato come vivevano gli abitanti. Gli studenti hanno annotato le parole sconosciute e hanno chiesto informazioni sulla piazza principale. Alla fine hanno preparato un breve riassunto.","english":"The class visited an exhibition devoted to the neighborhood's history. A guide showed photographs of the old market and described how the residents had lived. The students wrote down unfamiliar words and asked about the main square. In the end they prepared a short summary.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R10","title":"Il modulo online","italian":"Chiara doveva compilare un modulo online per iscriversi a un corso. Il sito richiedeva una password e un documento di identità. La prima volta la pagina si è bloccata, ma Chiara aveva salvato una bozza. Ha ripreso la procedura e ha ricevuto la conferma per email.","english":"Chiara had to complete an online form to enroll in a course. The website required a password and an identity document. The first time the page froze, but Chiara had saved a draft. She resumed the process and received confirmation by email.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R11","title":"Una squadra nuova","italian":"Alessandro ha cominciato ad allenare una squadra di giovani. Alcuni ragazzi erano molto veloci, altri avevano poca esperienza. Ha deciso di dividere gli esercizi in gruppi e di cambiare le attività durante la settimana. Dopo un mese i giocatori collaboravano meglio e il punteggio delle partite era migliorato.","english":"Alessandro began coaching a team of young people. Some players were very fast, while others had little experience. He decided to divide the exercises into groups and vary the activities throughout the week. After a month the players worked together better, and the match scores had improved.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R12","title":"Una registrazione da inviare","italian":"Per preparare l'esame orale, Sara ha registrato una breve presentazione in italiano. L'ha ascoltata e ha notato che pronunciava male alcune parole. Ha ripetuto quelle frasi lentamente e ha mandato il file alla sua insegnante. La risposta è arrivata il giorno dopo con tre consigli precisi.","english":"To prepare for her oral exam, Sara recorded a short presentation in Italian. She listened to it and noticed that she pronounced some words badly. She repeated those sentences slowly and sent the file to her teacher. A reply arrived the next day with three specific suggestions.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R13","title":"Il preventivo troppo alto","italian":"Un piccolo negozio voleva riparare la vetrina. Il primo preventivo era troppo alto, perciò la proprietaria ha chiesto una seconda proposta. Ha confrontato i costi e verificato i tempi di consegna. Alla fine ha scelto un tecnico che poteva iniziare subito e offriva una garanzia chiara.","english":"A small shop wanted to repair its display window. The first quote was too high, so the owner requested another proposal. She compared the costs and checked the delivery times. In the end she chose a technician who could start immediately and offered a clear warranty.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R14","title":"Un programma radiofonico","italian":"Due amici stavano ascoltando un'intervista alla radio. L'ospite raccontava un progetto ambientale e spiegava come ridurre il consumo di energia. Uno degli amici ha annotato alcuni consigli sul telefono. Alla fine hanno deciso di controllare le proprie abitudini durante la settimana.","english":"Two friends were listening to a radio interview. The guest was discussing an environmental project and explaining how to reduce energy consumption. One friend noted down some tips on his phone. Afterwards, they decided to check their own habits during the week.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R15","title":"Un dibattito tranquillo","italian":"Durante un'assemblea, i residenti discutevano l'orario di apertura del cortile. Alcuni volevano chiudere presto per evitare il rumore; altri preferivano più libertà. Il moderatore ha chiesto di ascoltare ogni proposta. Dopo una breve pausa hanno trovato un compromesso accettabile per tutti.","english":"During a residents' meeting, people were discussing the courtyard's opening hours. Some wanted to close it early to avoid noise; others preferred more freedom. The moderator asked them to listen to each proposal. After a short break they found a compromise everyone could accept.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R16","title":"Una richiesta al municipio","italian":"L'associazione del quartiere ha scritto una richiesta al municipio per migliorare l'illuminazione della strada. Ha allegato fotografie e un breve elenco dei problemi. Dopo due settimane è arrivata una risposta: un tecnico avrebbe fatto una verifica. I volontari hanno organizzato un incontro per condividere la notizia.","english":"The neighborhood association wrote a request to the local council to improve street lighting. It attached photographs and a short list of problems. Two weeks later a reply arrived: a technician would carry out an inspection. The volunteers arranged a meeting to share the news.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R17","title":"La corsa di domenica","italian":"Elena si allenava per una gara di cinque chilometri. La settimana prima aveva avuto un piccolo dolore al ginocchio e aveva deciso di riposare. Domenica ha corso lentamente e si è fermata quando sentiva fastidio. Non ha raggiunto il tempo desiderato, ma è stata contenta di aver ascoltato il proprio corpo.","english":"Elena was training for a five-kilometer race. The week before she had felt a little pain in her knee and decided to rest. On Sunday she ran slowly and stopped whenever she felt discomfort. She did not achieve her target time, but was glad she had listened to her body.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R18","title":"La lezione registrata","italian":"Un insegnante aveva registrato la lezione per gli studenti assenti. Quando ha controllato il file, si è accorto che il microfono funzionava male. Ha deciso di registrare una breve spiegazione aggiuntiva e di pubblicare le slide. Gli studenti hanno ringraziato perché potevano seguire il contenuto senza perdere informazioni.","english":"A teacher had recorded a lesson for absent students. When he checked the file, he noticed that the microphone had not worked properly. He decided to record a short additional explanation and publish the slides. The students thanked him because they could follow the material without missing information.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R19","title":"La ricetta della nonna","italian":"Luca voleva preparare una ricetta di famiglia, ma non sapeva quale padella usare. Ha telefonato a sua nonna, che gli ha spiegato come tagliare le verdure e quando aggiungere l'olio. Dopo due tentativi il piatto è riuscito bene. Luca ha scritto le istruzioni per non dimenticarle.","english":"Luca wanted to make a family recipe, but did not know which pan to use. He called his grandmother, who explained how to cut the vegetables and when to add the oil. After two attempts the dish turned out well. Luca wrote down the instructions so he would not forget them.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B3-R20","title":"Un sentiero alternativo","italian":"Il gruppo di escursionisti ha trovato un sentiero chiuso dopo il temporale. Un cartello indicava una deviazione e consigliava di non passare vicino alla cascata. Hanno controllato la mappa e scelto un percorso più lungo ma sicuro. Sono arrivati al rifugio prima che facesse buio.","english":"The hiking group found a path closed after the thunderstorm. A sign indicated a detour and advised people not to pass near the waterfall. They checked the map and chose a longer but safer route. They reached the refuge before dark.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]}],"translation_exercises":[{"id":"B3-T01","title":"telefonare / mandare","prompt_english":"I'll call you after the meeting. I'll email you the confirmation.","model_italian":"Ti telefono dopo la riunione. Ti mando la conferma per email.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T02","title":"controllare / stampare","prompt_english":"I check the number before paying. I print the document for the office.","model_italian":"Controllo il numero prima di pagare. Stampo il documento per l'ufficio.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T03","title":"compilare / firmare","prompt_english":"I fill in the form carefully. I'll sign the contract tomorrow.","model_italian":"Compilo il modulo con attenzione. Firmo il contratto domani.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T04","title":"cancellare / caricare","prompt_english":"I cancel the reservation. I upload the file to the site.","model_italian":"Cancello la prenotazione. Carico il file sul sito.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T05","title":"scaricare / salvare","prompt_english":"I download the application to my phone. I save a copy of the document.","model_italian":"Scarico l'applicazione sul telefono. Salvo una copia del documento.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T06","title":"cliccare / programmare","prompt_english":"I click the green button. We schedule the visit for Friday.","model_italian":"Clicco sul pulsante verde. Programmiamo la visita per venerdì.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T07","title":"verificare / confermare","prompt_english":"I verify the data before sending it. I confirm the appointment.","model_italian":"Verifico i dati prima di inviarli. Confermo l'appuntamento.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T08","title":"indicare / selezionare","prompt_english":"I point out the shortest route. I select three options.","model_italian":"Indico la strada più breve. Seleziono tre opzioni.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T09","title":"registrare / pubblicare","prompt_english":"I record my voice to practice. They publish the result on Monday.","model_italian":"Registro la mia voce per esercitarmi. Pubblicano il risultato lunedì.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T10","title":"aggiornare / installare","prompt_english":"I update the calendar every evening. We install the program on the computer.","model_italian":"Aggiorno il calendario ogni sera. Installiamo il programma sul computer.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T11","title":"collegare / funzionare","prompt_english":"I connect the phone to the computer. The printer isn't working.","model_italian":"Collego il telefono al computer. La stampante non funziona.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T12","title":"riparare / sistemare","prompt_english":"We repair the broken lock. I tidy my desk before leaving.","model_italian":"Ripariamo la serratura rotta. Sistemo la scrivania prima di uscire.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T13","title":"pulire / costruire","prompt_english":"I clean the kitchen after dinner. They are building a new bridge.","model_italian":"Pulisco la cucina dopo cena. Costruiscono un ponte nuovo.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T14","title":"diminuire / spedire","prompt_english":"The noise decreases at night. I'll ship the package tomorrow morning.","model_italian":"Il rumore diminuisce di notte. Spedisco il pacco domattina.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T15","title":"preferire / suggerire","prompt_english":"I prefer the train to the plane. I suggest another solution.","model_italian":"Preferisco il treno all'aereo. Suggerisco un'altra soluzione.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T16","title":"chiarire / guarire","prompt_english":"Let's clear up the misunderstanding right away. I hope you get well soon.","model_italian":"Chiariamo il malinteso subito. Spero che tu guarisca presto.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T17","title":"evitare / osservare","prompt_english":"I avoid the morning traffic. I observe changes over time.","model_italian":"Evito il traffico del mattino. Osservo i cambiamenti nel tempo.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T18","title":"presentare / commentare","prompt_english":"I present the research findings. We discuss the movie after dinner.","model_italian":"Presento i risultati della ricerca. Commentiamo il film dopo cena.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T19","title":"raccontare / votare","prompt_english":"I tell the children a story. They vote on the proposal today.","model_italian":"Racconto una storia ai bambini. Votano la proposta oggi.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B3-T20","title":"giudicare / protestare","prompt_english":"I don't judge someone so quickly. The residents protest against the noise.","model_italian":"Non giudico una persona così in fretta. I residenti protestano contro il rumore.","task_type":"english_to_italian","hide_italian_until_submitted":true}],"dialogues":[{"id":1,"title":"Il permesso da ritirare","lines":[{"speaker":"A","italian":"Hai portato tutti i documenti per il permesso?","english":""},{"speaker":"B","italian":"Credo di sì, ma vorrei controllare ancora una volta.","english":""},{"speaker":"A","italian":"Ti manca la firma in fondo al modulo.","english":""},{"speaker":"B","italian":"Hai ragione. Posso firmare qui?","english":""},{"speaker":"A","italian":"Certamente, poi torna allo sportello numero tre.","english":""},{"speaker":"B","italian":"Grazie, adesso è tutto chiaro.","english":""},{"speaker":"A","italian":"Allora abbiamo un piano.","english":""},{"speaker":"B","italian":"Sì, teniamoci aggiornati.","english":""}],"english_summary":"A permit collection required an additional signature.","audio_mode":"browser_tts_it_female_preferred"},{"id":2,"title":"Un problema alla caldaia","lines":[{"speaker":"A","italian":"Scusa, hai notato che l'acqua è fredda?","english":""},{"speaker":"B","italian":"Sì, credo che la caldaia non funzioni.","english":""},{"speaker":"A","italian":"Chiamiamo subito il proprietario?","english":""},{"speaker":"B","italian":"L'ho già chiamato. Manderà un tecnico.","english":""},{"speaker":"A","italian":"Secondo te quanto ci vorrà?","english":""},{"speaker":"B","italian":"Spero poco, fuori fa davvero freddo.","english":""},{"speaker":"A","italian":"Mi sembra una buona soluzione.","english":""},{"speaker":"B","italian":"Sono d’accordo, proviamo.","english":""}],"english_summary":"A broken boiler was fixed by a technician.","audio_mode":"browser_tts_it_female_preferred"},{"id":3,"title":"Una presentazione da correggere","lines":[{"speaker":"A","italian":"Hai controllato i grafici della presentazione?","english":""},{"speaker":"B","italian":"Sì, ma ho trovato due valori vecchi.","english":""},{"speaker":"A","italian":"Possiamo aggiornarli prima delle nove?","english":""},{"speaker":"B","italian":"Certamente, ho già aperto il file corretto.","english":""},{"speaker":"A","italian":"Vuoi che controlli anche le tabelle?","english":""},{"speaker":"B","italian":"Sarebbe utile, grazie mille.","english":""},{"speaker":"A","italian":"Grazie per la spiegazione.","english":""},{"speaker":"B","italian":"Figurati, fammi sapere come va.","english":""}],"english_summary":"The team corrected outdated charts before a presentation.","audio_mode":"browser_tts_it_female_preferred"},{"id":4,"title":"Il pacco senza destinatario","lines":[{"speaker":"A","italian":"È arrivato un pacco, ma non so per chi sia.","english":""},{"speaker":"B","italian":"Possiamo controllare l'etichetta?","english":""},{"speaker":"A","italian":"L'indirizzo c'è, ma manca il nome.","english":""},{"speaker":"B","italian":"Allora telefoniamo al mittente.","english":""},{"speaker":"A","italian":"Va bene, intanto lo lasciamo qui?","english":""},{"speaker":"B","italian":"Sì, in portineria è al sicuro.","english":""},{"speaker":"A","italian":"Perfetto, facciamo così.","english":""},{"speaker":"B","italian":"D’accordo, a presto!","english":""}],"english_summary":"A package was missing a readable recipient name.","audio_mode":"browser_tts_it_female_preferred"},{"id":5,"title":"La piscina chiusa","lines":[{"speaker":"A","italian":"Perché la piscina è chiusa oggi?","english":""},{"speaker":"B","italian":"C'è un problema tecnico, fanno manutenzione.","english":""},{"speaker":"A","italian":"Vogliamo provare un'altra palestra?","english":""},{"speaker":"B","italian":"Preferirei camminare nel parco.","english":""},{"speaker":"A","italian":"Allora ci vediamo all'ingresso principale?","english":""},{"speaker":"B","italian":"Perfetto, arrivo tra dieci minuti.","english":""},{"speaker":"A","italian":"Allora abbiamo un piano.","english":""},{"speaker":"B","italian":"Sì, teniamoci aggiornati.","english":""}],"english_summary":"A closed swimming pool led to a walk instead.","audio_mode":"browser_tts_it_female_preferred"},{"id":6,"title":"Un incontro in biblioteca","lines":[{"speaker":"A","italian":"Come studi la pronuncia italiana?","english":""},{"speaker":"B","italian":"Ascolto una frase breve e poi la ripeto.","english":""},{"speaker":"A","italian":"Fai anche conversazione?","english":""},{"speaker":"B","italian":"Sì, una volta alla settimana con un'amica.","english":""},{"speaker":"A","italian":"Potremmo creare un gruppo di studio?","english":""},{"speaker":"B","italian":"Ottima idea, possiamo iniziare venerdì.","english":""},{"speaker":"A","italian":"Mi sembra una buona soluzione.","english":""},{"speaker":"B","italian":"Sono d’accordo, proviamo.","english":""}],"english_summary":"A language-learning group exchanged practical advice.","audio_mode":"browser_tts_it_female_preferred"},{"id":7,"title":"Il giardino condominiale","lines":[{"speaker":"A","italian":"Chi si occupa del giardino questa settimana?","english":""},{"speaker":"B","italian":"Credo sia il turno del terzo piano.","english":""},{"speaker":"A","italian":"Possiamo dare una mano nel pomeriggio?","english":""},{"speaker":"B","italian":"Sì, servono acqua e qualche attrezzo.","english":""},{"speaker":"A","italian":"Porto io una piccola pala.","english":""},{"speaker":"B","italian":"Perfetto, ci vediamo nel cortile.","english":""},{"speaker":"A","italian":"Grazie per la spiegazione.","english":""},{"speaker":"B","italian":"Figurati, fammi sapere come va.","english":""}],"english_summary":"Neighbors organized upkeep of their shared garden.","audio_mode":"browser_tts_it_female_preferred"},{"id":8,"title":"Il laboratorio dei dati","lines":[{"speaker":"A","italian":"Perché il file non si apre?","english":""},{"speaker":"B","italian":"Credo che il programma sia troppo vecchio.","english":""},{"speaker":"A","italian":"Possiamo aggiornarlo senza perdere i dati?","english":""},{"speaker":"B","italian":"Sì, ma prima salviamo una copia.","english":""},{"speaker":"A","italian":"Vuoi che controlli il formato del file?","english":""},{"speaker":"B","italian":"Grazie, così evitiamo altri errori.","english":""},{"speaker":"A","italian":"Perfetto, facciamo così.","english":""},{"speaker":"B","italian":"D’accordo, a presto!","english":""}],"english_summary":"A missing software update blocked a data file.","audio_mode":"browser_tts_it_female_preferred"},{"id":9,"title":"Una visita al museo","lines":[{"speaker":"A","italian":"Che cosa rappresenta questa fotografia?","english":""},{"speaker":"B","italian":"È il mercato di quasi cento anni fa.","english":""},{"speaker":"A","italian":"La piazza sembra molto diversa.","english":""},{"speaker":"B","italian":"Infatti allora non c'erano automobili.","english":""},{"speaker":"A","italian":"Possiamo fare qualche domanda alla guida?","english":""},{"speaker":"B","italian":"Certo, ha tempo fino alle undici.","english":""},{"speaker":"A","italian":"Allora abbiamo un piano.","english":""},{"speaker":"B","italian":"Sì, teniamoci aggiornati.","english":""}],"english_summary":"A class visited a local-history exhibition.","audio_mode":"browser_tts_it_female_preferred"},{"id":10,"title":"Il modulo online","lines":[{"speaker":"A","italian":"Hai completato l'iscrizione al corso?","english":""},{"speaker":"B","italian":"Non ancora, il sito si è bloccato.","english":""},{"speaker":"A","italian":"Hai perso tutte le informazioni?","english":""},{"speaker":"B","italian":"Per fortuna avevo salvato una bozza.","english":""},{"speaker":"A","italian":"Vuoi riprovare insieme?","english":""},{"speaker":"B","italian":"Sì, controlliamo anche l'indirizzo email.","english":""},{"speaker":"A","italian":"Mi sembra una buona soluzione.","english":""},{"speaker":"B","italian":"Sono d’accordo, proviamo.","english":""}],"english_summary":"A saved draft helped complete an online registration.","audio_mode":"browser_tts_it_female_preferred"},{"id":11,"title":"Una squadra nuova","lines":[{"speaker":"A","italian":"Come va con la squadra nuova?","english":""},{"speaker":"B","italian":"Bene, ma abbiamo livelli diversi.","english":""},{"speaker":"A","italian":"Hai pensato a esercizi separati?","english":""},{"speaker":"B","italian":"Sì, poi lavoriamo tutti insieme.","english":""},{"speaker":"A","italian":"Il gruppo sembra più tranquillo.","english":""},{"speaker":"B","italian":"Anche io noto un bel miglioramento.","english":""},{"speaker":"A","italian":"Grazie per la spiegazione.","english":""},{"speaker":"B","italian":"Figurati, fammi sapere come va.","english":""}],"english_summary":"A coach adjusted training to help a new team.","audio_mode":"browser_tts_it_female_preferred"},{"id":12,"title":"Una registrazione da inviare","lines":[{"speaker":"A","italian":"Hai ascoltato la mia registrazione?","english":""},{"speaker":"B","italian":"Sì, il contenuto è molto chiaro.","english":""},{"speaker":"A","italian":"Come posso migliorare la pronuncia?","english":""},{"speaker":"B","italian":"Prova a rallentare due frasi.","english":""},{"speaker":"A","italian":"Devo registrare tutto di nuovo?","english":""},{"speaker":"B","italian":"No, lavora soltanto sulle parti difficili.","english":""},{"speaker":"A","italian":"Perfetto, facciamo così.","english":""},{"speaker":"B","italian":"D’accordo, a presto!","english":""}],"english_summary":"A student sent a speaking recording for feedback.","audio_mode":"browser_tts_it_female_preferred"},{"id":13,"title":"Il preventivo troppo alto","lines":[{"speaker":"A","italian":"Hai ricevuto il preventivo?","english":""},{"speaker":"B","italian":"Sì, ma il prezzo mi sembra alto.","english":""},{"speaker":"A","italian":"Possiamo chiedere un'altra offerta?","english":""},{"speaker":"B","italian":"Certo, e controlliamo anche la garanzia.","english":""},{"speaker":"A","italian":"Che cosa conta di più per te?","english":""},{"speaker":"B","italian":"Il prezzo, ma anche il tempo della riparazione.","english":""},{"speaker":"A","italian":"Allora abbiamo un piano.","english":""},{"speaker":"B","italian":"Sì, teniamoci aggiornati.","english":""}],"english_summary":"A shop owner compared two repair estimates.","audio_mode":"browser_tts_it_female_preferred"},{"id":14,"title":"Un programma radiofonico","lines":[{"speaker":"A","italian":"Hai sentito il consiglio sul riscaldamento?","english":""},{"speaker":"B","italian":"Sì, suggeriscono di controllare la temperatura.","english":""},{"speaker":"A","italian":"Secondo te possiamo risparmiare energia?","english":""},{"speaker":"B","italian":"Probabilmente sì, senza grandi sacrifici.","english":""},{"speaker":"A","italian":"Facciamo una prova questa settimana?","english":""},{"speaker":"B","italian":"Va bene, poi confrontiamo i consumi.","english":""},{"speaker":"A","italian":"Mi sembra una buona soluzione.","english":""},{"speaker":"B","italian":"Sono d’accordo, proviamo.","english":""}],"english_summary":"Friends heard practical advice in a radio interview.","audio_mode":"browser_tts_it_female_preferred"},{"id":15,"title":"Un dibattito tranquillo","lines":[{"speaker":"A","italian":"Possiamo parlare dell'orario del cortile?","english":""},{"speaker":"B","italian":"Certo, per alcuni è troppo tardi.","english":""},{"speaker":"A","italian":"E per chi torna dal lavoro?","english":""},{"speaker":"B","italian":"Potremmo lasciare aperto fino alle nove.","english":""},{"speaker":"A","italian":"Ti sembra un buon compromesso?","english":""},{"speaker":"B","italian":"Sì, proviamo per un mese.","english":""},{"speaker":"A","italian":"Grazie per la spiegazione.","english":""},{"speaker":"B","italian":"Figurati, fammi sapere come va.","english":""}],"english_summary":"Residents reached a compromise about courtyard hours.","audio_mode":"browser_tts_it_female_preferred"},{"id":16,"title":"Una richiesta al municipio","lines":[{"speaker":"A","italian":"Avete ricevuto risposta dal municipio?","english":""},{"speaker":"B","italian":"Sì, manderanno un tecnico.","english":""},{"speaker":"A","italian":"Quando verrà a controllare la strada?","english":""},{"speaker":"B","italian":"La settimana prossima, non c'è ancora una data.","english":""},{"speaker":"A","italian":"Dobbiamo avvisare i residenti?","english":""},{"speaker":"B","italian":"Certo, preparo un messaggio per tutti.","english":""},{"speaker":"A","italian":"Perfetto, facciamo così.","english":""},{"speaker":"B","italian":"D’accordo, a presto!","english":""}],"english_summary":"A community group requested better street lighting.","audio_mode":"browser_tts_it_female_preferred"},{"id":17,"title":"La corsa di domenica","lines":[{"speaker":"A","italian":"Come è andata la gara di domenica?","english":""},{"speaker":"B","italian":"Bene, anche se sono stata più lenta.","english":""},{"speaker":"A","italian":"Il ginocchio ti ha dato problemi?","english":""},{"speaker":"B","italian":"Un po', quindi ho diminuito il ritmo.","english":""},{"speaker":"A","italian":"Sei comunque soddisfatta?","english":""},{"speaker":"B","italian":"Sì, l'importante era correre senza rischi.","english":""},{"speaker":"A","italian":"Allora abbiamo un piano.","english":""},{"speaker":"B","italian":"Sì, teniamoci aggiornati.","english":""}],"english_summary":"A runner prioritized safety over a race time.","audio_mode":"browser_tts_it_female_preferred"},{"id":18,"title":"La lezione registrata","lines":[{"speaker":"A","italian":"La registrazione della lezione si sente male.","english":""},{"speaker":"B","italian":"Hai ragione, il microfono aveva un problema.","english":""},{"speaker":"A","italian":"Possiamo recuperare la spiegazione?","english":""},{"speaker":"B","italian":"Pubblicherò un riassunto con le slide.","english":""},{"speaker":"A","italian":"Qu
