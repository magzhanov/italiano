function dueScore(type,x){let r=rRec(x.content_id),fail=r.attempts.filter(a=>!a.ok).length,pass=r.attempts.filter(a=>a.ok).length;return (fail*4)-(pass*.4)-(r.covered?1:0)}
function chooseQueue(type,id=null){
 // A card reveal only marks coverage. It never prevents typed retrieval practice.
 // Once everything in a block is active, start a fresh review instead of locking the user out.
 let pool=(id?[ALL[type].find(x=>x.content_id===id)]:(ui.allBlocks&&['vocabulary','idioms'].includes(type)?ALL[type].slice():current()[type].slice())).filter(Boolean);
 if(!pool.length){toast('No practice material is available.');return;}
 let pending=pool.filter(x=>!mastered(type,x));
 let review=!pending.length;
 let list=review?pool:pending;
 if(!id){
   if(!review)list.sort((a,b)=>{let d=dueScore(type,b)-dueScore(type,a);return d||a.id-b.id});
   // Normal sessions focus on two verbs or fifteen words/phrases; replay is always available.
   list=list.slice(0,type==='verbs'?2:15);
 }
 let queue=[];
 if(type==='verbs'){
   for(const o of list){
     for(const [k] of TENSES){
       for(let p=0;p<6;p++){
         if(review||!rRec(o.content_id).forms[k+':'+p])queue.push({id:o.content_id,t:k,p});
       }
     }
   }
   // Defensive fallback: if earlier progress says all forms passed, allow another full review.
   if(!queue.length){for(const o of list)for(const [k] of TENSES)for(let p=0;p<6;p++)queue.push({id:o.content_id,t:k,p});}
 }else{
   queue=list.map(x=>({id:x.content_id}));
 }
 if(!queue.length){toast('No questions found for this section.');return;}
 ui.studyType=type;ui.studyQueue=queue;ui.studyIndex=0;ui.studySubmitted=false;
 ui.studyFeedback=null;ui.studyResponse='';ui.studyContext=(type==='vocabulary'?((rRec(queue[0].id).attempts.length%2===0)?'recall':'context'):'recall');
 navigate('practice');
}
function expectedAnswers(str){
 let s=String(str||'').replace(/[\u2018\u2019]/g,"'").trim()
  .replace(/\s*\((?:m\.|f\.|m\.\/f\.|f\.\/m\.)\)\s*$/ig,'');
 // Word and adjective alternatives are independently valid: "l'amico / l'amica".
 if(/\s+\/\s+/.test(s))return s.split(/\s+\/\s+/).map(x=>x.trim());
 // Past participle agreement: "sono andato/a" -> "sono andato", "sono andata".
 if(/(?:o\/a|i\/e)$/.test(s)){
   let slash=s.lastIndexOf('/');return [s.slice(0,slash),s.slice(0,slash-1)+s.slice(slash+1)];
 }
 return [s];
}
function answerMatches(input,expected){let val=norm(input);return expectedAnswers(expected).some(x=>norm(x)===val)}
function answerHint(expected,type){
 const choices=expectedAnswers(expected);
 if(type==='vocabulary'){
   let msg='Enter the Italian dictionary form. Include the article for nouns; do not type gender notes such as (f.) or (m.).';
   if(choices.length>1)msg+=' Either form is accepted: '+choices.join(' OR ')+'. Type only one, without a slash.';
   return msg;
 }
 if(type==='verbs')return choices.length>1?'Masculine and feminine endings are alternatives. Type ONE complete conjugated form, not the slash.':'Include the auxiliary in passato prossimo where needed.';
 return 'Enter the complete Italian expression.';
}

async function ensurePrivateCache(){
 if(!('serviceWorker' in navigator)||!navigator.serviceWorker.controller)return;
 const registration=await navigator.serviceWorker.getRegistration();
 if(registration)await registration.update();
 // Wait for the new worker to activate before the first authenticated request.
 const response=await fetch('./sw.js',{cache:'no-store'});
 if(!response.ok||!(await response.text()).includes('italiano-private-sync-v3'))throw new Error('The sync update is still publishing. Reopen the app online in a moment.');
 if(registration?.installing||registration?.waiting)await new Promise((resolve,reject)=>{
   const timer=setTimeout(()=>reject(new Error('Reopen the app to finish its private-sync update.')),15000);
   navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timer);resolve()},{once:true});
 });
}
function startCloud(){
 if(!window.ItalianoCloudSync)return;
 cloud=ItalianoCloudSync.create({storage:localStorage,getState:()=>state,applyState:next=>{
   state={...blank(),...next,settings:state.settings};
   try{localStorage.setItem(SKEY,JSON.stringify(state));}catch(_){canStore=false;toast('Sync received progress, but device storage is full. Export a backup.');}
   const typing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);
   if(!typing&&['home','daily','sync'].includes(ui.page))render();
 },onStatus:cloudStatusUpdate});
 cloud.start();
 setInterval(()=>{if(!document.hidden)void cloud.sync();},60000);
 window.addEventListener('online',()=>{void cloud.sync();});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)void cloud.sync();});
 window.addEventListener('storage',e=>{if(e.key===SKEY&&e.newValue){try{const other=JSON.parse(e.newValue);state={...state,...ItalianoCloudSync.merge(state,other),settings:state.settings};cloud.schedule();if(['home','daily','sync'].includes(ui.page)&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))render();}catch(_){}}});
}
function sync(){let cols=[['vocabulary','Vocabulary'],['verbs','Verbs'],['idioms','Idioms']];let stats=cols.map(([t])=>percentTrack(t));return head('Your progress, everywhere','Progress & sync','Connect your devices for automatic sync, or use an exact backup to transfer progress manually.')+cloudPanel()+blockTabs()+'<div class="sync-layout"><div class="panel"><h3 class="panel-title">Quick sync · 3 numbers</h3><p class="small muted">Same course order on both devices. Type your coverage percentages from the other device.</p>'+cols.map(([t,label],i)=>'<label class="percentage"><span><strong>'+label+'</strong><br/><small class="muted">'+count(t).covered+' / '+count(t).all+' covered here</small></span><span class="pair"><input id="pc_'+t+'" type="number" value="'+stats[i]+'" min="0" max="100" step="1" aria-label="'+label+' completion percentage"/>%</span></label>').join('')+btn('Apply percentages','sync-quick','','primary w-100')+'<p class="notice">This marks the first N words, verbs, and idioms as <strong>covered</strong>. Grammar and reading coverage are estimated from those three numbers. Nothing is marked actively mastered without evidence of correct answers.</p></div><div class="panel"><h3 class="panel-title">Exact transfer</h3><p class="small muted">Use this method to transfer missed answers, review history, all 24 verb forms, written work, and mastery evidence.</p><div class="pair">'+btn(svg('download')+' Download progress file','sync-export','','primary')+btn(svg('upload')+' Import progress file','sync-pick','','secondary')+'</div><input id="fileImport" class="hidden" type="file" accept="application/json,.json"/><div class="separator"></div><div class="subhead">Copy-and-paste transfer code</div><p class="small muted">Useful for small progress records. Larger records are easier to transfer as a file.</p><div class="pair">'+btn('Generate & copy code','sync-code','','secondary')+btn('Paste code & import','sync-import-code','','secondary')+'</div><textarea id="syncCode" class="syncarea topspace" placeholder="Paste your ITALIANO3 transfer code here..." spellcheck="false"></textarea></div></div><div class="panel topspace"><h3 class="panel-title">Progress details</h3><div class="table-scroll"><table class="stats-table"><thead><tr><th>Block</th><th>Words</th><th>Verbs</th><th>Idioms</th><th>Grammar</th><th>Long readings</th></tr></thead><tbody>'+BLOCKS.map((b,i)=>{let bi=i+1,r=b.readings.filter(x=>x.is_featured_long),done=r.filter(x=>state.reading[x.id]?.completed||state.reading[x.id]?.estimated).length;return '<tr><td>Block '+bi+'</td>'+['vocabulary','verbs','idioms','grammar'].map(t=>{let c=count(t,bi);return '<td>'+c.covered+'/'+c.all+'<small>'+c.mastered+' mastered</small></td>'}).join('')+'<td>'+done+'/5</td></tr>'}).join('')+'</tbody></table></div><p class="notice">Saved locally on this device and browser. Connect each device above to combine progress automatically. Manual imports merge with cloud progress when connected. If you previously used an older Block 1 or 2 app on this device, choose the legacy import option below.</p>'+btn('Import old local Block 1 & 2 progress','legacy-import','','secondary')+'</div>';
}
function quickSync(){if(!confirm('Apply these three coverage percentages to the four blocks? Previously earned mastery remains based on actual test records.'))return;
 const pct={vocabulary:numerical(document.getElementById('pc_vocabulary').value),verbs:numerical(document.getElementById('pc_verbs').value),idioms:numerical(document.getElementById('pc_idioms').value)};
 for(let [kind,p] of Object.entries(pct)){let n=Math.round(ALL[kind].length*p/100);ALL[kind].forEach((x,i)=>{let r=rec(x.content_id);if(i<n){r.covered=true;if(!r.attempts.length)r.seeded=true}else if(r.seeded&&!r.attempts.length){r.covered=false;r.seeded=false}r.coverageUpdated=new Date().toISOString()})}
 const approx=Math.round((pct.vocabulary+pct.verbs+pct.idioms)/3);
 for(let [kind,list] of [['grammar',ALL.grammar],['readings',ALL.readings]]){let n=Math.round(list.length*approx/100);list.forEach((x,i)=>{if(kind==='grammar'){let r=rec(x.content_id);if(i<n){r.covered=true;r.seeded=true}else if(r.seeded&&!r.attempts.length){r.covered=false;r.seeded=false}}
 else{let r=state.reading[x.id]||{};if(i<n){r.estimated=true;state.reading[x.id]=r}else if(r.estimated&&!r.completed){delete r.estimated}}})}
 state.imports.push({date:new Date().toISOString(),mode:'quick',pct});save();toast('Quick sync applied. Mastery evidence preserved.');render();}
function download(name,data,mime){let blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function pack(){return JSON.stringify({format:'italiano-progress-v3',savedAt:new Date().toISOString(),state})}
function exactImport(obj){if(obj?.format!=='italiano-progress-v3'||obj.state?.schema!==3||!obj.state.records)throw new Error('Not an Italiano v3 backup');if(!confirm('Import this exact progress record? This replaces progress saved in this browser.'))return false;state={...blank(),...obj.state,settings:{...blank().settings,...obj.state.settings}};save();toast('Exact progress imported successfully.');render();return true}
const b64arr=bytes=>{let b='';for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(b)};
const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function codeEncode(str){let raw=new TextEncoder().encode(str);if(typeof CompressionStream!=='undefined'){let gzip=new CompressionStream('gzip');let stream=new Blob([raw]).stream().pipeThrough(gzip);let out=new Uint8Array(await new Response(stream).arrayBuffer());return 'ITALIANO3.G.'+b64arr(out)}return 'ITALIANO3.R.'+b64arr(raw)}
async function codeDecode(s){s=s.trim();if(!s.startsWith('ITALIANO3.'))throw new Error('Invalid code prefix');let type=s.split('.')[1],bytes=from64(s.split('.').slice(2).join('.'));if(type==='G'){if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot read compressed codes. Use the JSON file.');let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}return JSON.parse(new TextDecoder().decode(bytes))}
function oldImport(){let found=0;
 for(let bi=1;bi<=2;bi++){
  let old;try{old=JSON.parse(localStorage.getItem('italiano.block0'+bi+'.progress.v2')||'null')}catch(e){}
  if(!old?.words)continue;
  for(const [key,val] of Object.entries(old.words||{})){let num=Number(key.replace(/^w/,''));let o=BLOCKS[bi-1].vocabulary.find(x=>x.id===num);if(!o)continue;let r=rec(o.content_id);if(val.seen)r.covered=true;for(let a of (val.attempts||[])){let event={t:a.time,d:a.date,ok:!!a.ok,context:a.context||'old-recall',cell:'',answer:a.answer||'',type:'vocabulary'};r.attempts.push(event);r.covered=true;found++}}
  for(const [key,val] of Object.entries(old.verbForms||{})){let [id,k,p]=key.split('|');let obj=BLOCKS[bi-1].verbs.find(x=>x.id===Number(id));if(!obj)continue;let t=k==='past'?'past_compound_forms':k;let r=rec(obj.content_id);for(let a of val.attempts||[]){let evt={t:a.time,d:a.date,ok:!!a.ok,context:'form',cell:t+':'+p,answer:a.answer||'',type:'verbs'};r.attempts.push(evt);r.covered=true;if(a.ok)r.forms[t+':'+p]=true;found++}}
 }
 save();toast(found?`Imported ${found} historic attempts from older apps.`:'No old local records found in this browser.');render();}
function render(){let pg=ui.page;let content=pg==='home'?home():pg==='daily'?daily():pg==='vocabulary'?vocabulary():pg==='verbs'?verbs():pg==='idioms'?idioms():pg==='grammar'?grammar():pg==='reading'?readings():pg==='translation'?translations():pg==='dialogues'?dialogues():pg==='cards'?cards():pg==='practice'?practice():pg==='sync'?sync():home();wrap(content)}
// Interaction routing. Buttons remain accessible on both desktop and mobile.
document.addEventListener('click',async e=>{let el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 if(a==='nav'){stopAudio();navigate(el.dataset.page);return}
 if(a==='block'){stopAudio();changeBlock(Number(el.dataset.n));return}
 if(a==='all-blocks'){stopAudio();ui.allBlocks=true;ui.pageIndex=0;ui.search='';ui.filter='all';ui.flippedWords={};ui.cardShuffle=false;ui.cardOrder=[];ui.cardIndex=0;render();return}
 if(a==='word-flip'){let id=el.dataset.id;ui.flippedWords[id]=!ui.flippedWords[id];render();return}
 if(a==='speak'){say(unquote(el.dataset.t));return}
 if(a==='stop'){stopAudio();return}
 if(a==='cards'){ui.cardIndex=0;ui.cardFlipped=false;ui.cardShuffle=false;ui.cardOrder=[];navigate('cards');return}
 if(a==='flip-card'){ui.cardFlipped=!ui.cardFlipped;render();return}
 if(a==='card-direction'){ui.cardReverse=el.dataset.direction==='en-it';ui.cardFlipped=false;render();return}
 if(a==='card-shuffle'){shuffleCards();render();return}
 if(a==='card-order'){ui.cardShuffle=false;ui.cardOrder=[];ui.cardIndex=0;ui.cardFlipped=false;render();return}
 if(a==='card-next'||a==='card-prev'){let total=cardItems().length;ui.cardIndex=(ui.cardIndex+(a==='card-next'?1:-1)+total)%total;ui.cardFlipped=false;render();return}
 if(a==='practice'||a==='practice-one'){chooseQueue(el.dataset.type,el.dataset.id||null);return}
 if(a==='practice-next'){ui.studyIndex++;ui.studySubmitted=false;ui.studyFeedback=null;ui.studyResponse='';let q=currentPractice();if(q?.id&&ui.studyType==='vocabulary')ui.studyContext=(rRec(q.id).attempts.length%2)?'context':'recall';render();document.getElementById('practiceAnswer')?.focus();return}
 if(a==='prev-list'||a==='next-list'){ui.pageIndex=Math.max(0,ui.pageIndex+(a==='next-list'?1:-1));render();return}
 if(a==='verb-select'){ui.vSelect=Number(el.dataset.n);ui.verbRevealed={};render();return}
 if(a==='next-tense'){ui.verbTense=TENSES[(TENSES.findIndex(x=>x[0]===ui.verbTense)+1)%TENSES.length][0];render();return}
 if(a==='practice-tense'){chooseQueue('verbs',el.dataset.id);ui.studyQueue=ui.studyQueue.filter(x=>x.t===el.dataset.k);if(!ui.studyQueue.length)ui.studyQueue=PERSONS.map((_,p)=>({id:el.dataset.id,t:el.dataset.k,p}));ui.studyIndex=0;ui.studyFeedback=null;render();return}
 if(a==='reveal-tense'){ui.verbRevealed[el.dataset.k]=!ui.verbRevealed[el.dataset.k];render();return}
 if(a==='reveal-all'){for(const [k] of TENSES)ui.verbRevealed[k]=true;render();return}
 if(a==='hide-all'){ui.verbRevealed={};render();return}
 if(a==='grammar-cat'){ui.gramCategory=el.dataset.name;ui.gramIndex=0;ui.gramFeedback=null;render();return}
 if(a==='grammar-next'||a==='grammar-prev'){let list=current().grammar.filter(x=>ui.gramCategory==='all'||x.category===ui.gramCategory);ui.gramIndex=(ui.gramIndex+(a==='grammar-next'?1:-1)+list.length)%list.length;ui.gramFeedback=null;render();return}
 if(a==='reading-select'){ui.readId=el.dataset.id;ui.showEnglish=false;render();return}
 if(a==='reading-key'){ui.showEnglish=!ui.showEnglish;render();return}
 if(a==='read-all'){let x=current().readings.find(r=>r.id===ui.readId)||current().readings[0];playSequence(x.italian.split(/\n\n/));return}
 if(a==='reading-save'){let x=current().readings.find(r=>r.id===ui.readId)||current().readings[0];let txt=document.getElementById('readingText')?.value||'';state.reading[x.id]={versions:[...(state.reading[x.id]?.versions||[]),...(state.reading[x.id]?.response?[{response:state.reading[x.id].response,updated:state.reading[x.id].updated||''}]:[])],response:txt,completed:txt.trim().length>=20,updated:new Date().toISOString()};save();toast(txt.trim().length>=20?'Reading response saved.':'Write at least 20 characters to complete the reading.');render();return}
 if(a==='translation-save'){let q=current().translation_exercises[ui.transIndex];let x=document.getElementById('translationText')?.value||'';state.translation[q.id]={versions:[...(state.translation[q.id]?.versions||[]),...(state.translation[q.id]?.response?[{response:state.translation[q.id].response,updated:state.translation[q.id].updated||''}]:[])],response:x,completed:!!x.trim(),updated:new Date().toISOString()};ui.transFeedback=true;save();render();return}
 if(a==='translation-next'||a==='translation-prev'){ui.transIndex=(ui.transIndex+(a==='translation-next'?1:-1)+20)%20;ui.transFeedback=null;render();return}
 if(a==='dialogue-select'){ui.dialogueIndex=Number(el.dataset.n);ui.showGloss=false;stopAudio();render();return}
 if(a==='dialogue-gloss'){ui.showGloss=!ui.showGloss;render();return}
 if(a==='dialogue-all'){let d=current().dialogues[ui.dialogueIndex];playSequence(d.lines.map(x=>x.italian));return}
 if(a==='dialogue-done'){let d=current().dialogues[ui.dialogueIndex];state.dialogue['B'+ui.block+'-D'+d.id]={completed:true,updated:new Date().toISOString()};save();toast('Dialogue marked practiced.');return}
 if(a==='voice-test'){say('Buongiorno! Come stai oggi? Sto imparando l’italiano.');return}
 if(a==='cloud-now'){await cloud?.sync(true);return}
 if(a==='cloud-key'){
  const key=cloud?.getKey();if(!key){toast('This device is not connected.');return}
  const panel=document.getElementById('cloudKeyRecovery'),field=document.getElementById('cloudSavedKey');
  panel.hidden=false;field.value=key;
  try{await navigator.clipboard.writeText(key);toast('Sync key copied. Paste it into Sync on your other device.');}
  catch(_){field.type='text';field.focus();field.select();toast('Select and copy the sync key shown below.');}return
 }
 if(a==='cloud-show-key'){const field=document.getElementById('cloudSavedKey');field.type='text';field.focus();field.select();return}
 if(a==='cloud-hide-key'){const field=document.getElementById('cloudSavedKey');field.value='';field.type='password';document.getElementById('cloudKeyRecovery').hidden=true;return}
 if(a==='cloud-disconnect'){cloud?.disconnect();render();return}
 if(a==='sync-quick'){quickSync();return}
 if(a==='sync-export'){download('italiano-progress-'+today()+'.json',pack(),'application/json');toast('Progress file downloaded.');return}
 if(a==='sync-pick'){document.getElementById('fileImport')?.click();return}
 if(a==='sync-code'){try{let code=await codeEncode(pack());let t=document.getElementById('syncCode');t.value=code;t.select();try{await navigator.clipboard.writeText(code);toast('Exact code copied to clipboard.')}catch(x){document.execCommand('copy');toast('Code generated. Copy the selected text.')}}catch(ex){toast('Code export failed: '+ex.message)}return}
 if(a==='sync-import-code'){try{const obj=await codeDecode(document.getElementById('syncCode')?.value||'');exactImport(obj)}catch(ex){toast('Cannot import code: '+ex.message)}return}
 if(a==='legacy-import'){oldImport();return}
});
document.addEventListener('change',async e=>{if(e.target.id==='verbBatch'){ui.verbBatch=Number(e.target.value);ui.vSelect=ui.verbBatch*10-10;ui.verbRevealed={};render()}
 else if(e.target.id==='verbId'){ui.vSelect=current().verbs.findIndex(v=>v.content_id===e.target.value);ui.verbRevealed={};render()}
 else if(e.target.id==='verbTense'){ui.verbTense=e.target.value;render()}
 else if(e.target.id==='statusFilter'){ui.filter=e.target.value;ui.pageIndex=0;render()}
 else if(e.target.id==='voiceSelect'){state.settings.voice=e.target.value;save();toast('Voice selected: '+e.target.value)}
 else if(e.target.id==='speedSelect'){state.settings.rate=Number(e.target.value)||.91;save();toast('Speed updated')}
 else if(e.target.id==='fileImport'){let f=e.target.files?.[0];if(f)try{exactImport(JSON.parse(await f.text()))}catch(ex){toast('Invalid progress file: '+ex.message)} }
});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){ui.search=e.target.value;ui.pageIndex=0;let at=e.target.selectionStart;render();let i=document.getElementById('wordSearch');i?.focus();i?.setSelectionRange(at,at)} });
document.addEventListener('submit',e=>{
 if(e.target.id==='cloudConnectForm'){e.preventDefault();const input=document.getElementById('cloudKey'),key=input.value;input.value='';if(!cloud){toast('Sync could not load. Reopen the app online and try again.');return}ensurePrivateCache().then(()=>cloud.connect(key)).then(()=>render()).catch(error=>toast(error.message));return}
 if(e.target.id==='practiceForm'){e.preventDefault();if(ui.studyFeedback)return;let item=currentPractice(),type=ui.studyType,obj=ALL[type].find(x=>x.content_id===item.id),input=document.getElementById('practiceAnswer').value;let exp=type==='verbs'?verbForms(obj,item.t)[item.p]:obj.it;let ok=answerMatches(input,exp);let context=type==='verbs'?'form':type==='vocabulary'?ui.studyContext:(rRec(obj.content_id).attempts.length%2?'example':'recall');logAttempt(obj.content_id,type,ok,context,type==='verbs'?item.t+':'+item.p:'',input);ui.studyResponse=input;ui.studyFeedback={ok,input};render();return}
 if(e.target.id==='grammarForm'){e.preventDefault();let list=current().grammar.filter(x=>ui.gramCategory==='all'||x.category===ui.gramCategory),q=list[ui.gramIndex];let input=document.getElementById('grammarAnswer').value;let ok=answerMatches(input,q.answer);logAttempt(q.content_id,'grammar',ok,q.category,'',input);ui.gramFeedback={ok,input};render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopAudio()}if((e.key===' '||e.key==='Enter')&&e.target.classList.contains('flashcard')){e.preventDefault();e.target.click()}});
render();startCloud();
})();

</script>
