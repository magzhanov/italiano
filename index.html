ep an eye on the luggage while I pay."},{"id":2,"content_id":"B3-I02","it":"mettersi d’accordo","en":"to reach an agreement","example_it":"Mettiamoci d’accordo sull’orario.","example_en":"Let us agree on the time."},{"id":3,"content_id":"B3-I03","it":"venire in mente","en":"to come to mind","example_it":"Mi è venuta in mente un’idea.","example_en":"An idea came to mind."},{"id":4,"content_id":"B3-I04","it":"essere al corrente","en":"to be informed","example_it":"Sei al corrente del cambiamento?","example_en":"Are you aware of the change?"},{"id":5,"content_id":"B3-I05","it":"fare il punto","en":"to take stock","example_it":"Facciamo il punto dopo la riunione.","example_en":"Let us take stock after the meeting."},{"id":6,"content_id":"B3-I06","it":"per il momento","en":"for the moment","example_it":"Per il momento il piano non cambia.","example_en":"For the moment the plan does not change."},{"id":7,"content_id":"B3-I07","it":"a dire il vero","en":"to tell the truth","example_it":"A dire il vero, non sono convinto.","example_en":"To tell the truth, I am not convinced."},{"id":8,"content_id":"B3-I08","it":"senza dubbio","en":"without a doubt","example_it":"È senza dubbio una buona notizia.","example_en":"It is undoubtedly good news."},{"id":9,"content_id":"B3-I09","it":"di tanto in tanto","en":"from time to time","example_it":"Di tanto in tanto visito i miei nonni.","example_en":"From time to time I visit my grandparents."},{"id":10,"content_id":"B3-I10","it":"fare caso a","en":"to notice / pay attention to","example_it":"Hai fatto caso alla differenza?","example_en":"Did you notice the difference?"},{"id":11,"content_id":"B3-I11","it":"essere in gamba","en":"to be capable / smart","example_it":"La nuova collega è davvero in gamba.","example_en":"The new colleague is really capable."},{"id":12,"content_id":"B3-I12","it":"essere in forma","en":"to be in good shape","example_it":"Dopo le vacanze mi sento in forma.","example_en":"After the holidays I feel in good shape."},{"id":13,"content_id":"B3-I13","it":"essere fuori forma","en":"to be out of shape","example_it":"Quest'anno sono un po' fuori forma.","example_en":"I'm a bit out of shape this year."},{"id":14,"content_id":"B3-I14","it":"essere nei guai","en":"to be in trouble","example_it":"Senza il passaporto siamo nei guai.","example_en":"Without the passport we're in trouble."},{"id":15,"content_id":"B3-I15","it":"mettersi nei guai","en":"to get into trouble","example_it":"Non metterti nei guai per una sciocchezza.","example_en":"Don't get into trouble over something silly."},{"id":16,"content_id":"B3-I16","it":"fare una figuraccia","en":"to embarrass oneself","example_it":"Ho sbagliato nome e ho fatto una figuraccia.","example_en":"I got the name wrong and embarrassed myself."},{"id":17,"content_id":"B3-I17","it":"fare bella figura","en":"to make a good impression","example_it":"Vuole fare bella figura al colloquio.","example_en":"She wants to make a good impression at the interview."},{"id":18,"content_id":"B3-I18","it":"rompere il ghiaccio","en":"to break the ice","example_it":"Una battuta può rompere il ghiaccio.","example_en":"A joke can break the ice."},{"id":19,"content_id":"B3-I19","it":"tagliare corto","en":"to cut it short","example_it":"Era tardi, così ho tagliato corto.","example_en":"It was late, so I cut it short."},{"id":20,"content_id":"B3-I20","it":"andare al sodo","en":"to get to the point","example_it":"Abbiamo poco tempo: andiamo al sodo.","example_en":"We have little time: let's get to the point."},{"id":21,"content_id":"B3-I21","it":"prendere sul serio","en":"to take seriously","example_it":"Devi prendere sul serio questo avviso.","example_en":"You must take this warning seriously."},{"id":22,"content_id":"B3-I22","it":"prendere alla leggera","en":"to take lightly","example_it":"Non prendere alla leggera quell'errore.","example_en":"Don't take that mistake lightly."},{"id":23,"content_id":"B3-I23","it":"perdere la pazienza","en":"to lose patience","example_it":"Ho perso la pazienza dopo un'ora di attesa.","example_en":"I lost patience after an hour of waiting."},{"id":24,"content_id":"B3-I24","it":"portare pazienza","en":"to be patient","example_it":"Devi portare pazienza ancora un giorno.","example_en":"You need to be patient for one more day."},{"id":25,"content_id":"B3-I25","it":"dare per scontato","en":"to take for granted","example_it":"Non dare per scontato il suo aiuto.","example_en":"Don't take her help for granted."},{"id":26,"content_id":"B3-I26","it":"mettere in dubbio","en":"to call into question","example_it":"Il risultato mette in dubbio la teoria.","example_en":"The result calls the theory into question."},{"id":27,"content_id":"B3-I27","it":"avere a che fare con","en":"to have to do with","example_it":"Il problema ha a che fare con il contratto.","example_en":"The problem has to do with the contract."},{"id":28,"content_id":"B3-I28","it":"fare a meno di","en":"to do without","example_it":"Posso fare a meno della macchina.","example_en":"I can do without the car."},{"id":29,"content_id":"B3-I29","it":"non poter fare a meno di","en":"to be unable to do without","example_it":"Non posso fare a meno del caffè al mattino.","example_en":"I can't do without coffee in the morning."},{"id":30,"content_id":"B3-I30","it":"essere alle prese con","en":"to be struggling with / dealing with","example_it":"Sono alle prese con un nuovo progetto.","example_en":"I'm dealing with a new project."},{"id":31,"content_id":"B3-I31","it":"mettere alle strette","en":"to corner / put under pressure","example_it":"Le domande lo hanno messo alle strette.","example_en":"The questions put him on the spot."},{"id":32,"content_id":"B3-I32","it":"rendere conto di","en":"to account for / explain","example_it":"Dobbiamo rendere conto di ogni spesa.","example_en":"We must account for every expense."},{"id":33,"content_id":"B3-I33","it":"rendersi conto di","en":"to realize","example_it":"Mi rendo conto del mio errore.","example_en":"I realize my mistake."},{"id":34,"content_id":"B3-I34","it":"restare a bocca aperta","en":"to be left speechless","example_it":"Sono rimasta a bocca aperta dalla sorpresa.","example_en":"The surprise left me speechless."},{"id":35,"content_id":"B3-I35","it":"non stare nella pelle","en":"to be bursting with excitement","example_it":"Non sto nella pelle per il concerto.","example_en":"I can't wait for the concert."},{"id":36,"content_id":"B3-I36","it":"mettere il dito nella piaga","en":"to touch a sore spot","example_it":"Con quella domanda hai messo il dito nella piaga.","example_en":"That question touched a sore spot."},{"id":37,"content_id":"B3-I37","it":"fare il primo passo","en":"to make the first move","example_it":"Qualcuno deve fare il primo passo.","example_en":"Someone has to make the first move."},{"id":38,"content_id":"B3-I38","it":"venire incontro a","en":"to accommodate / meet halfway","example_it":"L'azienda ci è venuta incontro sul prezzo.","example_en":"The company met us halfway on the price."},{"id":39,"content_id":"B3-I39","it":"stare al gioco","en":"to play along","example_it":"All'inizio non voleva, poi è stato al gioco.","example_en":"At first he didn't want to, then he played along."},{"id":40,"content_id":"B3-I40","it":"cambiare idea","en":"to change one's mind","example_it":"Ho cambiato idea dopo aver letto il documento.","example_en":"I changed my mind after reading the document."},{"id":41,"content_id":"B3-I41","it":"tornare sui propri passi","en":"to retrace one's steps / reconsider","example_it":"Dopo la discussione è tornato sui suoi passi.","example_en":"After the discussion he reconsidered."},{"id":42,"content_id":"B3-I42","it":"mettere nero su bianco","en":"to put in writing","example_it":"Mettiamo nero su bianco i nostri accordi.","example_en":"Let's put our agreements in writing."},{"id":43,"content_id":"B3-I43","it":"andare a buon fine","en":"to succeed / turn out well","example_it":"Spero che la richiesta vada a buon fine.","example_en":"I hope the application succeeds."},{"id":44,"content_id":"B3-I44","it":"andare storto","en":"to go wrong","example_it":"Qualcosa è andato storto durante il viaggio.","example_en":"Something went wrong during the journey."},{"id":45,"content_id":"B3-I45","it":"lasciare perdere","en":"to drop it / let it go","example_it":"È troppo tardi, lascia perdere.","example_en":"It's too late, let it go."},{"id":46,"content_id":"B3-I46","it":"passare sopra a","en":"to overlook / forgive","example_it":"Posso passare sopra a un piccolo ritardo.","example_en":"I can overlook a small delay."},{"id":47,"content_id":"B3-I47","it":"mettersi in gioco","en":"to put oneself out there","example_it":"Per imparare devi metterti in gioco.","example_en":"To learn, you have to put yourself out there."},{"id":48,"content_id":"B3-I48","it":"fare del proprio meglio","en":"to do one's best","example_it":"Farò del mio meglio all'esame.","example_en":"I'll do my best in the exam."},{"id":49,"content_id":"B3-I49","it":"fare un passo indietro","en":"to take a step back","example_it":"È meglio fare un passo indietro e riflettere.","example_en":"It's better to step back and think."},{"id":50,"content_id":"B3-I50","it":"prendere una decisione","en":"to make a decision","example_it":"Dobbiamo prendere una decisione entro lunedì.","example_en":"We must make a decision by Monday."}],"grammar":[{"id":1,"content_id":"B3-G01","category":"Articles","prompt":"Parlo ___ responsabile.","answer":"con il","explanation":"Con il introduces a person.","english":"I'm speaking with the manager."},{"id":2,"content_id":"B3-G02","category":"Articles","prompt":"Vado ___ uffici comunali.","answer":"agli","explanation":"A + gli contracts to agli.","english":"I'm going to the municipal offices."},{"id":3,"content_id":"B3-G03","category":"Articles","prompt":"Ho bisogno ___ permesso.","answer":"di un","explanation":"Di un expresses needing a permit.","english":"I need a permit."},{"id":4,"content_id":"B3-G04","category":"Articles","prompt":"La sede ___ associazione è qui.","answer":"dell’","explanation":"Di + l’ contracts to dell’.","english":"The association's headquarters is here."},{"id":5,"content_id":"B3-G05","category":"Articles","prompt":"Lavoro ___ impresa locale.","answer":"per un’","explanation":"Per un’ before a feminine vowel-starting noun.","english":"I work for a local company."},{"id":6,"content_id":"B3-G06","category":"Prepositions","prompt":"Siamo interessati ___ progetto.","answer":"al","explanation":"A + il gives al.","english":"We're interested in the project."},{"id":7,"content_id":"B3-G07","category":"Prepositions","prompt":"Partecipo ___ riunione.","answer":"alla","explanation":"Partecipare a + la gives alla.","english":"I'm taking part in the meeting."},{"id":8,"content_id":"B3-G08","category":"Prepositions","prompt":"Mi occupo ___ documenti.","answer":"dei","explanation":"Occuparsi di + i gives dei.","english":"I handle the documents."},{"id":9,"content_id":"B3-G09","category":"Prepositions","prompt":"La risposta dipende ___ dati.","answer":"dai","explanation":"Dipendere da + i gives dai.","english":"The answer depends on the data."},{"id":10,"content_id":"B3-G10","category":"Prepositions","prompt":"Sto parlando ___ collega.","answer":"con un","explanation":"Con un introduces an indefinite colleague.","english":"I'm talking with a colleague."},{"id":11,"content_id":"B3-G11","category":"Question words","prompt":"___ di questi modelli preferisci?","answer":"Quale","explanation":"Quale asks which one.","english":"Which of these models do you prefer?"},{"id":12,"content_id":"B3-G12","category":"Question words","prompt":"___ tempo ti serve?","answer":"Quanto","explanation":"Quanto asks how much time.","english":"How much time do you need?"},{"id":13,"content_id":"B3-G13","category":"Question words","prompt":"___ motivo è stato indicato?","answer":"Quale","explanation":"Quale modifies a singular noun.","english":"Which reason was given?"},{"id":14,"content_id":"B3-G14","category":"Question words","prompt":"___ sono le conseguenze?","answer":"Quali","explanation":"Quali is plural.","english":"What are the consequences?"},{"id":15,"content_id":"B3-G15","category":"Question words","prompt":"___ hai mandato il documento?","answer":"A chi","explanation":"A chi asks to whom.","english":"To whom did you send the document?"},{"id":16,"content_id":"B3-G16","category":"Pronouns","prompt":"Parlo con Luca: ___ chiedo un favore.","answer":"gli","explanation":"Gli = to him.","english":"I'm speaking with Luca: I'm asking him a favor."},{"id":17,"content_id":"B3-G17","category":"Pronouns","prompt":"Parlo con Laura: ___ chiedo un favore.","answer":"le","explanation":"Le = to her.","english":"I'm speaking with Laura: I'm asking her a favor."},{"id":18,"content_id":"B3-G18","category":"Pronouns","prompt":"Hai la mail? Sì, ___ ho.","answer":"la","explanation":"La replaces la mail.","english":"Do you have the email? Yes, I have it."},{"id":19,"content_id":"B3-G19","category":"Pronouns","prompt":"Quanti documenti hai? ___ ho tre.","answer":"Ne","explanation":"Ne replaces a partitive expression.","english":"How many documents do you have? I have three."},{"id":20,"content_id":"B3-G20","category":"Pronouns","prompt":"Vai in città? Sì, ___ vado.","answer":"ci","explanation":"Ci replaces a location introduced by a/in.","english":"Are you going into town? Yes, I'm going there."},{"id":21,"content_id":"B3-G21","category":"Conjunctions","prompt":"___ i dati siano incompleti, procediamo.","answer":"Benché","explanation":"Benché introduces a concessive clause.","english":"Although the data are incomplete, we'll proceed."},{"id":22,"content_id":"B3-G22","category":"Conjunctions","prompt":"Ti scrivo ___ ho una risposta.","answer":"appena","explanation":"Appena means as soon as.","english":"I'll write to you as soon as I have an answer."},{"id":23,"content_id":"B3-G23","category":"Conjunctions","prompt":"Rivedo il modulo ___ sia corretto.","answer":"affinché","explanation":"Affinché expresses a purpose and takes the subjunctive.","english":"I'm reviewing the form so that it's correct."},{"id":24,"content_id":"B3-G24","category":"Conjunctions","prompt":"___ vuoi, possiamo rimandare.","answer":"Se","explanation":"Se introduces a condition.","english":"If you want, we can postpone it."},{"id":25,"content_id":"B3-G25","category":"Conjunctions","prompt":"Ha chiamato, ___ non ha lasciato un messaggio.","answer":"però","explanation":"Però contrasts clauses.","english":"He called, but he didn't leave a message."},{"id":26,"content_id":"B3-G26","category":"Negation and particles","prompt":"Non ho ___ ricevuto nulla.","answer":"ancora","explanation":"Non ... ancora means not yet.","english":"I still haven't received anything."},{"id":27,"content_id":"B3-G27","category":"Negation and particles","prompt":"Non ne so ___.","answer":"niente","explanation":"Niente means anything/nothing.","english":"I don't know anything about it."},{"id":28,"content_id":"B3-G28","category":"Negation and particles","prompt":"Non è ___ vero.","answer":"affatto","explanation":"Non ... affatto means not at all.","english":"It's not true at all."},{"id":29,"content_id":"B3-G29","category":"Negation and particles","prompt":"___ lui conosce il risultato.","answer":"Perfino","explanation":"Perfino means even.","english":"Even he knows the result."},{"id":30,"content_id":"B3-G30","category":"Negation and particles","prompt":"Siamo ___ pronti.","answer":"quasi","explanation":"Quasi means almost.","english":"We're almost ready."},{"id":31,"content_id":"B3-G31","category":"Agreement","prompt":"Le informazioni sono ___.","answer":"precise","explanation":"Precise agrees with feminine plural.","english":"The information is precise."},{"id":32,"content_id":"B3-G32","category":"Agreement","prompt":"Gli esercizi sono ___.","answer":"utili","explanation":"Utile has plural utili.","english":"The exercises are useful."},{"id":33,"content_id":"B3-G33","category":"Agreement","prompt":"I documenti sono ___.","answer":"aggiornati","explanation":"Updated, masculine plural.","english":"The documents are up to date."},{"id":34,"content_id":"B3-G34","category":"Agreement","prompt":"L’informazione è ___.","answer":"corretta","explanation":"Correct, feminine singular.","english":"The information is correct."},{"id":35,"content_id":"B3-G35","category":"Agreement","prompt":"Le spiegazioni sono ___.","answer":"chiare","explanation":"Clear, feminine plural.","english":"The explanations are clear."},{"id":36,"content_id":"B3-G36","category":"Clitics and common forms","prompt":"___ occupo del progetto.","answer":"Mi","explanation":"Mi occupo di = I am in charge of.","english":"I'm handling the project."},{"id":37,"content_id":"B3-G37","category":"Clitics and common forms","prompt":"Te ___ mando domani.","answer":"lo","explanation":"Te lo mando = I will send it to you.","english":"I'll send it to you tomorrow."},{"id":38,"content_id":"B3-G38","category":"Clitics and common forms","prompt":"___ ne sono accorto.","answer":"Me","explanation":"Me ne sono accorto = I noticed it.","english":"I realized it."},{"id":39,"content_id":"B3-G39","category":"Clitics and common forms","prompt":"___ hai parlato?","answer":"Ne","explanation":"Ne may replace di questo.","english":"Have you spoken about it?"},{"id":40,"content_id":"B3-G40","category":"Clitics and common forms","prompt":"___ penso spesso.","answer":"Ci","explanation":"Ci penso = I think about it.","english":"I think about it often."},{"id":41,"content_id":"B3-G41","category":"Articles","prompt":"Ho letto ___ articolo interessante.","answer":"un","explanation":"Un is masculine before a vowel.","english":"I read an interesting article."},{"id":42,"content_id":"B3-G42","category":"Articles","prompt":"___ decisione è importante.","answer":"La","explanation":"Feminine singular definite article.","english":"The decision is important."},{"id":43,"content_id":"B3-G43","category":"Articles","prompt":"Servono ___ informazioni precise.","answer":"delle","explanation":"Partitive article for feminine plural.","english":"We need some precise information."},{"id":44,"content_id":"B3-G44","category":"Articles","prompt":"Abbiamo incontrato ___ esperti.","answer":"degli","explanation":"Partitive masculine plural before a vowel.","english":"We met some experts."},{"id":45,"content_id":"B3-G45","category":"Articles","prompt":"___ studio è stato pubblicato.","answer":"Lo","explanation":"Lo before s + consonant.","english":"The study was published."},{"id":46,"content_id":"B3-G46","category":"Prepositions","prompt":"Il risultato dipende ___ metodo.","answer":"dal","explanation":"Da + il becomes dal.","english":"The result depends on the method."},{"id":47,"content_id":"B3-G47","category":"Prepositions","prompt":"Ho partecipato ___ riunione.","answer":"alla","explanation":"A + la becomes alla.","english":"I attended the meeting."},{"id":48,"content_id":"B3-G48","category":"Prepositions","prompt":"Ci concentriamo ___ problema.","answer":"sul","explanation":"Concentrarsi su + il = sul.","english":"We're focusing on the problem."},{"id":49,"content_id":"B3-G49","category":"Prepositions","prompt":"Il rapporto parla ___ imprese italiane.","answer":"delle","explanation":"Parlare di + le = delle.","english":"The report talks about Italian companies."},{"id":50,"content_id":"B3-G50","category":"Prepositions","prompt":"È un esempio ___ cambiamento rapido.","answer":"di","explanation":"Di introduces the type of example.","english":"It's an example of rapid change."},{"id":51,"content_id":"B3-G51","category":"Question words","prompt":"___ risultati sono stati confermati?","answer":"Quali","explanation":"Quali asks which, plural.","english":"Which results have been confirmed?"},{"id":52,"content_id":"B3-G52","category":"Question words","prompt":"___ dipende questa differenza?","answer":"Da che cosa","explanation":"Da che cosa asks what something depends on.","english":"What does this difference depend on?"},{"id":53,"content_id":"B3-G53","category":"Question words","prompt":"___ partecipanti sono presenti?","answer":"Quanti","explanation":"Masculine plural agreement.","english":"How many participants are present?"},{"id":54,"content_id":"B3-G54","category":"Question words","prompt":"___ hai scelto questo metodo?","answer":"Perché","explanation":"Perché asks for the reason.","english":"Why did you choose this method?"},{"id":55,"content_id":"B3-G55","category":"Question words","prompt":"___ possiamo migliorare il sistema?","answer":"Come","explanation":"Come asks how.","english":"How can we improve the system?"},{"id":56,"content_id":"B3-G56","category":"Pronouns","prompt":"La proposta? ___ considero valida.","answer":"La","explanation":"La refers to feminine singular proposta.","english":"The proposal? I consider it valid."},{"id":57,"content_id":"B3-G57","category":"Pronouns","prompt":"Ai colleghi ___ spiego il risultato.","answer":"gli","explanation":"Gli can refer to a plural indirect object in contemporary Italian.","english":"I explain the result to my colleagues."},{"id":58,"content_id":"B3-G58","category":"Pronouns","prompt":"A quella conclusione non ___ credo.","answer":"ci","explanation":"Ci replaces a quella conclusione.","english":"I don't believe in that conclusion."},{"id":59,"content_id":"B3-G59","category":"Pronouns","prompt":"Hai discusso del progetto? Sì, ___ abbiamo parlato.","answer":"ne","explanation":"Ne replaces di questo.","english":"Have you discussed the project? Yes, we've talked about it."},{"id":60,"content_id":"B3-G60","category":"Pronouns","prompt":"I documenti? ___ mando domani.","answer":"Li","explanation":"Li replaces masculine plural documents.","english":"The documents? I'll send them tomorrow."},{"id":61,"content_id":"B3-G61","category":"Conjunctions","prompt":"___ piove, il lavoro continua.","answer":"Anche se","explanation":"Anche se introduces concession.","english":"Even if it rains, work continues."},{"id":62,"content_id":" a","si è arrabbiato/a","ci siamo arrabbiati/e","vi siete arrabbiati/e","si sono arrabbiati/e"],"example_it":"Mi arrabbio quando nessuno ascolta.","example_en":"I get angry when no one listens.","conjugation_order":["io","tu","lui/lei","noi","voi","loro"],"mastery_granularity":"tense x person","reflexive":true},{"id":49,"content_id":"B4-V049","batch_id":5,"infinitive":"divertirsi","en":"to enjoy oneself","present":["mi diverto","ti diverti","si diverte","ci divertiamo","vi divertite","si divertono"],"imperfect":["mi divertivo","ti divertivi","si divertiva","ci divertivamo","vi divertivate","si divertivano"],"future":["mi divertirò","ti divertirai","si divertirà","ci divertiremo","vi divertirete","si divertiranno"],"participle":"divertito","aux":"essere","gerund":"divertendo","past_compound_forms":["mi sono divertito/a","ti sei divertito/a","si è divertito/a","ci siamo divertiti/e","vi siete divertiti/e","si sono divertiti/e"],"example_it":"Ci divertiamo molto insieme.","example_en":"We have a lot of fun together.","conjugation_order":["io","tu","lui/lei","noi","voi","loro"],"mastery_granularity":"tense x person","reflexive":true},{"id":50,"content_id":"B4-V050","batch_id":5,"infinitive":"affrettarsi","en":"to hurry","present":["mi affretto","ti affretti","si affretta","ci affrettiamo","vi affrettate","si affrettano"],"imperfect":["mi affrettavo","ti affrettavi","si affrettava","ci affrettavamo","vi affrettavate","si affrettavano"],"future":["mi affretterò","ti affretterai","si affretterà","ci affretteremo","vi affretterete","si affretteranno"],"participle":"affrettato","aux":"essere","gerund":"affrettando","past_compound_forms":["mi sono affrettato/a","ti sei affrettato/a","si è affrettato/a","ci siamo affrettati/e","vi siete affrettati/e","si sono affrettati/e"],"example_it":"Mi affretto per non perdere il treno.","example_en":"I hurry so I don't miss the train.","conjugation_order":["io","tu","lui/lei","noi","voi","loro"],"mastery_granularity":"tense x person","reflexive":true}],"readings":[{"id":"B4-L01","title":"Il negozio e i numeri","italian":"Francesca gestiva un piccolo negozio di quartiere. Negli ultimi mesi aveva notato che il numero dei clienti era rimasto quasi uguale, ma il guadagno era diminuito. Alcuni fornitori avevano aumentato i prezzi e i costi dell'energia erano più alti. Francesca poteva cambiare i prezzi dei prodotti, ma temeva di perdere i clienti abituali. Ha deciso quindi di analizzare i dati prima di prendere una decisione.\n\nHa raccolto le fatture, confrontato le vendite degli ultimi sei mesi e diviso le spese in categorie. È emerso che alcuni articoli avevano un margine molto basso, mentre altri erano acquistati spesso e costavano poco da conservare. Un amico che lavorava in contabilità le ha suggerito di controllare anche le scorte: a volte ordinava troppa merce e una parte rimaneva in magazzino per settimane. Francesca ha iniziato a ordinare quantità più piccole, ma più frequentemente.\n\nDopo un mese ha incontrato il fornitore principale per negoziare nuove condizioni di consegna. Non ha chiesto uno sconto su tutto: ha mostrato i dati e proposto un ordine regolare per i prodotti più richiesti. Il fornitore ha accettato di ridurre alcune commissioni in cambio di un programma di acquisti chiaro. Francesca ha inoltre modificato l'esposizione del negozio per rendere più visibili gli articoli convenienti.\n\nIl risultato non è stato immediato. Per qualche settimana il guadagno è rimasto basso, ma poi le spese hanno cominciato a diminuire. Francesca ha scoperto che i numeri non sostituivano l'esperienza: la aiutavano a capire meglio che cosa stava succedendo. Ha continuato a parlare con i clienti, perché dietro ogni vendita c'era una persona con bisogni reali. Per lei, una buona strategia doveva tenere insieme le due cose.","english":"Francesca ran a small neighborhood shop. Over the past few months, she had noticed that the number of customers had remained almost the same, but her profit had fallen. Some suppliers had raised prices, and energy costs were higher. Francesca could change her product prices, but feared losing her regular customers. She therefore decided to analyze the data before making a decision.\n\nShe collected invoices, compared sales from the previous six months, and divided expenses into categories. It emerged that some items had very low margins, while others were bought frequently and cost little to store. A friend who worked in accounting suggested checking inventory too: sometimes she ordered too much stock, and part of it sat in the warehouse for weeks. Francesca began ordering smaller quantities more often.\n\nA month later she met her main supplier to negotiate new delivery terms. She did not ask for a blanket discount: she presented the data and proposed regular orders for the most popular products. The supplier agreed to reduce certain charges in return for a clear purchasing schedule. Francesca also changed the shop display to make good-value items more visible.\n\nThe result was not immediate. For a few weeks profits stayed low, but then expenses began to fall. Francesca discovered that numbers did not replace experience: they helped her understand what was happening more clearly. She continued talking with customers, because behind every sale was a person with real needs. For her, a good strategy had to bring the two things together.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B4-L02","title":"Un viaggio interrotto","italian":"Karim doveva partire per una conferenza internazionale. Aveva preparato il passaporto, controllato il visto e acquistato un biglietto con uno scalo. All'aeroporto il primo volo è decollato con un piccolo ritardo, ma durante il viaggio un temporale ha costretto l'aereo a cambiare rotta. Quando Karim è arrivato all'aeroporto dello scalo, il secondo volo era già partito. Sullo schermo compariva soltanto la parola «cancellato» accanto ad alcune destinazioni.\n\nAll'inizio Karim si è preoccupato: avrebbe dovuto fare una presentazione la mattina successiva. Ha cercato il banco assistenza e ha chiesto quali alternative fossero disponibili. L'addetta ha spiegato che il primo volo utile partiva il giorno dopo. Karim ha domandato se esistesse un percorso in treno, ma il viaggio sarebbe stato troppo lungo. Ha quindi chiesto informazioni sull'albergo e sulle condizioni dell'assicurazione di viaggio.\n\nMentre aspettava la conferma, Karim ha telefonato agli organizzatori della conferenza. Ha spiegato la situazione e proposto di fare la presentazione in videoconferenza, se necessario. Gli organizzatori hanno risposto con calma: avrebbero modificato il programma e gli avrebbero dato il secondo turno della giornata. Karim ha passato la serata in un albergo vicino all'aeroporto, controllando il materiale sul computer e preparando una versione più breve del suo intervento.\n\nIl giorno dopo è arrivato in tempo per il suo nuovo orario. La conferenza è andata bene e, alla fine, alcuni colleghi gli hanno chiesto delle difficoltà del viaggio. Karim ha raccontato che l'imprevisto gli aveva insegnato qualcosa di utile: prepararsi non significa eliminare ogni rischio, ma sapere quali informazioni cercare e con chi comunicare quando il piano cambia.","english":"Karim was due to leave for an international conference. He had prepared his passport, checked his visa, and bought a ticket with a connecting flight. At the airport the first flight took off with a slight delay, but during the journey a thunderstorm forced the plane to change course. By the time Karim reached the transfer airport, his second flight had already departed. On the screen, some destinations showed only the word “cancelled.”\n\nAt first Karim was worried: he was supposed to give a presentation the following morning. He found the assistance desk and asked what alternatives were available. The employee explained that the next available flight left the following day. Karim asked whether there was a rail route, but the journey would take too long. So he requested information about a hotel and the terms of his travel insurance.\n\nWhile waiting for confirmation, Karim phoned the conference organizers. He explained the situation and offered to give his presentation by video call if necessary. The organizers answered calmly: they would adjust the program and give him the second slot of the day. Karim spent the evening in a hotel near the airport, reviewing his material on his computer and preparing a shorter version of his talk.\n\nThe next day he arrived in time for his rescheduled slot. The conference went well and, afterwards, several colleagues asked about his travel difficulties. Karim said the unexpected disruption had taught him something useful: being prepared does not mean eliminating every risk, but knowing which information to look for and whom to contact when the plan changes.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B4-L03","title":"Un dibattito in biblioteca","italian":"In una biblioteca pubblica si è tenuto un incontro sul futuro dei trasporti in città. Erano presenti residenti, studenti, commercianti e alcuni rappresentanti del comune. La proposta principale era trasformare una strada trafficata in una zona pedonale. Chi era favorevole parlava di aria più pulita e maggiore sicurezza; chi era contrario temeva problemi per le consegne e una riduzione dei clienti nei negozi.\n\nIl moderatore ha chiesto a tutti di esporre un argomento alla volta. Una studentessa ha mostrato un grafico sul traffico, mentre un commerciante ha raccontato la propria esperienza quotidiana. Un architetto ha presentato tre possibili progetti per la strada. Ha spiegato che non era necessario scegliere tra parcheggi e spazio pubblico in modo assoluto: alcune soluzioni prevedevano fasce orarie per il carico e scarico delle merci e percorsi sicuri per le biciclette.\n\nDurante le domande è emerso un problema importante. Molte persone anziane non potevano camminare a lungo e avevano bisogno di fermate vicine. Il gruppo ha deciso di chiedere uno studio sull'accessibilità prima di approvare qualsiasi progetto. Questo non ha risolto ogni conflitto, ma ha cambiato il tono della discussione. Invece di ripetere gli stessi slogan, i partecipanti hanno cominciato a confrontare criteri concreti: tempi di viaggio, sicurezza, costi e qualità dell'aria.\n\nAlla fine dell'incontro nessuno ha dichiarato di aver vinto. Il comune ha promesso un nuovo appuntamento per presentare dati più precisi e ascoltare altre persone. Una ragazza, uscendo dalla biblioteca, ha detto a suo padre che il dibattito era stato più interessante del previsto. «Non abbiamo una risposta definitiva», ha osservato, «ma almeno ora sappiamo quali domande dobbiamo fare».","english":"A public library hosted a meeting about the future of transportation in the city. Residents, students, shopkeepers, and several city council representatives attended. The main proposal was to turn a busy road into a pedestrian zone. Supporters spoke of cleaner air and greater safety; opponents feared difficulties with deliveries and fewer customers in local shops.\n\nThe moderator asked everyone to present one argument at a time. A student showed a traffic chart, while a shopkeeper described his daily experience. An architect presented three possible designs for the street. He explained that parking and public space did not have to be treated as an absolute either-or choice: some solutions included designated delivery hours and safe bicycle routes.\n\nDuring the questions, an important issue emerged. Many elderly people could not walk long distances and needed nearby transit stops. The group decided to request an accessibility study before approving any project. This did not resolve every disagreement, but it changed the tone of the discussion. Instead of repeating the same slogans, participants began comparing concrete criteria: travel times, safety, costs, and air quality.\n\nAt the end of the meeting nobody declared victory. The council promised another meeting to present more precise data and hear from other people. As she left the library, a young woman told her father that the debate had been more interesting than expected. “We don't have a definitive answer,” she observed, “but at least now we know which questions we should ask.”","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B4-L04","title":"Il progetto di ricerca","italian":"Due ricercatori stavano studiando come cambiano le abitudini di consumo quando i prezzi aumentano. Avevano raccolto dati da molte famiglie e costruito un modello semplice per descrivere le scelte. All'inizio i risultati sembravano chiari: le famiglie con redditi più bassi riducevano alcune spese prima delle altre. Ma una ricercatrice, Elena, ha notato che una parte dei dati proveniva da questionari incompleti.\n\nElena ha proposto di ripetere l'analisi usando soltanto il campione per il quale tutte le variabili erano disponibili. Il collega inizialmente era contrario, perché il campione sarebbe diventato più piccolo e le stime meno precise. Hanno deciso di confrontare entrambe le specificazioni e verificare se la conclusione principale cambiava. Dopo alcuni giorni il risultato era meno forte di quanto sembrasse, ma la direzione dell'effetto restava simile.\n\nI ricercatori hanno organizzato una riunione per discutere i limiti dello studio. Un professore ha chiesto se esistessero altre spiegazioni dei risultati. Elena ha risposto che i dati osservativi non permettevano di stabilire con certezza un rapporto causale. Hanno quindi deciso di descrivere con maggiore attenzione le ipotesi, mostrare diverse tabelle e presentare gli intervalli di incertezza. Il documento finale è diventato più lungo, ma anche più chiaro.\n\nQuando hanno inviato il lavoro, Elena non pensava di aver trovato una risposta definitiva. Era però soddisfatta del metodo utilizzato. Avevano controllato i dati, confrontato le alternative e scritto apertamente che cosa sapevano e che cosa restava incerto. Per lei, il valore della ricerca non dipendeva dall'avere sempre un risultato sorprendente, ma dal rendere possibile una discussione informata.","english":"Two researchers were studying how consumption habits change when prices rise. They had collected data from many households and built a simple model to describe their choices. At first the results seemed clear: lower-income households cut some expenses before others. But one researcher, Elena, noticed that part of the data came from incomplete questionnaires.\n\nElena suggested repeating the analysis using only the sample for which all variables were available. At first her colleague disagreed, because the sample would become smaller and the estimates less precise. They decided to compare both specifications and check whether the main conclusion changed. After a few days the result was weaker than it had first appeared, but the direction of the effect remained similar.\n\nThe researchers organized a meeting to discuss the study's limitations. A professor asked whether there might be other explanations for the results. Elena replied that observational data could not establish a causal relationship with certainty. So they decided to describe their assumptions more carefully, show several tables, and present uncertainty intervals. The final document became longer, but also clearer.\n\nWhen they submitted the paper, Elena did not think she had found a definitive answer. She was nevertheless satisfied with the method they had used. They had checked the data, compared alternatives, and openly stated what they knew and what remained uncertain. For her, the value of research did not depend on always obtaining a surprising result, but on making an informed discussion possible.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B4-L05","title":"Una discussione tra amici","italian":"Durante una cena tra amici, un commento scherzoso ha creato un malinteso. Marco pensava di fare una battuta innocente, ma Anna l'ha interpretata come una critica al suo lavoro. Lei ha smesso di parlare e, poco dopo, ha deciso di tornare a casa. Gli altri sono rimasti sorpresi. Marco ha detto che non aveva intenzione di offenderla, ma non capiva perché si fosse arrabbiata così tanto.\n\nIl giorno dopo Marco ha scritto ad Anna un messaggio molto lungo per spiegare le proprie intenzioni. Prima di inviarlo, però, lo ha riletto e si è accorto che parlava quasi soltanto di sé. Ha cancellato il testo e ha scritto una frase più semplice: «Mi dispiace che il mio commento ti abbia ferita. Vorrei capire meglio come ti sei sentita». Anna ha accettato di incontrarlo per un caffè, ma gli ha chiesto di non trasformare la conversazione in un'altra discussione.\n\nQuando si sono visti, Anna ha raccontato perché quell'argomento era delicato per lei. Marco l'ha ascoltata senza interromperla. Poi ha spiegato che cosa voleva dire con la battuta, ma ha riconosciuto che le intenzioni non cancellavano l'effetto delle parole. Non erano d'accordo su ogni dettaglio. Tuttavia hanno trovato un punto comune: entrambi volevano continuare l'amicizia e sentirsi rispettati.\n\nAlla fine non hanno promesso di non litigare mai più. Sarebbe stata una promessa poco realistica. Hanno deciso invece di chiedere chiarimenti quando una frase sembrava offensiva e di evitare commenti personali davanti agli altri. Tornando a casa, Marco ha pensato che chiedere scusa non significava perdere una discussione: significava prendere sul serio il legame con una persona.","english":"During a dinner with friends, a joking comment caused a misunderstanding. Marco thought he was making an innocent joke, but Anna took it as criticism of her work. She stopped talking and, shortly afterward, decided to go home. The others were surprised. Marco said he had not meant to offend her, but did not understand why she had become so upset.\n\nThe next day Marco wrote Anna a very long message to explain his intentions. Before sending it, however, he read it again and realized that he was talking almost entirely about himself. He deleted it and wrote a simpler sentence: “I'm sorry my comment hurt you. I'd like to understand better how you felt.” Anna agreed to meet him for coffee, but asked him not to turn the conversation into another argument.\n\nWhen they met, Anna explained why the subject was sensitive for her. Marco listened without interrupting. Then he explained what he had meant by the joke, but acknowledged that intentions did not erase the effect of words. They did not agree on every detail. Nevertheless, they found common ground: both wanted to preserve the friendship and feel respected.\n\nIn the end they did not promise never to argue again. That would have been an unrealistic promise. Instead, they decided to ask for clarification when a remark seemed offensive and to avoid personal comments in front of others. On his way home Marco thought that apologizing did not mean losing an argument: it meant taking a relationship seriously.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Qual è il problema o la decisione centrale del testo?","hint":"Give the problem in your own words."},{"q":"Quali alternative vengono considerate?","hint":"Find at least two possibilities."},{"q":"Come reagiscono i personaggi?","hint":"Explain what each person does."},{"q":"Che cosa cambia alla fine?","hint":"Summarize the outcome."},{"q":"Scrivi un riassunto di almeno cinque frasi.","hint":"Use the new vocabulary actively."}]},{"id":"B4-R01","title":"La tariffa del bonifico","italian":"Gianni voleva trasferire denaro a un conto estero. Prima di confermare il bonifico ha controllato la commissione e il tasso di cambio. Il costo totale era più alto di quanto immaginasse. Ha confrontato due servizi e ha scelto quello con condizioni più trasparenti.","english":"Gianni wanted to transfer money to an account abroad. Before confirming the bank transfer, he checked the fee and exchange rate. The total cost was higher than he had expected. He compared two services and chose the one with more transparent terms.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R02","title":"L'ultimo treno","italian":"A causa di un guasto, il treno serale è stato cancellato. I passeggeri cercavano informazioni al banco assistenza, ma l'avviso era poco chiaro. Una dipendente ha suggerito un autobus sostitutivo. Alcuni viaggiatori hanno scelto di aspettare; altri hanno prenotato un albergo.","english":"Because of a technical fault, the evening train was cancelled. Passengers sought information at the assistance desk, but the notice was unclear. An employee suggested a replacement bus. Some travelers chose to wait; others booked a hotel.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R03","title":"Una proposta di lavoro","italian":"Un'impresa ha ricevuto due proposte per un nuovo progetto. La prima costava meno ma richiedeva più tempo; la seconda era più cara ma offriva maggiore assistenza. Il responsabile ha presentato una tabella con i criteri principali. Dopo la riunione il gruppo ha chiesto ulteriori dettagli ai fornitori.","english":"A company received two bids for a new project. The first cost less but required more time; the second was more expensive but offered better support. The manager presented a table with the main criteria. After the meeting the team asked the suppliers for more details.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R04","title":"Il museo dopo il restauro","italian":"Il museo civico ha riaperto dopo una lunga ristrutturazione. La facciata era stata restaurata e nuove scale rendevano alcune sale più accessibili. Durante la visita, una guida ha mostrato fotografie dell'edificio prima dei lavori. I visitatori hanno apprezzato soprattutto la luce delle nuove sale.","english":"The civic museum reopened after a long renovation. The façade had been restored, and new stairs made some rooms more accessible. During the visit, a guide showed photos of the building before the work. Visitors particularly appreciated the light in the new rooms.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R05","title":"Una ricerca più precisa","italian":"Due studenti stavano analizzando un piccolo campione di dati. Avevano calcolato una media, ma non avevano controllato i valori mancanti. Il professore ha suggerito di verificare la procedura e confrontare i risultati. Dopo la correzione le conclusioni erano meno forti ma più affidabili.","english":"Two students were analyzing a small data sample. They had calculated an average but had not checked the missing values. The professor suggested checking the procedure and comparing the results. After the correction their conclusions were weaker, but more reliable.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R06","title":"Una consegna incompleta","italian":"Un ristorante aveva ordinato trenta confezioni di un ingrediente speciale. La consegna è arrivata in ritardo e mancavano cinque pacchi. Il cuoco ha telefonato al fornitore, che ha riconosciuto l'errore. Hanno concordato una seconda spedizione senza costi aggiuntivi.","english":"A restaurant had ordered thirty packages of a special ingredient. The delivery arrived late and five packages were missing. The chef called the supplier, who acknowledged the mistake. They agreed on a second shipment at no extra cost.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R07","title":"Il contratto d'affitto","italian":"Paola ha letto con attenzione il contratto del nuovo appartamento. Una clausola sulla cauzione non era chiara. Ha chiesto al proprietario di spiegare quando sarebbe stata restituita. Dopo una breve conversazione hanno corretto il testo e firmato due copie identiche.","english":"Paola carefully read the lease for her new apartment. A clause about the security deposit was unclear. She asked the landlord to explain when it would be returned. After a short conversation they corrected the wording and signed two identical copies.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R08","title":"La zona pedonale","italian":"Il comune proponeva una nuova zona pedonale vicino al centro storico. Alcuni commercianti temevano un calo delle vendite. I residenti chiedevano invece meno traffico e più spazio per camminare. Durante un incontro pubblico sono state presentate tre alternative e un piano di prova.","english":"The city council proposed a new pedestrian zone near the historic center. Some shopkeepers feared a decline in sales. Residents, on the other hand, wanted less traffic and more space for walking. Three alternatives and a trial plan were presented at a public meeting.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R09","title":"La mostra fotografica","italian":"Una fotografa ha preparato una mostra sul lavoro nelle città. Ha scelto immagini di mercati, uffici e laboratori. Durante l'inaugurazione un visitatore le ha chiesto perché alcune fotografie fossero in bianco e nero. Lei ha spiegato che voleva mettere in evidenza i gesti delle persone.","english":"A photographer prepared an exhibition about work in cities. She chose images of markets, offices, and workshops. At the opening, a visitor asked her why some photos were in black and white. She explained that she wanted to highlight people's gestures.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R10","title":"Un malinteso via messaggio","italian":"Due amici hanno litigato dopo uno scambio di messaggi. Una frase breve era sembrata offensiva, ma il tono non era chiaro. Il giorno dopo si sono incontrati e hanno spiegato le rispettive intenzioni. Hanno deciso che, in caso di dubbio, avrebbero preferito una telefonata.","english":"Two friends argued after exchanging messages. A short sentence had seemed offensive, but the tone was unclear. The next day they met and explained what each had meant. They decided that when in doubt they would prefer a phone call.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R11","title":"Un viaggio in bici","italian":"Una coppia ha programmato un'escursione in bicicletta lungo il fiume. Prima di partire ha controllato le gomme e il percorso. A metà strada ha trovato una pista ciclabile chiusa. I due hanno seguito una deviazione e scoperto un piccolo parco che non conoscevano.","english":"A couple planned a bicycle trip along the river. Before leaving they checked the tires and the route. Halfway through they found a cycle path closed. They followed a detour and discovered a small park they had not known about.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R12","title":"Il colloquio con il giornalista","italian":"Una ricercatrice è stata intervistata da un giornalista sui risultati di uno studio. Prima della pubblicazione ha chiesto di controllare le citazioni tecniche. Il giornalista ha accettato di verificare i numeri, ma ha spiegato che l'articolo doveva restare comprensibile ai lettori. Hanno trovato una formulazione precisa e semplice.","english":"A researcher was interviewed by a journalist about a study's results. Before publication she asked to check the technical quotations. The journalist agreed to verify the numbers, but explained that the article needed to remain understandable to readers. They found wording that was both precise and simple.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R13","title":"La bolletta inattesa","italian":"Una famiglia ha ricevuto una bolletta molto più alta del solito. Ha controllato il contatore e confrontato i consumi con quelli del mese precedente. Ha scoperto che il riscaldamento era rimasto acceso durante un viaggio. Ha modificato le impostazioni e deciso di controllare i consumi ogni settimana.","english":"A family received an electricity bill much higher than usual. They checked the meter and compared consumption with the previous month. They discovered that the heating had stayed on during a trip. They changed the settings and decided to check consumption every week.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R14","title":"Un investimento difficile","italian":"Luca aveva letto un articolo su un nuovo investimento, ma non capiva bene i rischi. Ha confrontato il rendimento promesso con le spese e con le possibili perdite. Dopo aver consultato più fonti, ha deciso di non investire subito. Preferiva capire meglio il prodotto prima di prendere una decisione.","english":"Luca had read an article about a new investment but did not fully understand the risks. He compared the promised return with the fees and potential losses. After consulting several sources, he decided not to invest immediately. He preferred to understand the product better before making a decision.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R15","title":"La conferenza di quartiere","italian":"Un'associazione ha organizzato un dibattito pubblico su un nuovo edificio. Il progetto prevedeva uffici, negozi e uno spazio verde. Alcuni residenti erano preoccupati per l'aumento del traffico. Il comune ha promesso di pubblicare una valutazione e raccogliere altre osservazioni.","english":"An association organized a public debate about a new building. The project included offices, shops, and a green space. Some residents were worried about increased traffic. The city council promised to publish an assessment and gather further comments.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R16","title":"Un festival di musica","italian":"Un piccolo festival ha invitato musicisti da diverse città. Il palco era stato montato in piazza, ma la pioggia ha costretto gli organizzatori a cambiare programma. Hanno spostato i concerti nel teatro vicino. Il pubblico ha aspettato con pazienza e il coro finale è stato un grande successo.","english":"A small festival invited musicians from several cities. The stage had been set up in the square, but rain forced the organizers to change the schedule. They moved the concerts to the nearby theater. The audience waited patiently, and the final chorus was a great success.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R17","title":"Una testimonianza importante","italian":"Durante un incontro pubblico, una donna ha raccontato un episodio che aveva osservato nel quartiere. Il suo intervento ha aiutato gli organizzatori a capire un problema di sicurezza. Hanno deciso di raccogliere altre informazioni prima di formulare proposte. Nessuno voleva trarre conclusioni da un solo caso.","english":"During a public meeting, a woman described an incident she had witnessed in the neighborhood. Her contribution helped the organizers understand a safety problem. They decided to collect more information before putting forward proposals. Nobody wanted to draw conclusions from just one case.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R18","title":"La candidatura internazionale","italian":"Elena voleva candidarsi a un programma all'estero. Ha preparato il curriculum, controllato il visto e richiesto alcune lettere. Il modulo chiedeva di descrivere un progetto personale in italiano. Elena ha scritto una prima bozza e l'ha fatta leggere a una collega. Poi ha corretto il testo e inviato tutto prima della scadenza.","english":"Elena wanted to apply for a program abroad. She prepared her CV, checked the visa requirements, and requested several letters. The form asked her to describe a personal project in Italian. Elena wrote a first draft and asked a colleague to read it. Then she corrected the text and submitted everything before the deadline.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R19","title":"Un piano di emergenza","italian":"Un piccolo albergo ha aggiornato il proprio piano di emergenza. Il responsabile ha controllato le uscite e verificato la posizione degli estintori. Durante una simulazione, alcuni ospiti non avevano capito le istruzioni. L'albergo ha quindi preparato avvisi più semplici in diverse lingue.","english":"A small hotel updated its emergency plan. The manager checked the exits and verified the locations of the fire extinguishers. During a drill, some guests had not understood the instructions. The hotel therefore prepared simpler notices in several languages.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]},{"id":"B4-R20","title":"Il grafico incompleto","italian":"Durante una presentazione, un analista ha mostrato un grafico senza indicare l'unità di misura. Una collega se n'è accorta e gli ha chiesto di chiarire l'asse verticale. L'analista ha corretto la slide e ha spiegato come interpretare i dati. Il pubblico ha potuto seguire meglio il risultato.","english":"During a presentation, an analyst showed a chart without specifying the unit of measurement. A colleague noticed and asked him to clarify the vertical axis. The analyst corrected the slide and explained how to interpret the data. The audience could follow the result more easily.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":false,"comprehension":[{"q":"Che cosa succede nel testo?","hint":"Describe the main event in your own words."},{"q":"Quale soluzione viene scelta?","hint":"Explain the outcome."}]}],"translation_exercises":[{"id":"B4-T01","title":"disegnare / adattare","prompt_english":"I draw a map for the trip. We adapt the plan to the situation.","model_italian":"Disegno una mappa per il viaggio. Adattiamo il piano alla situazione.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T02","title":"modificare / aumentare","prompt_english":"I change the last sentence. The cost increases every year.","model_italian":"Modifico l'ultima frase. Il costo aumenta ogni anno.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T03","title":"trasportare / completare","prompt_english":"They transport the goods by train. I finish the assignment before dinner.","model_italian":"Trasportano la merce in treno. Completo il compito prima di cena.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T04","title":"pianificare / consultare","prompt_english":"We plan the next trip. I consult the calendar before deciding.","model_italian":"Pianifichiamo il prossimo viaggio. Consulto il calendario prima di decidere.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T05","title":"rinunciare / esaminare","prompt_english":"I won't give up on my project. We examine all the documents.","model_italian":"Non rinuncio al mio progetto. Esaminiamo tutti i documenti.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T06","title":"valutare / calcolare","prompt_english":"I evaluate the risks before investing. I calculate the final price.","model_italian":"Valuto i rischi prima di investire. Calcolo il prezzo finale.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T07","title":"misurare / stimare","prompt_english":"We measure the temperature every hour. I estimate the repair cost.","model_italian":"Misuriamo la temperatura ogni ora. Stimo il costo della riparazione.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T08","title":"analizzare / dimostrare","prompt_english":"I analyze the data carefully. We demonstrate the result with an example.","model_italian":"Analizzo i dati con attenzione. Dimostriamo il risultato con un esempio.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T09","title":"ricercare / investire","prompt_english":"I research new sources for the article. I invest a small amount every month.","model_italian":"Ricerco nuove fonti per l'articolo. Investo una piccola somma ogni mese.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T10","title":"finanziare / depositare","prompt_english":"The bank finances the project. I deposit money into the account.","model_italian":"La banca finanzia il progetto. Deposito i soldi sul conto.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T11","title":"ritirare / trasferire","prompt_english":"I collect the parcel tomorrow. I transfer the money on Friday.","model_italian":"Ritiro il pacco domani. Trasferisco il denaro venerdì.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T12","title":"negoziare / approvare","prompt_english":"We negotiate the contract terms. The council approves the proposal.","model_italian":"Negoziamo le condizioni del contratto. Il consiglio approva la proposta.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T13","title":"licenziare / fatturare","prompt_english":"The company dismisses several employees. We invoice for the service at the end of the month.","model_italian":"L'azienda licenzia alcuni dipendenti. Fatturiamo il servizio alla fine del mese.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T14","title":"assicurare / tutelare","prompt_english":"We insure the car against damage. The law protects consumers.","model_italian":"Assicuriamo la macchina contro i danni. La legge tutela i consumatori.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T15","title":"esplorare / viaggiare","prompt_english":"We explore a new part of the city. I often travel for work.","model_italian":"Esploriamo una parte nuova della città. Viaggio spesso per lavoro.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B4-T16","title":"pilotare / parcheggiare","prompt_english":"The captain pilots the aircraft. I park near the park.","mo terest now: let's strike while the iron is hot."},{"id":47,"content_id":"B4-I47","it":"lasciare il segno","en":"to leave a mark","example_it":"Quel discorso ha lasciato il segno.","example_en":"That speech left a mark."},{"id":48,"content_id":"B4-I48","it":"fare la differenza","en":"to make a difference","example_it":"Un piccolo cambiamento può fare la differenza.","example_en":"A small change can make a difference."},{"id":49,"content_id":"B4-I49","it":"mettere in guardia","en":"to warn / caution","example_it":"Il medico lo ha messo in guardia sui rischi.","example_en":"The doctor warned him about the risks."},{"id":50,"content_id":"B4-I50","it":"non essere da meno","en":"to be no less capable / impressive","example_it":"La seconda proposta non è da meno.","example_en":"The second proposal is no less impressive."}],"grammar":[{"id":1,"content_id":"B4-G01","category":"Articles","prompt":"Esaminiamo ___ ipotesi.","answer":"un’","explanation":"Feminine noun beginning with a vowel: un’.","english":"We're examining a hypothesis."},{"id":2,"content_id":"B4-G02","category":"Articles","prompt":"Il risultato ___ analisi è positivo.","answer":"dell’","explanation":"Di + l’ contracts to dell’.","english":"The result of the analysis is positive."},{"id":3,"content_id":"B4-G03","category":"Articles","prompt":"La relazione ___ investitori è pronta.","answer":"con gli","explanation":"Con gli introduces the investors.","english":"The relationship with investors is ready."},{"id":4,"content_id":"B4-G04","category":"Articles","prompt":"Lavoro ___ settore finanziario.","answer":"nel","explanation":"In + il gives nel.","english":"I work in the financial sector."},{"id":5,"content_id":"B4-G05","category":"Articles","prompt":"I documenti ___ aziende sono qui.","answer":"delle","explanation":"Di + le contracts to delle.","english":"The companies' documents are here."},{"id":6,"content_id":"B4-G06","category":"Prepositions","prompt":"La decisione dipende ___ rischio.","answer":"dal","explanation":"Dipendere da + il = dal.","english":"The decision depends on the risk."},{"id":7,"content_id":"B4-G07","category":"Prepositions","prompt":"Investiamo ___ ricerca.","answer":"nella","explanation":"In + la = nella.","english":"We invest in research."},{"id":8,"content_id":"B4-G08","category":"Prepositions","prompt":"Ci basiamo ___ risultati.","answer":"sui","explanation":"Basarsi su + i = sui.","english":"We base our work on the results."},{"id":9,"content_id":"B4-G09","category":"Prepositions","prompt":"Discutiamo ___ nuove proposte.","answer":"delle","explanation":"Discutere di + le = delle.","english":"We're discussing new proposals."},{"id":10,"content_id":"B4-G10","category":"Prepositions","prompt":"Il prezzo varia ___ stagione.","answer":"con la","explanation":"Con la stagione marks variation with the season.","english":"The price changes with the season."},{"id":11,"content_id":"B4-G11","category":"Question words","prompt":"___ condizioni possiamo accettare?","answer":"A quali","explanation":"A quali asks under what conditions.","english":"Under which conditions can we accept?"},{"id":12,"content_id":"B4-G12","category":"Question words","prompt":"___ dipende la decisione?","answer":"Da che cosa","explanation":"Da che cosa asks what something depends on.","english":"What does the decision depend on?"},{"id":13,"content_id":"B4-G13","category":"Question words","prompt":"___ persone hanno partecipato?","answer":"Quante","explanation":"Quante agrees with feminine plural.","english":"How many people participated?"},{"id":14,"content_id":"B4-G14","category":"Question words","prompt":"___ obiettivo viene prima?","answer":"Quale","explanation":"Quale asks which objective.","english":"Which objective comes first?"},{"id":15,"content_id":"B4-G15","category":"Question words","prompt":"___ si riferisce il documento?","answer":"A chi","explanation":"A chi asks to whom it refers.","english":"To whom does the document refer?"},{"id":16,"content_id":"B4-G16","category":"Pronouns","prompt":"Il documento? Te ___ invio domani.","answer":"lo","explanation":"Lo refers to il documento.","english":"The document? I'll send it to you tomorrow."},{"id":17,"content_id":"B4-G17","category":"Pronouns","prompt":"Non ___ sono accorto.","answer":"me ne","explanation":"Accorgersi di something uses me ne.","english":"I didn't notice it."},{"id":18,"content_id":"B4-G18","category":"Pronouns","prompt":"Parlerai con loro? Sì, ___ parlerò.","answer":"ci","explanation":"Ci may replace con loro in spoken contexts.","english":"Will you talk to them? Yes, I'll talk to them."},{"id":19,"content_id":"B4-G19","category":"Pronouns","prompt":"Hai letto gli articoli? Sì, ___ ho letti.","answer":"li","explanation":"Li is masculine plural direct object.","english":"Have you read the articles? Yes, I've read them."},{"id":20,"content_id":"B4-G20","category":"Pronouns","prompt":"Hai delle idee? Sì, ___ ho alcune.","answer":"ne","explanation":"Ne replaces an indefinite quantity.","english":"Do you have any ideas? Yes, I have a few."},{"id":21,"content_id":"B4-G21","category":"Conjunctions","prompt":"Cambiamo il piano ___ il costo aumenti.","answer":"prima che","explanation":"Prima che takes the subjunctive.","english":"Let's change the plan before the cost increases."},{"id":22,"content_id":"B4-G22","category":"Conjunctions","prompt":"Investiamo ___ il rischio sia alto.","answer":"benché","explanation":"Benché takes the subjunctive.","english":"We invest although the risk is high."},{"id":23,"content_id":"B4-G23","category":"Conjunctions","prompt":"La proposta è valida ___ tutti siano d’accordo.","answer":"purché","explanation":"Purché introduces a necessary condition.","english":"The proposal is valid provided that everyone agrees."},{"id":24,"content_id":"B4-G24","category":"Conjunctions","prompt":"Ti invierò il testo ___ sarà pronto.","answer":"non appena","explanation":"Non appena = as soon as.","english":"I'll send you the text as soon as it's ready."},{"id":25,"content_id":"B4-G25","category":"Conjunctions","prompt":"È utile, ___ non è sufficiente.","answer":"tuttavia","explanation":"Tuttavia expresses contrast.","english":"It's useful; however, it's not enough."},{"id":26,"content_id":"B4-G26","category":"Negation and particles","prompt":"Non abbiamo ___ una soluzione.","answer":"ancora","explanation":"Not yet.","english":"We don't have a solution yet."},{"id":27,"content_id":"B4-G27","category":"Negation and particles","prompt":"La differenza è ___ minima.","answer":"appena","explanation":"Appena can mean barely.","english":"The difference is barely noticeable."},{"id":28,"content_id":"B4-G28","category":"Negation and particles","prompt":"Non dipende ___ da me.","answer":"soltanto","explanation":"Not only on me.","english":"It doesn't depend only on me."},{"id":29,"content_id":"B4-G29","category":"Negation and particles","prompt":"Sono ___ soddisfatto.","answer":"pienamente","explanation":"Pienamente means fully.","english":"I'm completely satisfied."},{"id":30,"content_id":"B4-G30","category":"Negation and particles","prompt":"La misura ___ varia.","answer":"non","explanation":"Non precedes the finite verb.","english":"The measurement doesn't vary."},{"id":31,"content_id":"B4-G31","category":"Agreement","prompt":"Le ipotesi sono ___.","answer":"coerenti","explanation":"Coerente → coerenti in plural.","english":"The hypotheses are consistent."},{"id":32,"content_id":"B4-G32","category":"Agreement","prompt":"I dati sono ___.","answer":"rilevanti","explanation":"Rilevante → rilevanti in plural.","english":"The data are relevant."},{"id":33,"content_id":"B4-G33","category":"Agreement","prompt":"La conclusione è ___.","answer":"solida","explanation":"Solid, feminine singular.","english":"The conclusion is solid."},{"id":34,"content_id":"B4-G34","category":"Agreement","prompt":"Le scelte sono ___.","answer":"difficili","explanation":"Difficile → difficili in plural.","english":"The choices are difficult."},{"id":35,"content_id":"B4-G35","category":"Agreement","prompt":"Un risultato ___.","answer":"empirico","explanation":"Empirico is masculine singular.","english":"An empirical result."},{"id":36,"content_id":"B4-G36","category":"Clitics and common forms","prompt":"___ sono reso conto subito.","answer":"Mi","explanation":"Mi sono reso conto = I realized.","english":"I realized immediately."},{"id":37,"content_id":"B4-G37","category":"Clitics and common forms","prompt":"Non ___ parliamo ancora.","answer":"ne","explanation":"Ne replaces di questo.","english":"Let's not discuss it anymore."},{"id":38,"content_id":"B4-G38","category":"Clitics and common forms","prompt":"Te ___ posso spiegare.","answer":"lo","explanation":"Te lo posso spiegare = I can explain it to you.","english":"I can explain it to you."},{"id":39,"content_id":"B4-G39","category":"Clitics and common forms","prompt":"Pensi a questo rischio? Sì, ___ penso.","answer":"ci","explanation":"Ci replaces a questo rischio.","english":"Are you thinking about this risk? Yes, I'm thinking about it."},{"id":40,"content_id":"B4-G40","category":"Clitics and common forms","prompt":"Quanti casi abbiamo? ___ abbiamo cinque.","answer":"Ne","explanation":"Ne replaces an indefinite quantity.","english":"How many cases do we have? We have five."},{"id":41,"content_id":"B4-G41","category":"Articles","prompt":"___ analisi richiede tempo.","answer":"L’","explanation":"Feminine singular article before a vowel.","english":"The analysis takes time."},{"id":42,"content_id":"B4-G42","category":"Articles","prompt":"Abbiamo esaminato ___ scenario alternativo.","answer":"uno","explanation":"Uno is used before s + consonant.","english":"We examined an alternative scenario."},{"id":43,"content_id":"B4-G43","category":"Articles","prompt":"___ indicatori sono migliorati.","answer":"Gli","explanation":"Masculine plural article before a vowel.","english":"The indicators have improved."},{"id":44,"content_id":"B4-G44","category":"Articles","prompt":"Abbiamo bisogno ___ stima più precisa.","answer":"di una","explanation":"Di una introduces an indefinite estimate.","english":"We need a more precise estimate."},{"id":45,"content_id":"B4-G45","category":"Articles","prompt":"Le conclusioni ___ studio sono solide.","answer":"dello","explanation":"Di + lo = dello.","english":"The study's conclusions are solid."},{"id":46,"content_id":"B4-G46","category":"Prepositions","prompt":"I risultati sono coerenti ___ teoria.","answer":"con la","explanation":"Coerente con introduces agreement.","english":"The results are consistent with the theory."},{"id":47,"content_id":"B4-G47","category":"Prepositions","prompt":"La proposta si basa ___ dati.","answer":"sui","explanation":"Su + i = sui.","english":"The proposal is based on the data."},{"id":48,"content_id":"B4-G48","category":"Prepositions","prompt":"Discuteremo ___ possibili conseguenze.","answer":"delle","explanation":"Discutere di + le = delle.","english":"We'll discuss the possible consequences."},{"id":49,"content_id":"B4-G49","category":"Prepositions","prompt":"La scelta dipenderà ___ condizioni del mercato.","answer":"dalle","explanation":"Da + le = dalle.","english":"The choice will depend on market conditions."},{"id":50,"content_id":"B4-G50","category":"Prepositions","prompt":"Il valore è stato corretto ___ inflazione.","answer":"per l’","explanation":"Per l’ introduces the adjustment for inflation.","english":"The value was adjusted for inflation."},{"id":51,"content_id":"B4-G51","category":"Question words","prompt":"___ misura l’effetto è significativo?","answer":"In che","explanation":"In che misura asks to what extent.","english":"To what extent is the effect significant?"},{"id":52,"content_id":"B4-G52","category":"Question words","prompt":"___ ipotesi si basa il risultato?","answer":"Su quale","explanation":"Su quale asks on which.","english":"On which hypothesis is the result based?"},{"id":53,"content_id":"B4-G53","category":"Question words","prompt":"___ delle due es","prompt":"Non possiamo ___ escluderlo.","answer":"del tutto","explanation":"Del tutto means entirely.","english":"We can't rule it out entirely."},{"id":71,"content_id":"B4-G71","category":"Agreement","prompt":"Le valutazioni sono ___.","answer":"accurate","explanation":"Feminine plural adjective.","english":"The assessments are accurate."},{"id":72,"content_id":"B4-G72","category":"Agreement","prompt":"Un sistema ___.","answer":"complesso","explanation":"Masculine singular adjective.","english":"A complex system."},{"id":73,"content_id":"B4-G73","category":"Agreement","prompt":"Gli indicatori sono ___.","answer":"stabili","explanation":"Stabile → stabili in plural.","english":"The indicators are stable."},{"id":74,"content_id":"B4-G74","category":"Agreement","prompt":"Una proposta ___.","answer":"convincente","explanation":"Convincente is unchanged by gender in singular.","english":"A convincing proposal."},{"id":75,"content_id":"B4-G75","category":"Agreement","prompt":"I rischi sono ___.","answer":"elevati","explanation":"Masculine plural agreement.","english":"The risks are high."},{"id":76,"content_id":"B4-G76","category":"Clitics and common forms","prompt":"___ siamo accorti del rischio tardi.","answer":"Ci","explanation":"Accorgersi is reflexive: ci siamo accorti.","english":"We realized the risk too late."},{"id":77,"content_id":"B4-G77","category":"Clitics and common forms","prompt":"A quella proposta non ___ abbiamo dato seguito.","answer":"le","explanation":"Le refers to feminine singular proposta.","english":"We didn't follow up on that proposal."},{"id":78,"content_id":"B4-G78","category":"Clitics and common forms","prompt":"Il risultato? Te ___ comunicherò domani.","answer":"lo","explanation":"Te lo means it to you.","english":"The result? I'll tell you tomorrow."},{"id":79,"content_id":"B4-G79","category":"Clitics and common forms","prompt":"Su questo argomento ___ torneremo più avanti.","answer":"ci","explanation":"Ci replaces su questo argomento.
