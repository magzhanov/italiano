cosa da mangiare. Si sono incontrati presto alla stazione e hanno preso un treno regionale. Durante il viaggio hanno guardato dal finestrino piccoli paesi, prati verdi e campi coltivati. Nessuno immaginava che il tempo sarebbe cambiato così rapidamente.\n\nDopo un'ora di cammino il cielo è diventato scuro e ha cominciato a piovere. Prima poche gocce, poi un temporale improvviso. Il sentiero era stretto e le pietre erano scivolose. Martina ha suggerito di fermarsi sotto una tettoia vicino a una casa abbandonata. Un amico voleva continuare, ma gli altri hanno preferito aspettare. Hanno indossato le giacche, mangiato i panini e controllato la mappa.\n\nLa pioggia è durata quasi quaranta minuti. Quando il sole è tornato, la valle era coperta da una luce particolare e nell'aria si sentiva il profumo della terra bagnata. Gli amici hanno deciso di non raggiungere la vetta: ormai era tardi e il terreno non era sicuro. Hanno scelto invece una strada più facile che passava vicino a un piccolo lago. Lì hanno scattato alcune fotografie e si sono riposati.\n\nSul treno del ritorno, qualcuno ha detto che la gita era stata rovinata dal maltempo. Martina non era d'accordo. «Abbiamo cambiato programma e siamo rimasti insieme. Non abbiamo visto la cima, ma abbiamo visto una valle bellissima». Gli altri hanno riflettuto e hanno ammesso che aveva ragione. La gita non era stata quella prevista, ma era comunque diventata una storia da raccontare.","english":"When Martina proposed a trip into the hills, the forecast called for clear skies. Her friends packed backpacks, comfortable shoes, water, and something to eat. They met early at the station and took a regional train. During the journey they watched small villages, green meadows, and cultivated fields pass outside the window. Nobody imagined the weather would change so quickly.\n\nAfter an hour's walk the sky turned dark and it began to rain. First a few drops, then a sudden downpour. The path was narrow and the stones were slippery. Martina suggested stopping under a shelter near an abandoned house. One friend wanted to keep going, but the others preferred to wait. They put on their jackets, ate their sandwiches, and checked the map.\n\nThe rain lasted almost forty minutes. When the sun came back, a special light covered the valley and the air smelled of wet earth. The friends decided not to reach the summit: it was now late and the ground was unsafe. Instead, they chose an easier road passing near a small lake. There they took some photos and rested.\n\nOn the train home, someone said the bad weather had ruined the trip. Martina disagreed. “We changed our plans and stayed together. We didn't see the summit, but we saw a beautiful valley.” The others thought about it and admitted she was right. The excursion had not gone as planned, but it had still become a story worth telling.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]},{"id":"B2-L05","title":"Il compleanno organizzato male","italian":"Per il compleanno di suo padre, Elisa voleva preparare una sorpresa. Aveva invitato i parenti, ordinato una torta e prenotato un tavolo in un ristorante. Sembrava tutto semplice. Poi, il giorno prima della festa, il ristorante ha telefonato: a causa di un problema in cucina non potevano accogliere il gruppo. Elisa ha aperto il calendario e ha capito che aveva pochissime ore per trovare un'alternativa.\n\nHa chiamato tre ristoranti, ma tutti erano già pieni. Sua madre le ha proposto di organizzare il pranzo in casa. Elisa all'inizio ha rifiutato: gli invitati erano tanti e la cucina era piccola. Poi sua sorella le ha detto che potevano dividere il lavoro. Un cugino avrebbe preparato la pasta, uno zio avrebbe portato le bevande e la nonna avrebbe cucinato il dolce preferito del festeggiato.\n\nLa mattina della festa tutti sono arrivati con qualcosa in mano. La casa sembrava un mercato: piatti sul tavolo, sedie nel corridoio e bambini che cercavano i regali nascosti. Il padre di Elisa è entrato e si è fermato sorpreso. Non sapeva niente del problema con il ristorante. Ha guardato la famiglia e ha detto: «Avete organizzato tutto questo per me?». Elisa ha risposto che il piano era cambiato, ma che la sorpresa era rimasta.\n\nIl pranzo è durato più del previsto, perché nessuno aveva fretta di andare via. A fine giornata Elisa era stanca, ma contenta. Aveva imparato che organizzare non significa controllare ogni dettaglio: significa anche saper cambiare idea, chiedere aiuto e lasciare spazio alle persone. Il padre le ha detto che era stato uno dei compleanni più belli della sua vita.","english":"For her father's birthday, Elisa wanted to organize a surprise. She had invited relatives, ordered a cake, and reserved a table at a restaurant. Everything seemed simple. Then, the day before the party, the restaurant called: because of a kitchen problem, it could not accommodate the group. Elisa opened her calendar and realized she had very few hours to find an alternative.\n\nShe called three restaurants, but they were all fully booked. Her mother suggested holding lunch at home. At first Elisa refused: there were many guests and the kitchen was small. Then her sister said they could divide up the work. A cousin would make the pasta, an uncle would bring drinks, and their grandmother would prepare the guest of honor's favorite dessert.\n\nOn the morning of the party everyone arrived carrying something. The house looked like a market: plates on the table, chairs in the hallway, and children searching for hidden presents. Elisa's father walked in and stopped in surprise. He knew nothing about the restaurant problem. He looked at his family and said, “You organized all this for me?” Elisa replied that the plan had changed, but the surprise had remained.\n\nLunch lasted longer than expected because nobody was in a hurry to leave. By the end of the day Elisa was tired but happy. She had learned that organizing does not mean controlling every detail: it also means being able to change your mind, ask for help, and make room for others. Her father told her it had been one of the best birthdays of his life.","task_type":"italian_to_english","hide_english_until_submitted":true,"is_featured_long":true,"comprehension":[{"q":"Chi sono i protagonisti principali e che cosa volevano fare?","hint":"Name the people and the original objective."},{"q":"Quale problema cambia il programma?","hint":"Explain the obstacle in Italian."},{"q":"Come finisce la vicenda e perché?","hint":"Describe the outcome and the reason."},{"q":"Quale nuova parola hai imparato dal testo?","hint":"Write the word and an original sentence."},{"q":"Riassumi il testo in quattro frasi italiane.","hint":"Use complete sentences without copying."}]}],"translation_exercises":[{"id":"B2-T01","title":"The missing key","prompt_english":"This morning I woke up late and could not find my keys. I checked every pocket of my coat. In the end they were on the kitchen table, next to the newspaper.","model_italian":"Stamattina mi sono svegliato tardi e non riuscivo a trovare le chiavi. Ho controllato ogni tasca del cappotto. Alla fine erano sul tavolo della cucina, accanto al giornale.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T02","title":"An appointment moved","prompt_english":"We had an appointment at ten, but the doctor moved it to eleven. I sent you a message as soon as I received the confirmation. We can have a coffee while we wait.","model_italian":"Avevamo un appuntamento alle dieci, ma il medico l'ha spostato alle undici. Ti ho inviato un messaggio appena ho ricevuto la conferma. Possiamo prendere un caffè mentre aspettiamo.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T03","title":"A quieter apartment","prompt_english":"This apartment is cheaper, but it is noisy at night. The other one has a balcony and a large kitchen. I have not decided yet because both have advantages.","model_italian":"Questo appartamento è più economico, ma di notte è rumoroso. L'altro ha un balcone e una cucina grande. Non ho ancora deciso perché entrambi hanno dei vantaggi.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T04","title":"A suitcase at the airport","prompt_english":"My suitcase did not arrive with my flight. I described it to an employee and gave him my address. He promised to send me a message as soon as they found it.","model_italian":"La mia valigia non è arrivata con il volo. L'ho descritta a un dipendente e gli ho dato il mio indirizzo. Mi ha promesso di inviarmi un messaggio appena l'avessero trovata.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T05","title":"A new recipe","prompt_english":"Yesterday we cooked dinner for six guests. We forgot to buy butter, so we used olive oil. Everyone liked the pasta, even though the sauce was a little too spicy.","model_italian":"Ieri abbiamo cucinato la cena per sei ospiti. Abbiamo dimenticato di comprare il burro, quindi abbiamo usato l'olio d'oliva. A tutti è piaciuta la pasta, anche se la salsa era un po' troppo piccante.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T06","title":"The wrong attachment","prompt_english":"I sent the wrong file to my professor. I noticed the mistake after the meeting and immediately sent the correct attachment. Fortunately, he had not opened the first email.","model_italian":"Ho inviato il file sbagliato al professore. Mi sono accorto dell'errore dopo la riunione e ho inviato subito l'allegato corretto. Per fortuna non aveva ancora aperto la prima email.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T07","title":"An unexpected invitation","prompt_english":"A former classmate invited me to her birthday party. We have not met for several years. I accepted because I would like to see our old friends again.","model_italian":"Una vecchia compagna di scuola mi ha invitato alla sua festa di compleanno. Non ci vediamo da diversi anni. Ho accettato perché vorrei rivedere i nostri vecchi amici.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T08","title":"The late tram","prompt_english":"The tram was twenty minutes late, so I decided to walk to the station. I arrived before my colleague, although he had left home earlier. Tomorrow I will check the timetable first.","model_italian":"Il tram era in ritardo di venti minuti, quindi ho deciso di camminare fino alla stazione. Sono arrivato prima del mio collega, anche se era uscito di casa prima di me. Domani controllerò prima l'orario.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T09","title":"A careful purchase","prompt_english":"I tried on the blue sweater, but it was too small. The shop assistant recommended a larger size. I kept the receipt because I may want to return it.","model_italian":"Ho provato il maglione blu, ma era troppo piccolo. La commessa mi ha consigliato una taglia più grande. Ho conservato lo scontrino perché potrei volerlo restituire.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T10","title":"A morning walk","prompt_english":"On Saturday we will walk through the park and then visit a photography exhibition. If the weather is bad, we will take the tram instead. The exhibition is free for students.","model_italian":"Sabato cammineremo attraverso il parco e poi visiteremo una mostra di fotografia. Se farà brutto tempo, prenderemo invece il tram. La mostra è gratuita per gli studenti.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T11","title":"Work and the deadline","prompt_english":"I have two days to finish the project. I have already written the first chapter, but I still need to check the results. Tomorrow I will send the document to my colleagues.","model_italian":"Ho due giorni per finire il progetto. Ho già scritto il primo capitolo, ma devo ancora controllare i risultati. Domani invierò il documento ai miei colleghi.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T12","title":"The refund","prompt_english":"The package arrived late, and the product was damaged. I contacted customer service and asked for a refund. They replied that the money would return to my card within a week.","model_italian":"Il pacco è arrivato in ritardo e il prodotto era danneggiato. Ho contattato il servizio clienti e ho chiesto un rimborso. Mi hanno risposto che i soldi sarebbero tornati sulla mia carta entro una settimana.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T13","title":"A short illness","prompt_english":"I had a fever yesterday, so I stayed at home and rested. Today I feel better, but I am still tired. I will call the doctor if the symptoms return.","model_italian":"Ieri avevo la febbre, quindi sono rimasto a casa e mi sono riposato. Oggi mi sento meglio, ma sono ancora stanco. Chiamerò il medico se i sintomi torneranno.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T14","title":"A difficult discussion","prompt_english":"My friend and I disagreed about the plan for the weekend. At first we were both nervous. After talking calmly, we found a solution that worked for both of us.","model_italian":"Io e il mio amico non eravamo d'accordo sul programma per il fine settimana. All'inizio eravamo entrambi nervosi. Dopo aver parlato con calma, abbiamo trovato una soluzione che andava bene a entrambi.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T15","title":"A sudden storm","prompt_english":"We were walking up the hill when we heard thunder. The sky became dark, and we decided to return to the village. Luckily, the rain began only after we arrived.","model_italian":"Stavamo salendo sulla collina quando abbiamo sentito un tuono. Il cielo è diventato scuro e abbiamo deciso di tornare al paese. Per fortuna la pioggia è cominciata solo dopo il nostro arrivo.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T16","title":"Learning Italian","prompt_english":"I learn new vocabulary every day, but I also review the words I studied last week. Sometimes I forget an article or an accent. My goal is to use each word correctly in conversation.","model_italian":"Imparo parole nuove ogni giorno, ma ripasso anche quelle che ho studiato la settimana scorsa. A volte dimentico un articolo o un accento. Il mio obiettivo è usare ogni parola correttamente nella conversazione.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T17","title":"A new neighbour","prompt_english":"Our new neighbour seems very kind. Yesterday she helped us carry a heavy package upstairs. We invited her to dinner next week to thank her.","model_italian":"La nostra nuova vicina sembra molto gentile. Ieri ci ha aiutato a portare un pacco pesante al piano di sopra. L'abbiamo invitata a cena la settimana prossima per ringraziarla.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T18","title":"A surprising exhibition","prompt_english":"I thought the exhibition would be boring, but I was surprised. The photographs told interesting stories about the city. I would like to return with my family next Sunday.","model_italian":"Pensavo che la mostra sarebbe stata noiosa, ma sono rimasto sorpreso. Le fotografie raccontavano storie interessanti sulla città. Vorrei tornarci con la mia famiglia domenica prossima.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T19","title":"A better habit","prompt_english":"I used to check my phone every five minutes. Now I leave it in another room while I study. I am more patient, and I finish my homework faster.","model_italian":"Prima controllavo il telefono ogni cinque minuti. Adesso lo lascio in un'altra stanza mentre studio. Sono più paziente e finisco i compiti più velocemente.","task_type":"english_to_italian","hide_italian_until_submitted":true},{"id":"B2-T20","title":"The next trip","prompt_english":"Next month we will visit a small town near the sea. We have already booked the hotel, but we have not chosen the train. We want to travel slowly and enjoy the view along the coast.","model_italian":"Il mese prossimo visiteremo un piccolo paese vicino al mare. Abbiamo già prenotato l'albergo, ma non abbiamo ancora scelto il treno. Vogliamo viaggiare con calma e goderci il panorama lungo la costa.","task_type":"english_to_italian","hide_italian_until_submitted":true}],"dialogues":[{"id":1,"title":"Il basilico sul balcone","lines":[{"speaker":"A","italian":"Hai visto il mio basilico sul balcone? Ieri era verde, oggi sembra triste.","english":"Have you seen my basil on the balcony? Yesterday it was green; today it looks sad."},{"speaker":"B","italian":"Hai controllato la terra? Forse ha bisogno d'acqua.","english":"Have you checked the soil? Maybe it needs water."},{"speaker":"A","italian":"L'ho annaffiato ogni mattina. Forse l'ho annaffiato troppo.","english":"I watered it every morning. Maybe I watered it too much."},{"speaker":"B","italian":"Ecco il problema: il vaso non ha un buco sotto.","english":"There's the problem: the pot has no hole underneath."},{"speaker":"A","italian":"Quindi le radici restano sempre bagnate?","english":"So the roots stay wet all the time?"},{"speaker":"B","italian":"Esatto. Mettilo in un vaso diverso e togli l'acqua in eccesso.","english":"Exactly. Put it in a different pot and remove the extra water."},{"speaker":"A","italian":"Tu sembri un esperto di piante.","english":"You sound like a plant expert."},{"speaker":"B","italian":"Non proprio. Ho già perso tre basilici nello stesso modo.","english":"Not exactly. I've already lost three basil plants the same way."},{"speaker":"A","italian":"Allora questo sarà il nostro quarto esperimento.","english":"Then this will be our fourth experiment."},{"speaker":"B","italian":"Prometto di controllarlo, ma tu prometti di non annaffiarlo due volte al giorno.","english":"I promise to check it, but you promise not to water it twice a day."},{"speaker":"A","italian":"Accetto. Se sopravvive, prepariamo la pasta al pesto.","english":"Agreed. If it survives, we'll make pasta with pesto."},{"speaker":"B","italian":"Se non sopravvive, ordiniamo una pizza.","english":"If it doesn't survive, we'll order a pizza."}],"content_id":"B2-D01","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":2,"title":"La valigia identica","lines":[{"speaker":"A","italian":"Scusi, credo che questa valigia sia la mia, ma non sono sicura.","english":"Excuse me, I think this suitcase is mine, but I'm not sure."},{"speaker":"B","italian":"Ha un'etichetta con il suo nome?","english":"Does it have a tag with your name?"},{"speaker":"A","italian":"No, perché pensavo di riconoscerla subito.","english":"No, because I thought I'd recognize it immediately."},{"speaker":"B","italian":"Provi a descrivere qualcosa che c'è dentro.","english":"Try describing something inside it."},{"speaker":"A","italian":"Un maglione giallo, un romanzo e dei guanti rossi.","english":"A yellow sweater, a novel, and red gloves."},{"speaker":"B","italian":"Questa contiene una macchina fotografica e tre camicie.","english":"This one contains a camera and three shirts."},{"speaker":"A","italian":"Allora non è la mia. Mi dispiace davvero.","english":"Then it isn't mine. I'm really sorry."},{"speaker":"B","italian":"Nessun problema. Il suo volo da dove arrivava?","english":"No problem. Where did your flight come from?"},{"speaker":"A","italian":"Da Napoli. Il bagaglio doveva arrivare sul nastro quattro.","english":"From Naples. The luggage was supposed to arrive on belt four."},{"speaker":"B","italian":"Il nastro è cambiato cinque minuti fa: adesso è il sei.","english":"The belt changed five minutes ago: now it's six."},{"speaker":"A","italian":"Ah, ecco la spiegazione. Grazie per la pazienza.","english":"Ah, that explains it. Thank you for your patience."},{"speaker":"B","italian":"Buona fortuna, e la prossima volta metta un'etichetta.","english":"Good luck, and next time put on a tag."}],"content_id":"B2-D02","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":3,"title":"La prenotazione scomparsa","lines":[{"speaker":"A","italian":"Buonasera. Ho una prenotazione per due, a nome Rossi.","english":"Good evening. I have a reservation for two under Rossi."},{"speaker":"B","italian":"Controllo subito. Mi dispiace, non la trovo nel sistema.","english":"I'll check right away. I'm sorry, I can't find it in the system."},{"speaker":"A","italian":"Ho ricevuto una conferma ieri. Guardi questa email.","english":"I received confirmation yesterday. Look at this email."},{"speaker":"B","italian":"La data è corretta, ma il ristorante è quello dall'altra parte della piazza.","english":"The date is correct, but the restaurant is the one on the other side of the square."},{"speaker":"A","italian":"Davvero? Hanno quasi lo stesso nome!","english":"Really? They have almost the same name!"},{"speaker":"B","italian":"Succede spesso. Comunque abbiamo un tavolo libero tra venti minuti.","english":"It happens often. Anyway, we have a free table in twenty minutes."},{"speaker":"A","italian":"Per noi va bene. Possiamo aspettare al bar?","english":"That's fine for us. Can we wait at the bar?"},{"speaker":"B","italian":"Certo. Nel frattempo volete vedere il menù?","english":"Of course. In the meantime, would you like to see the menu?"},{"speaker":"A","italian":"Sì, soprattutto gli antipasti. Abbiamo molta fame.","english":"Yes, especially the starters. We're very hungry."},{"speaker":"B","italian":"Vi consiglio la zuppa del giorno e le verdure al forno.","english":"I recommend the soup of the day and the baked vegetables."},{"speaker":"A","italian":"Perfetto. Però questa volta controlliamo bene l'indirizzo.","english":"Perfect. But this time we'll check the address carefully."},{"speaker":"B","italian":"Ottima idea: il nostro numero civico è diciotto.","english":"Great idea: our street number is eighteen."}],"content_id":"B2-D03","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":4,"title":"Il temporale annunciato","lines":[{"speaker":"A","italian":"Hai guardato le previsioni? Nel pomeriggio arriva un temporale.","english":"Have you checked the forecast? A thunderstorm is coming this afternoon."},{"speaker":"B","italian":"Ma il cielo è completamente azzurro.","english":"But the sky is completely blue."},{"speaker":"A","italian":"Proprio per questo mi preoccupo: ieri è cambiato in dieci minuti.","english":"That's exactly why I'm worried: yesterday it changed in ten minutes."},{"speaker":"B","italian":"Abbiamo già prenotato le biciclette.","english":"We've already booked the bicycles."},{"speaker":"A","italian":"Possiamo cambiare programma e visitare il museo.","english":"We can change the plan and visit the museum."},{"speaker":"B","italian":"Il museo è chiuso il lunedì, te lo ricordi?","english":"The museum is closed on Mondays, remember?"},{"speaker":"A","italian":"Hai ragione. Allora andiamo al cinema.","english":"You're right. Then let's go to the cinema."},{"speaker":"B","italian":"E se invece facessimo una passeggiata breve adesso?","english":"What if we took a short walk now instead?"},{"speaker":"A","italian":"Va bene, ma prendiamo l'ombrello.","english":"All right, but let's take the umbrella."},{"speaker":"B","italian":"Nonostante il sole?","english":"Despite the sunshine?"},{"speaker":"A","italian":"Sì. Preferisco portarlo inutilmente che tornare completamente bagnata.","english":"Yes. I'd rather carry it unnecessarily than come back completely soaked."},{"speaker":"B","italian":"Accetto. E scelgo un percorso vicino a casa.","english":"Agreed. And I'll choose a route close to home."}],"content_id":"B2-D04","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":5,"title":"Il quadro senza firma","lines":[{"speaker":"A","italian":"Questo quadro mi piace, ma non vedo la firma.","english":"I like this painting, but I can't see the signature."},{"speaker":"B","italian":"Forse l'artista ha deciso di non firmarlo.","english":"Perhaps the artist decided not to sign it."},{"speaker":"A","italian":"C'è scritto che risale al secolo scorso.","english":"It says it dates back to the last century."},{"speaker":"B","italian":"Leggi anche la spiegazione: è stato trovato in una soffitta.","english":"Read the explanation too: it was found in an attic."},{"speaker":"A","italian":"In una soffitta? Sembra l'inizio di un romanzo.","english":"In an attic? It sounds like the beginning of a novel."},{"speaker":"B","italian":"Il proprietario pensava che non avesse valore.","english":"The owner thought it had no value."},{"speaker":"A","italian":"E invece adesso è in una mostra famosa.","english":"And now it's in a famous exhibition."},{"speaker":"B","italian":"Esatto. A volte il valore di una cosa non è evidente.","english":"Exactly. Sometimes the value of something isn't obvious."},{"speaker":"A","italian":"Preferisci questo o il panorama nell'altra sala?","english":"Do you prefer this one or the landscape in the other room?"},{"speaker":"B","italian":"Il panorama: mi ricorda la valle dove sono cresciuto.","english":"The landscape: it reminds me of the valley where I grew up."},{"speaker":"A","italian":"Allora torniamo a guardarlo insieme.","english":"Then let's go back and look at it together."},{"speaker":"B","italian":"Volentieri. Prima però facciamo una fotografia, se è permesso.","english":"Gladly. First, though, let's take a photo if it's allowed."}],"content_id":"B2-D05","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":6,"title":"Un colloquio diverso","lines":[{"speaker":"A","italian":"Benvenuta. Grazie per essere arrivata in anticipo.","english":"Welcome. Thank you for arriving early."},{"speaker":"B","italian":"Grazie a lei. Ho controllato l'orario del tram per evitare ritardi.","english":"Thank you. I checked the tram schedule to avoid delays."},{"speaker":"A","italian":"Mi racconti un progetto che ha organizzato da sola.","english":"Tell me about a project you organized on your own."},{"speaker":"B","italian":"Ho preparato un laboratorio per studenti stranieri.","english":"I prepared a workshop for foreign students."},{"speaker":"A","italian":"Qual è stata la difficoltà maggiore?","english":"What was the biggest difficulty?"},{"speaker":"B","italian":"All'inizio non conoscevo le loro esigenze, quindi ho fatto molte domande.","english":"At first I didn't know their needs, so I asked many questions."},{"speaker":"A","italian":"E come ha misurato il risultato?","english":"And how did you measure the result?"},{"speaker":"B","italian":"Ho chiesto un parere a ciascuno e ho confrontato le risposte.","english":"I asked each person for feedback and compared the answers."},{"speaker":"A","italian":"Interessante. Che cosa cambierebbe oggi?","english":"Interesting. What would you change today?"},{"speaker":"B","italian":"Darei più tempo alle attività pratiche e meno alle spiegazioni.","english":"I'd give more time to practical activities and less to explanations."},{"speaker":"A","italian":"Una risposta onesta. Ha delle domande per noi?","english":"An honest answer. Do you have any questions for us?"},{"speaker":"B","italian":"Sì: come aiutate i nuovi dipendenti a imparare?","english":"Yes: how do you help new employees learn?"}],"content_id":"B2-D06","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":7,"title":"L'allegato sbagliato","lines":[{"speaker":"A","italian":"Hai ricevuto la mia email con il riassunto?","english":"Did you receive my email with the summary?"},{"speaker":"B","italian":"Sì, ma nell'allegato c'è una ricetta per la zuppa.","english":"Yes, but the attachment contains a soup recipe."},{"speaker":"A","italian":"Impossibile! Avevo selezionato il file giusto.","english":"Impossible! I'd selected the correct file."},{"speaker":"B","italian":"Si chiama «progetto_finale», però parla di cipolle e patate.","english":"It's called “final_project,” but it talks about onions and potatoes."},{"speaker":"A","italian":"Adesso capisco: ho due cartelle con lo stesso nome.","english":"Now I understand: I have two folders with the same name."},{"speaker":"B","italian":"Almeno la ricetta sembra buona.","english":"At least the recipe looks good."},{"speaker":"A","italian":"Ti invio il documento corretto immediatamente.","english":"I'll send you the correct document immediately."},{"speaker":"B","italian":"Controlla anche che il grafico sia aggiornato.","english":"Also check that the chart is up to date."},{"speaker":"A","italian":"Fatto. Questa volta ho aperto l'allegato prima di inviarlo.","english":"Done. This time I opened the attachment before sending it."},{"speaker":"B","italian":"Perfetto, il riassunto è arrivato.","english":"Perfect, the summary has arrived."},{"speaker":"A","italian":"E la ricetta? Puoi conservarla se vuoi.","english":"And the recipe? You can keep it if you want."},{"speaker":"B","italian":"Certamente. È il miglior errore della settimana.","english":"Absolutely. It's the best mistake of the week."}],"content_id":"B2-D07","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":8,"title":"Il mistero della salsa","lines":[{"speaker":"A","italian":"La salsa ha un sapore strano. Hai seguito la ricetta?","english":"The sauce tastes strange. Did you follow the recipe?"},{"speaker":"B","italian":"Quasi. Non avevamo il burro, quindi ho usato l'olio.","english":"Almost. We didn't have butter, so I used oil."},{"speaker":"A","italian":"Questo non spiega il sapore dolce.","english":"That doesn't explain the sweet taste."},{"speaker":"B","italian":"Ho aggiunto un cucchiaio di zucchero.","english":"I added a spoonful of sugar."},{"speaker":"A","italian":"Un cucchiaio? La ricetta dice un pizzico!","english":"A spoonful? The recipe says a pinch!"},{"speaker":"B","italian":"Avevo fretta e non ho letto bene.","english":"I was in a hurry and didn't read carefully."},{"speaker":"A","italian":"Possiamo aggiungere un po' di pomodoro e sale.","english":"We can add a little tomato and salt."},{"speaker":"B","italian":"Vuoi assaggiare di nuovo prima?","english":"Do you want to taste it again first?"},{"speaker":"A","italian":"Sì. Ora è meglio, ma ancora troppo dolce.","english":"Yes. It's better now, but still too sweet."},{"speaker":"B","italian":"Allora prepariamo una salsa nuova.","english":"Then let's make a new sauce."},{"speaker":"A","italian":"Va bene, e questa volta leggo io gli ingredienti.","english":"All right, and this time I'll read the ingredients."},{"speaker":"B","italian":"Prometto di ascoltare ogni parola.","english":"I promise to listen to every word."}],"content_id":"B2-D08","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":9,"title":"Il tram numero sette","lines":[{"speaker":"A","italian":"Perché siamo arrivati davanti allo stadio?","english":"Why have we ended up in front of the stadium?"},{"speaker":"B","italian":"Perché abbiamo preso il tram numero sette, come dicevi tu.","english":"Because we took tram number seven, as you said."},{"speaker":"A","italian":"Ma dovevamo prendere il diciassette!","english":"But we were supposed to take number seventeen!"},{"speaker":"B","italian":"Allora abbiamo perso venti minuti per una cifra.","english":"So we've lost twenty minutes because of one digit."},{"speaker":"A","italian":"Non è grave. Controllo la mappa per trovare una soluzione.","english":"It's not serious. I'll check the map to find a solution."},{"speaker":"B","italian":"C'è una fermata della metropolitana a cinque minuti.","english":"There's a metro station five minutes away."},{"speaker":"A","italian":"Perfetto. Però guarda il traffico: forse a piedi arriviamo prima.","english":"Perfect. But look at the traffic: perhaps we'll get there sooner on foot."},{"speaker":"B","italian":"Quanto manca al colloquio?","english":"How long until the interview?"},{"speaker":"A","italian":"Quaranta minuti. Abbiamo ancora tempo.","english":"Forty minutes. We still have time."},{"speaker":"B","italian":"Allora camminiamo, ma senza fermarci per un caffè.","english":"Then let's walk, but without stopping for coffee."},{"speaker":"A","italian":"Questo è un sacrificio enorme.","english":"That's an enormous sacrifice."},{"speaker":"B","italian":"Ti offrirò due caffè dopo il colloquio.","english":"I'll buy you two coffees after the interview."}],"content_id":"B2-D09","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":10,"title":"Una festa quasi segreta","lines":[{"speaker":"A","italian":"Hai invitato Giulia per sabato?","english":"Did you invite Giulia for Saturday?"},{"speaker":"B","italian":"Sì, ma pensa che sia una cena normale.","english":"Yes, but she thinks it's an ordinary dinner."},{"speaker":"A","italian":"Perfetto. Dobbiamo preparare la sorpresa.","english":"Perfect. We have to prepare the surprise."},{"speaker":"B","italian":"Il dolce è prenotato, ma non so che regalo scegliere.","english":"The cake is ordered, but I don't know which gift to choose."},{"speaker":"A","italian":"Le piace la fotografia. Potremmo regalarle un libro di fotografie.","english":"She likes photography. We could give her a photography book."},{"speaker":"B","italian":"Bella idea. Quanto costa?","english":"Nice idea. How much does it cost?"},{"speaker":"A","italian":"Circa venticinque euro. È dentro il nostro budget.","english":"About twenty-five euros. It's within our budget."},{"speaker":"B","italian":"E se arriva prima degli altri ospiti?","english":"And what if she arrives before the other guests?"},{"speaker":"A","italian":"Le chiederemo di aiutarci in cucina.","english":"We'll ask her to help us in the kitchen."},{"speaker":"B","italian":"Non rischiamo che scopra tutto?","english":"Won't we risk her discovering everything?"},{"speaker":"A","italian":"Solo se vede il dolce nel frigorifero.","english":"Only if she sees the cake in the fridge."},{"speaker":"B","italian":"Allora mettiamo il dolce dal vicino.","english":"Then let's put the cake at the neighbour's."}],"content_id":"B2-D10","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":11,"title":"Una visita dal medico","lines":[{"speaker":"A","italian":"Buongiorno, vorrei prenotare una visita.","english":"Good morning, I'd like to book an appointment."},{"speaker":"B","italian":"Certamente. Quali sintomi ha?","english":"Certainly. What symptoms do you have?"},{"speaker":"A","italian":"Ho la tosse da quattro giorni e ieri avevo la febbre.","english":"I've had a cough for four days, and yesterday I had a fever."},{"speaker":"B","italian":"Ha difficoltà a respirare?","english":"Are you having trouble breathing?"},{"speaker":"A","italian":"No, respiro normalmente. Sono solo molto stanco.","english":"No, I'm breathing normally. I'm just very tired."},{"speaker":"B","italian":"Il medico ha posto libero domani mattina.","english":"The doctor has an available appointment tomorrow morning."},{"speaker":"A","italian":"Va bene. Devo portare qualche documento?","english":"That works. Should I bring any documents?"},{"speaker":"B","italian":"Un documento d'identità e la tessera sanitaria, se ce l'ha.","english":"An identity document and your health card, if you have it."},{"speaker":"A","italian":"Perfetto. Posso prendere una medicina nel frattempo?","english":"Perfect. Can I take medicine in the meantime?"},{"speaker":"B","italian":"Per i farmaci deve chiedere al medico o al farmacista.","english":"For medicines, you should ask the doctor or pharmacist."},{"speaker":"A","italian":"Capisco. Grazie per le informazioni.","english":"I understand. Thank you for the information."},{"speaker":"B","italian":"Prego. Se i sintomi peggiorano rapidamente, cerchi assistenza urgente.","english":"You're welcome. If symptoms worsen rapidly, seek urgent care."}],"content_id":"B2-D11","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":12,"title":"Il sentiero sbagliato","lines":[{"speaker":"A","italian":"Secondo la mappa, la cascata dovrebbe essere dietro questa collina.","english":"According to the map, the waterfall should be behind this hill."},{"speaker":"B","italian":"Ma il sentiero è finito dieci minuti fa.","english":"But the trail ended ten minutes ago."},{"speaker":"A","italian":"Forse abbiamo perso un cartello all'incrocio.","english":"Maybe we missed a sign at the junction."},{"speaker":"B","italian":"La connessione non funziona. Non posso controllare il percorso online.","english":"The connection doesn't work. I can't check the route online."},{"speaker":"A","italian":"Allora torniamo fino all'ultimo segnale.","english":"Then let's go back to the last sign."},{"speaker":"B","italian":"Sono d'accordo. Inoltre, stanno arrivando nuvole scure.","english":"I agree. Besides, dark clouds are coming."},{"speaker":"A","italian":"Hai abbastanza acqua per il ritorno?","english":"Do you have enough water for the return?"},{"speaker":"B","italian":"Sì, e ho anche una bottiglia per te.","english":"Yes, and I've got a bottle for you too."},{"speaker":"A","italian":"Grazie. La vista sulla valle è comunque bellissima.","english":"Thanks. The view over the valley is beautiful anyway."},{"speaker":"B","italian":"Anche senza cascata?","english":"Even without the waterfall?"},{"speaker":"A","italian":"Certo. Il viaggio non è solo la destinazione.","english":"Of course. A journey isn't just the destination."},{"speaker":"B","italian":"Allora scattiamo una fotografia e torniamo con calma.","english":"Then let's take a photograph and head back calmly."}],"content_id":"B2-D12","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":13,"title":"Il pacco del vicino","lines":[{"speaker":"A","italian":"Scusa, hai ricevuto un pacco a nome mio?","english":"Excuse me, did you receive a parcel addressed to me?"},{"speaker":"B","italian":"Sì, il corriere l'ha lasciato qui stamattina.","english":"Yes, the courier left it here this morning."},{"speaker":"A","italian":"Grazie mille. Pensavo fosse andato perso.","english":"Thank you so much. I thought it had been lost."},{"speaker":"B","italian":"No, è al sicuro. È molto pesante: che cosa contiene?","english":"No, it's safe. It's very heavy: what's inside?"},{"speaker":"A","italian":"Una stampante nuova per il mio ufficio.","english":"A new printer for my office."},{"speaker":"B","italian":"Allora ti aiuto a portarla al piano di sopra.","english":"Then I'll help you carry it upstairs."},{"speaker":"A","italian":"Sei gentilissimo, ma non voglio disturbarti.","english":"You're very kind, but I don't want to bother you."},{"speaker":"B","italian":"Nessun disturbo. Dove hai le chiavi?","english":"No bother. Where are your keys?"},{"speaker":"A","italian":"Aspetta… credo di averle lasciate dentro casa.","english":"Wait... I think I left them inside the apartment."},{"speaker":"B","italian":"Questo è un problema più grande del pacco.","english":"That's a bigger problem than the parcel."},{"speaker":"A","italian":"Forse la proprietaria ha una copia.","english":"Maybe the landlord has a copy."},{"speaker":"B","italian":"Chiamala. Intanto mettiamo la stampante in salotto.","english":"Call her. Meanwhile, let's put the printer in the living room."}],"content_id":"B2-D13","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":14,"title":"Il rimborso impossibile","lines":[{"speaker":"A","italian":"Buongiorno, vorrei restituire questi pantaloni.","english":"Good morning, I'd like to return these trousers."},{"speaker":"B","italian":"Ha lo scontrino?","english":"Do you have the receipt?"},{"speaker":"A","italian":"Sì, eccolo. Li ho comprati tre giorni fa.","english":"Yes, here it is. I bought them three days ago."},{"speaker":"B","italian":"Preferisce cambiare la taglia o ricevere un rimborso?","english":"Would you prefer to change the size or receive a refund?"},{"speaker":"A","italian":"Un rimborso, per favore. Il tessuto è scomodo.","english":"A refund, please. The fabric is uncomfortable."},{"speaker":"B","italian":"Ha ancora l'etichetta attaccata?","english":"Is the tag still attached?"},{"speaker":"A","italian":"Sì. Non li ho mai usati fuori casa.","english":"Yes. I've never worn them outside the house."},{"speaker":"B","italian":"Perfetto. Il rimborso arriverà sulla stessa carta.","english":"Perfect. The refund will arrive on the same card."},{"speaker":"A","italian":"Quanto tempo ci vorrà?","english":"How long will it take?"},{"speaker":"B","italian":"Di solito tre o quattro giorni lavorativi.","english":"Usually three or four working days."},{"speaker":"A","italian":"Grazie. Posso provare quella camicia mentre aspetto?","english":"Thanks. Can I try on that shirt while I wait?"},{"speaker":"B","italian":"Certo, i camerini sono sulla destra.","english":"Of course. The changing rooms are on the right."}],"content_id":"B2-D14","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":15,"title":"Una notizia troppo bella","lines":[{"speaker":"A","italian":"Hai letto questa notizia? Dicono che domani tutti i treni saranno gratuiti.","english":"Have you read this news item? It says all trains will be free tomorrow."},{"speaker":"B","italian":"Dove l'hai letta?","english":"Where did you read it?"},{"speaker":"A","italian":"In un messaggio che mi ha inviato un conoscente.","english":"In a message an acquaintance sent me."},{"speaker":"B","italian":"C'è un articolo o un annuncio ufficiale?","english":"Is there an article or an official announcement?"},{"speaker":"A","italian":"No, soltanto una fotografia senza data.","english":"No, just a photograph without a date."},{"speaker":"B","italian":"Allora non possiamo considerarla una conferma.","english":"Then we can't consider that confirmation."},{"speaker":"A","italian":"Hai ragione. Controllo il sito della compagnia.","english":"You're right. I'll check the company's website."},{"speaker":"B","italian":"Che cosa dice?","english":"What does it say?"},{"speaker":"A","italian":"Che c'è uno sconto per gli studenti, ma solo domenica.","english":"That there's a student discount, but only on Sunday."},{"speaker":"B","italian":"Quindi la notizia era sbagliata.","english":"So the news was wrong."},{"speaker":"A","italian":"Per fortuna non avevo ancora cambiato il biglietto.","english":"Luckily I hadn't changed my ticket yet."},{"speaker":"B","italian":"Un buon promemoria: prima verificare, poi condividere.","english":"A good reminder: check first, share later."}],"content_id":"B2-D15","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":16,"title":"Il riscaldamento capriccioso","lines":[{"speaker":"A","italian":"Il mio appartamento è freddo anche se il riscaldamento è acceso.","english":"My apartment is cold even though the heating is on."},{"speaker":"B","italian":"Hai controllato la temperatura sul termostato?","english":"Have you checked the temperature on the thermostat?"},{"speaker":"A","italian":"Sì, indica diciotto gradi.","english":"Yes, it reads eighteen degrees."},{"speaker":"B","italian":"Forse il radiatore è bloccato. Hai parlato con la proprietaria?","english":"Maybe the radiator is stuck. Have you spoken to the landlord?"},{"speaker":"A","italian":"Le ho inviato un messaggio, ma non ha ancora risposto.","english":"I sent her a message, but she hasn't replied yet."},{"speaker":"B","italian":"Prova a chiamarla. Nel frattempo posso prestarti una coperta.","english":"Try calling her. In the meantime, I can lend you a blanket."},{"speaker":"A","italian":"Grazie. È molto gentile da parte tua.","english":"Thanks. That's very kind of you."},{"speaker":"B","italian":"Anche il mio appartamento era freddo il mese scorso.","english":"My apartment was cold last month too."},{"speaker":"A","italian":"Come hai risolto il problema?","english":"How did you solve the problem?"},{"speaker":"B","italian":"È venuto un tecnico e ha sistemato la valvola.","english":"A technician came and fixed the valve."},{"speaker":"A","italian":"Allora chiederò la stessa cosa.","english":"Then I'll ask for the same thing."},{"speaker":"B","italian":"Ottimo. E per stasera vieni a bere un tè caldo da me.","english":"Good. And tonight come have some hot tea at my place."}],"content_id":"B2-D16","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":17,"title":"Una corsa troppo lunga","lines":[{"speaker":"A","italian":"Oggi non corro. Mi fa male il ginocchio.","english":"I'm not running today. My knee hurts."},{"speaker":"B","italian":"Ieri hai fatto una corsa più lunga del solito?","english":"Did you go for a longer run than usual yesterday?"},{"speaker":"A","italian":"Sì, quasi dodici chilometri. Non ero preparato.","english":"Yes, almost twelve kilometres. I wasn't prepared."},{"speaker":"B","italian":"Allora forse hai aumentato la distanza troppo in fretta.","english":"Then perhaps you increased the distance too quickly."},{"speaker":"A","italian":"Volevo migliorare il mio risultato.","english":"I wanted to improve my result."},{"speaker":"B","italian":"Capisco, ma il riposo fa parte dell'allenamento.","english":"I understand, but rest is part of training."},{"speaker":"A","italian":"Posso almeno fare una passeggiata?","english":"Can I at least go for a walk?"},{"speaker":"B","italian":"Se il dolore continua, è meglio chiedere un parere medico.","english":"If the pain continues, it's better to seek medical advice."},{"speaker":"A","italian":"Hai ragione. Non voglio correre rischi inutili.","english":"You're right. I don't want to take unnecessary risks."},{"speaker":"B","italian":"Nel frattempo possiamo andare al cinema.","english":"Meanwhile, we can go to the cinema."},{"speaker":"A","italian":"Questa è una proposta che accetto subito.","english":"That's an offer I'll accept immediately."},{"speaker":"B","italian":"Perfetto. E il popcorn lo dividiamo a metà.","english":"Perfect. And we'll share the popcorn half and half."}],"content_id":"B2-D17","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":18,"title":"Il biglietto del teatro","lines":[{"speaker":"A","italian":"Ho comprato due biglietti per il teatro di venerdì.","english":"I bought two theatre tickets for Friday."},{"speaker":"B","italian":"Fantastico. Che spettacolo vediamo?","english":"Fantastic. What show are we seeing?"},{"speaker":"A","italian":"Una commedia italiana. Dicono che sia molto divertente.","english":"An Italian comedy. They say it's very funny."},{"speaker":"B","italian":"Hai controllato l'orario? Venerdì finisco tardi.","english":"Have you checked the time? I finish late on Friday."},{"speaker":"A","italian":"Comincia alle ventuno, quindi abbiamo un po' di tempo.","english":"It starts at nine p.m., so we have some time."},{"speaker":"B","italian":"Dove sono i nostri sedili?","english":"Where are our seats?"},{"speaker":"A","italian":"In seconda fila, quasi al centro.","english":"In the second row, almost in the middle."},{"speaker":"B","italian":"Speriamo di non dover salire sul palco!","english":"Let's hope we don't have to go on stage!"},{"speaker":"A","italian":"Non credo. Però forse gli attori parleranno con il pubblico.","english":"I don't think so. But perhaps the actors will speak with the audience."},{"speaker":"B","italian":"Allora ripasso qualche frase italiana prima di uscire.","english":"Then I'll review a few Italian phrases before going out."},{"speaker":"A","italian":"Ottima idea. Dopo lo spettacolo possiamo cenare lì vicino.","english":"Great idea. After the show we can have dinner nearby."},{"speaker":"B","italian":"Va bene, purché non scegliamo un ristorante troppo caro.","english":"Fine, as long as we don't choose a restaurant that's too expensive."}],"content_id":"B2-D18","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":19,"title":"Dopo il litigio","lines":[{"speaker":"A","italian":"Non volevo offenderti ieri. Mi dispiace.","english":"I didn't mean to offend you yesterday. I'm sorry."},{"speaker":"B","italian":"Grazie per avermelo detto. Sono rimasta delusa, però.","english":"Thanks for telling me. I was disappointed, though."},{"speaker":"A","italian":"Lo capisco. Ho risposto troppo in fretta e senza ascoltare.","english":"I understand. I answered too quickly and without listening."},{"speaker":"B","italian":"Il problema non era la decisione, ma il modo in cui l'hai spiegata.","english":"The problem wasn't the decision but how you explained it."},{"speaker":"A","italian":"Hai ragione. Possiamo parlarne con calma?","english":"You're right. Can we talk about it calmly?"},{"speaker":"B","italian":"Sì. Vorrei che mi chiedessi la mia opinione prima di decidere.","english":"Yes. I'd like you to ask my opinion before deciding."},{"speaker":"A","italian":"È una richiesta giusta. Lo farò.","english":"That's a fair request. I'll do that."},{"speaker":"B","italian":"E io proverò a dire subito quando qualcosa mi disturba.","english":"And I'll try to say right away when something bothers me."},{"speaker":"A","italian":"Mi sembra una buona soluzione per entrambi.","english":"That seems like a good solution for both of us."},{"speaker":"B","italian":"Anche a me. La fiducia richiede pazienza.","english":"It does to me too. Trust requires patience."},{"speaker":"A","italian":"Allora ricominciamo da un caffè?","english":"Then shall we start over with a coffee?"},{"speaker":"B","italian":"Volentieri. Ma questa volta offri tu.","english":"Gladly. But this time you're buying."}],"content_id":"B2-D19","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"},{"id":20,"title":"La prova orale","lines":[{"speaker":"A","italian":"Domani ho una prova orale di italiano. Sono nervoso.","english":"Tomorrow I have an oral Italian exam. I'm nervous."},{"speaker":"B","italian":"Facciamo una simulazione. Raccontami la tua giornata.","english":"Let's do a mock test. Tell me about your day."},{"speaker":"A","italian":"Mi sveglio alle sette, mi lavo e poi preparo la colazione.","english":"I wake up at seven, wash, and then make breakfast."},{"speaker":"B","italian":"Bene. E ieri che cosa hai fatto?","english":"Good. And what did you do yesterday?"},{"speaker":"A","italian":"Ieri ho visitato una mostra e ho incontrato un amico.","english":"Yesterday I visited an exhibition and met a friend."},{"speaker":"B","italian":"Ottimo. Adesso usa il futuro: che cosa farai sabato?","english":"Excellent. Now use the future: what will you do on Saturday?"},{"speaker":"A","italian":"Sabato studierò la mattina e la sera andrò a teatro.","english":"On Saturday I'll study in the morning and go to the theatre in the evening."},{"speaker":"B","italian":"Molto bene. Però pronuncia lentamente la parola «teatro».","english":"Very good. But pronounce the word “teatro” slowly."},{"speaker":"A","italian":"Te-a-tro. Va meglio?","english":"Te-a-tro. Is that better?"},{"speaker":"B","italian":"Sì. Ricorda di usare anche «mentre» e «quindi».","english":"Yes. Remember to use “while” and “therefore” too."},{"speaker":"A","italian":"Allora: mentre studio, bevo un caffè; quindi non mi addormento.","english":"Then: while I study, I drink coffee; so I don't fall asleep."},{"speaker":"B","italian":"Perfetto. Hai fatto progressi. Adesso rilassati un po'.","english":"Perfect. You've made progress. Now relax a little."}],"content_id":"B2-D20","audio_path":null,"audio_language":"it","speakers":"Italian browser voices; female preferred when available"}],"audio_manifest":{"playback":"SpeechSynthesis: user-selected Italian browser voice, female preferred","recorded_audio_included":false},"learning_strategy":{"weekly_schedule":[{"day":1,"new_words":[1,50],"new_verbs":[1,10],"old_review":true,"review_block_1":true},{"day":2,"new_words":[51,100],"new_verbs":[11,20],"old_review":true,"review_block_1":true},{"day":3,"new_words":[101,150],"new_verbs":[21,30],"old_review":true,"review_block_1":true},{"day":4,"new_words":[151,200],"new_verbs":[31,40],"old_review":true,"review_block_1":true},{"day":5,"new_words":[201,250],"new_verbs":[41,50],"old_review":true,"review_block_1":true},{"day":6,"activities":["one continuous long Italian text -> English","20 short English texts -> Italian","mixed Block 1 + Block 2 recall","weakest-forms retest"]},{"day":7,"activities":["20 new dialogue listening and shadowing","dialogue role-play and speaking","deferred retests of weak Block 1 / Block 2 forms","active vocabulary progress audit"]}],"progress":{"status_levels":["introduced","practicing","active_learned","stable"],"status_supplements":["review_due","at_risk"],"active_learned_minimum":{"independent_correct_productions":3,"distinct_days":2,"distinct_task_contexts":2,"last_two_active_attempts":"both correct","requires_active_italian_production":true},"stable_minimum":{"independent_correct_productions":5,"distinct_days":3,"successful_review_after_7_days":true},"conjugation_mastery":{"lemma_active_min_productions":3,"distinct_tenses":2,"distinct_persons":2,"distinct_days":2,"full_form_grid":"4 tenses × 6 persons","supplemental":"past participle and auxiliary"},"spaced_review_days":[1,3,7,14,30],"count_exclusions":["answer_revealed","copied_repetition","passive_reading","audio_listening","multiple_choice_recognition","self_rated_flashcard_known"],"error_codes":["wrong_article","wrong_gender","wrong_number","accent","orthography","lexeme","tense","person","auxiliary","participle","agreement","semantic","pronunciation"],"attempt_fields":["attempt_id","user_id","content_id","form_id","timestamp","lesson_id","exercise_type","direction","context_id","is_independent","raw_response","normalized_response","accepted","error_codes","review_due_at"],"block_1_review":"Continue reviewing Block 1 without counting passive exposure as Block 2 mastery.","block_2_start":"All new entries start as introduced (not mastered)."}},"counts":{"vocabulary":250,"verbs":50,"idioms":50,"grammar":80,"long_readings":5,"short_readings":20,"dialogues":20,"translation_exercises":20},"idioms":[{"id":1,"content_id":"B2-I01","it":"non vedo l’ora","en":"I cannot wait","example_it":"Non vedo l’ora di partire.","example_en":"I cannot wait to leave."},{"id":2,"content_id":"B2-I02","it":"fare attenzione","en":"to pay attention / be careful","example_it":"Fai attenzione quando attraversi.","example_en":"Be careful when you cross."},{"id":3,"content_id":"B2-I03","it":"dare una mano","en":"to lend a hand","example_it":"Mi dai una mano con le valigie?","example_en":"Will you help me with the suitcases?"},{"id":4,"content_id":"B2-I04","it":"fare due passi","en":"to go for a short walk","example_it":"Dopo cena facciamo due passi.","example_en":"After dinner we take a little walk."},{"id":5,"content_id":"B2-I05","it":"essere in ritardo","en":"to be late","example_it":"Siamo in ritardo per il cinema.","example_en":"We are late for the cinema."},{"id":6,"content_id":"B2-I06","it":"essere d’accordo","en":"to agree","example_it":"Sono d’accordo con la tua idea.","example_en":"I agree with your idea."},{"id":7,"content_id":"B2-I07","it":"andare d’accordo","en":"to get along","example_it":"I due coinquilini vanno d’accordo.","example_en":"The two roommates get along."},{"id":8,"content_id":"B2-I08","it":"a proposito","en":"by the way","example_it":"A proposito, hai chiamato tua sorella?","example_en":"By the way, did you call your sister?"},{"id":9,"content_id":"B2-I09","it":"in bocca al lupo","en":"good luck","example_it":"Domani hai l’esame? In bocca al lupo!","example_en":"You have an exam tomorrow? Good luck!"},{"id":10,"content_id":"B2-I10","it":"magari!","en":"if only! / I wish!","example_it":"Vuoi venire al mare? Magari!","example_en":"Want to come to the sea? I wish I could!"},{"id":11,"content_id":"B2-I11","it":"fare una pausa","en":"to take a break","example_it":"Facciamo una pausa dopo questa lezione.","example_en":"Let's take a break after this lesson."},{"id":12,"content_id":"B2-I12","it":"dare un'occhiata","en":"to have a look","example_it":"Puoi dare un'occhiata al mio messaggio?","example_en":"Can you have a look at my message?"},{"id":13,"content_id":"B2-I13","it":"prendere un appuntamento","en":"to make an appointment","example_it":"Devo prendere un appuntamento dal dentista.","example_en":"I need to make a dentist's appointment."},{"id":14,"content_id":"B2-I14","it":"fissare un incontro","en":"to arrange a meeting","example_it":"Fissiamo un incontro per venerdì.","example_en":"Let's arrange a meeting for Friday."},{"id":15,"content_id":"B2-I15","it":"mettersi in fila","en":"to stand in line","example_it":"Dobbiamo metterci in fila alla biglietteria.","example_en":"We have to stand in line at the ticket office."},{"id":16,"content_id":"B2-I16","it":"fare la spesa","en":"to do the grocery shopping","example_it":"Oggi faccio la spesa al supermercato.","example_en":"Today I'm doing the grocery shopping at the supermarket."},{"id":17,"content_id":"B2-I17","it":"fare colazione","en":"to have breakfast","example_it":"Di domenica facciamo colazione tardi.","example_en":"On Sundays we have breakfast late."},{"id":18,"content_id":"B2-I18","it":"prendere il sole","en":"to sunbathe","example_it":"In spiaggia prendiamo il sole al mattino.","example_en":"On the beach we sunbathe in the morning."},{"id":19,"content_id":"B2-I19","it":"fare tardi","en":"to stay out late","example_it":"Ieri abbiamo fatto tardi con gli amici.","example_en":"Yesterday we stayed out late with friends."},{"id":20,"content_id":"B2-I20","it":"fare in tempo","en":"to make it in time","example_it":"Se usciamo ora, facciamo in tempo.","example_en":"If we leave now, we'll make it in time."},{"id":21,"content_id":"B2-I21","it":"perdere tempo","en":"to waste time","example_it":"Non voglio perdere tempo in coda.","example_en":"I don't want to waste time in the queue."},{"id":22,"content_id":"B2-I22","it":"passare il tempo","en":"to pass the time","example_it":"Leggo per passare il tempo in treno.","example_en":"I read to pass the time on the train."},{"id":23,"content_id":"B2-I23","it":"prendersela comoda","en":"to take it easy","example_it":"Oggi è festa, possiamo prendercela comoda.","example_en":"It's a holiday today, we can take it easy."},{"id":24,"content_id":"B2-I24","it":"mettersi comodi","en":"to make oneself comfortable","example_it":"Entrate e mettetevi comodi.","example_en":"Come in and make yourselves comfortable."},{"id":25,"content_id":"B2-I25","it":"non c'è male","en":"not bad","example_it":"Come va il lavoro? Non c'è male.","example_en":"How's work? Not bad."},{"id":26,"content_id":"B2-I26","it":"così così","en":"so-so","example_it":"Come stai? Così così.","example_en":"How are you? So-so."},{"id":27,"content_id":"B2-I27","it":"in un certo senso","en":"in a sense","example_it":"In un certo senso hai ragione.","example_en":"In a sense you're right."},{"id":28,"content_id":"B2-I28","it":"se non sbaglio","en":"if I'm not mistaken","example_it":"Se non sbaglio, il treno parte alle nove.","example_en":"If I'm not mistaken, the train leaves at nine."},{"id":29,"content_id":"B2-I29","it":"per caso","en":"by any chance","example_it":"Hai per caso una penna?","example_en":"Do you have a pen by any chance?"},{"id":30,"content_id":"B2-I30","it":"in ogni caso","en":"in any case","example_it":"In ogni caso, ti chiamo stasera.","example_en":"In any case, I'll call you tonight."},{"id":31,"content_id":"B2-I31","it":"a ogni costo","en":"at all costs","example_it":"Vuole arrivare in tempo a ogni costo.","example_en":"He wants to arrive on time at all costs."},{"id":32,"content_id":"B2-I32","it":"per niente","en":"not at all","example_it":"Non sono per niente stanco.","example_en":"I'm not tired at all."},{"id":33,"content_id":"B2-I33","it":"del tutto","en":"completely","example_it":"Non sono del tutto sicura.","example_en":"I'm not completely sure."},{"id":34,"content_id":"B2-I34","it":"più che altro","en":"more than anything","example_it":"Sono qui più che altro per studiare.","example_en":"I'm here more than anything to study."},{"id":35,"content_id":"B2-I35","it":"dare fastidio","en":"to bother / annoy","example_it":"Ti dà fastidio se apro la finestra?","example_en":"Does it bother you if I open the window?"},{"id":36,"content_id":"B2-I36","it":"avere sonno","en":"to be sleepy","example_it":"Ho sonno, vado a letto presto.","example_en":"I'm sleepy, I'm going to bed early."},{"id":37,"content_id":"B2-I37","it":"avere paura","en":"to be afraid","example_it":"Mio fratello ha paura dei cani.","example_en":"My brother is afraid of dogs."},{"id":38,"content_id":"B2-I38","it":"avere caldo","en":"to feel hot","example_it":"Ho caldo, possiamo aprire la finestra?","example_en":"I'm hot, can we open the window?"},{"id":39,"content_id":"B2-I39","it":"avere freddo","en":"to feel cold","example_it":"Ho freddo senza giacca.","example_en":"I'm cold without a jacket."},{"id":40,"content_id":"B2-I40","it":"avere torto","en":"to be wrong","example_it":"Stavolta hai torto, controlla l'orario.","example_en":"This time you're wrong, check the schedule."},{"id":41,"content_id":"B2-I41","it":"essere di buon umore","en":"to be in a good mood","example_it":"Oggi sono di buon umore.","example_en":"I'm in a good mood today."},{"id":42,"content_id":"B2-I42","it":"essere di cattivo umore","en":"to be in a bad mood","example_it":"Lui è di cattivo umore stamattina.","example_en":"He's in a bad mood this morning."},{"id":43,"content_id":"B2-I43","it":"tornare utile","en":"to come in handy","example_it":"Questo dizionario può tornare utile.","example_en":"This dictionary may come in handy."},{"id":44,"content_id":"B2-I44","it":"valere la pena","en":"to be worth it","example_it":"Vale la pena visitare il castello.","example_en":"It's worth visiting the castle."},{"id":45,"content_id":"B2-I45","it":"mettere a posto","en":"to tidy up / put away","example_it":"Devo mettere a posto la scrivania.","example_en":"I need to tidy up the desk."},{"id":46,"content_id":"B2-I46","it":"fare ordine","en":"to put things in order","example_it":"Prima di partire faccio ordine in camera.","example_en":"Before leaving, I tidy my room."},{"id":47,"content_id":"B2-I47","it":"non c'entra","en":"that's unrelated","example_it":"Il prezzo non c'entra con il problema.","example_en":"The price has nothing to do with the problem."},{"id":48,"content_id":"B2-I48","it":"non fa per me","en":"it's not for me","example_it":"Quel tipo di lavoro non fa per m _ treno.","answer":"in","explanation":"In treno specifies transport.","english":"I'm traveling by train."},{"id":10,"content_id":"B2-G10","category":"Prepositions","prompt":"Lavoro ___ lunedì ___ venerdì.","answer":"dal ... al","explanation":"Da + il and a + il mark an interval.","english":"I work from Monday to Friday."},{"id":11,"content_id":"B2-G11","category":"Question words","prompt":"___ libro preferisci?","answer":"Quale","explanation":"Quale selects one from a set.","english":"Which book do you prefer?"},{"id":12,"content_id":"B2-G12","category":"Question words","prompt":"___ persone arrivano?","answer":"Quante","explanation":"Quante agrees with feminine plural persone.","english":"How many people are arriving?"},{"id":13,"content_id":"B2-G13","category":"Question words","prompt":"___ vuoi invitare?","answer":"Chi","explanation":"Chi means who.","english":"Who do you want to invite?"},{"id":14,"content_id":"B2-G14","category":"Question words","prompt":"___ studi italiano?","answer":"Perché","explanation":"Perché asks why.","english":"Why do you study Italian?"},{"id":15,"content_id":"B2-G15","category":"Question words","prompt":"___ significa questa parola?","answer":"Che cosa","explanation":"Che cosa means what.","english":"What does this word mean?"},{"id":16,"content_id":"B2-G16","category":"Pronouns","prompt":"Ho chiamato Maria e ___ ho parlato.","answer":"le","explanation":"Le is the indirect-object pronoun her.","english":"I called Maria and spoke to her."},{"id":17,"content_id":"B2-G17","category":"Pronouns","prompt":"Vedi Marco? ___ vedo ogni giorno.","answer":"Lo","explanation":"Lo is masculine singular direct object.","english":"Do you see Marco? I see him every day."},{"id":18,"content_id":"B2-G18","category":"Pronouns","prompt":"La borsa? ___ trovo subito.","answer":"La","explanation":"La is feminine singular direct object.","english":"The bag? I'll find it right away."},{"id":19,"content_id":"B2-G19","category":"Pronouns","prompt":"Scrivi a me? er":"Mi","explanation":"Mi piace + infinitive.","english":"I like walking."},{"id":40,"content_id":"B2-G40","category":"Clitics and common forms","prompt":"È importante: ___ ricordiamo.","answer":"ce ne","explanation":"Ce ne ricordiamo = we remember it.","english":"It's important; we remember it."},{"id":41,"content_id":"B2-G41","category":"Articles","prompt":"___ psicologo arriva alle nove.","answer":"Lo","explanation":"Lo before ps + consonant.","english":"The psychologist arrives at nine."},{"id":42,"content_id":"B2-G42","category":"Articles","prompt":"Cerco ___ appartamento tranquillo.","answer":"un","explanation":"Un before a masculine noun starting with a vowel.","english":"I'm looking for a quiet apartment."},{"id":43,"content_id":"B2-G43","category":"Articles","prompt":"___ insegnanti sono già qui.","answer":"Gli","explanation":"Masculine plural article before a vowel.","english":"The teachers are already here."},{"id":44,"content_id":"B2-G44","category":"Articles","prompt":"Ho parlato con ___ amica di Giulia.","answer":"un’","explanation":"Feminine indefinite article before a vowel.","english":"I spoke with a female friend of Giulia's."},{"id":45,"content_id":"B2-G45","category":"Articles","prompt":"___ studenti aspettano fuori.","answer":"Gli","explanation":"Gli is the plural of lo.","english":"The students are waiting outside."},{"id":46,"content_id":"B2-G46","category":"Prepositions","prompt":"Siamo arrivati ___ aeroporto.","answer":"all’","explanation":"A + l’ becomes all’.","english":"We've arrived at the airport."},{"id":47,"content_id":"B2-G47","category":"Prepositions","prompt":"Il documento è ___ scrivania.","answer":"sulla","explanation":"Su + la becomes sulla.","english":"The document is on the desk."},{"id":48,"content_id":"B2-G48","category":"Prepositions","prompt":"Vado ___ farmacia.","answer":"in","explanation":"In farmacia is a normal location expression.","english":"I'm going to the pharmacy."},{"id":49,"content_id":"B2-G49","category":"Prepositions","prompt":"Il treno parte ___ binario tre.","answer":"dal","explanation":"Da + il becomes dal.","english":"The train leaves from platform three."},{"id":50,"content_id":"B2-G50","category":"Prepositions","prompt":"Ci vediamo ___ mezzogiorno.","answer":"a","explanation":"A mezzogiorno is the time expression.","english":"See you at noon."},{"id":51,"content_id":"B2-G51","category":"Question words","prompt":"___ delle due strade è più corta?","answer":"Quale","explanation":"Quale asks which.","english":"Which of the two roads is shorter?"},{"id":52,"content_id":"B2-G52","category":"Question words","prompt":"___ tempo ci vuole?","answer":"Quanto","explanation":"Quanto modifies masculine singular tempo.","english":"How much time does it take?"},{"id":53,"content_id":"B2-G53","category":"Question words","prompt":"___ hai comprato ieri?","answer":"Che cosa","explanation":"Che cosa asks what.","english":"What did you buy yesterday?"},{"id":54,"content_id":"B2-G54","category":"Question words","prompt":"___ hai telefonato?","answer":"A chi","explanation":"A chi asks to whom.","english":"Whom did you call?"},{"id":55,"content_id":"B2-G55","category":"Question words","prompt":"___ sei tornato a casa?","answer":"Quando","explanation":"Quando asks when.","english":"When did you return home?"},{"id":56,"content_id":"B2-G56","category":"Pronouns","prompt":"Hai visto Elena? Sì, ___ ho vista.","answer":"l’","explanation":"L’ contracts la before ho.","english":"Have you seen Elena? Yes, I saw her."},{"id":57,"content_id":"B2-G57","category":"Pronouns","prompt":"Il biglietto? ___ compro online.","answer":"Lo","explanation":"Lo replaces il biglietto.","english":"The ticket? I'll buy it online."},{"id":58,"content_id":"B2-G58","category":"Pronouns","prompt":"I biscotti? ___ mangio dopo.","answer":"Li","explanation":"Li replaces masculine plural biscotti.","english":"The cookies? I'll eat them later."},{"id":59,"content_id":"B2-G59","category":"Pronouns","prompt":"Non conosco qu
